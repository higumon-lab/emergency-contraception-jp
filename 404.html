<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#6534c9">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  /* 本体と同じマカロン配色にそろえています。
     ここだけ別の色にすると、迷い込んだときに別サイトに見えてしまいます。 */
  :root{
    color-scheme:light;
    --paper:#fdfcff; --ink:#2f2b3a; --ink-2:#494357;
  }
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;line-height:1.85;
    background:
      radial-gradient(60% 50% at 12% 4%, rgb(227 218 255 / .55) 0%, transparent 60%),
      radial-gradient(55% 45% at 92% 12%, rgb(255 220 202 / .5) 0%, transparent 62%),
      radial-gradient(60% 50% at 50% 100%, rgb(200 247 227 / .45) 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
  h1{margin:0 0 8px;font-size:20px;font-weight:700;line-height:1.5}
  p{margin:0;color:var(--ink-2);font-size:14px}
  a{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:52px;margin-top:22px;padding:14px 26px;border-radius:999px;
    background:linear-gradient(100deg,#6534c9 0%,#b02a86 100%);
    color:#fff;text-decoration:none;font-weight:700;font-size:15px;
    box-shadow:0 8px 22px rgb(101 52 201 / .22)}
  @media (prefers-color-scheme:dark){
    :root{--paper:#141119; --ink:#f2eff7; --ink-2:#c9c3d6}
    body{background:
      radial-gradient(60% 50% at 12% 4%, rgb(47 39 70 / .8) 0%, transparent 60%),
      radial-gradient(55% 45% at 92% 12%, rgb(64 42 38 / .7) 0%, transparent 62%),
      var(--paper)}
    a{background:linear-gradient(100deg,#c4a8ff 0%,#ff9ec4 100%);color:#1b1622;
      box-shadow:none}
  }
</style>
</head>
<body>
  <div>
    <h1>ページが見つかりません</h1>
    <p>Page not found · 페이지를 찾을 수 없습니다 · 页面未找到<br>Không tìm thấy trang · पृष्ठ फेला परेन · Halaman tidak dijumpai</p>
    <a href="/">緊急避妊薬の情報を見る →</a>
  </div>
</body>
</html>
