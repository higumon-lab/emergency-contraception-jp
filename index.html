<style>
/* ── 配色 ──────────────────────────────────────────────
   マカロンのような淡い色を「面」に使い、文字は濃いすみれ墨で置きます。
   淡い色は文字色には使いません（コントラストが取れないため）。

   透明感は、色のついた背景の上に、半透明の白＋ぼかし（backdrop-filter）
   を重ねて出しています。
   ────────────────────────────────────────────────── */
:root {
  color-scheme: light;
  --wrap-pad: 22px;

  /* マカロンの6色。透明度を調整できるよう rgb 成分でも持たせています。
     rgb(var(--mint-rgb) / 0.8) のように書くと、下の色が透けます。 */
  --mint-rgb: 200 247 227;
  --lavender-rgb: 227 218 255;
  --peach-rgb: 255 220 202;
  --rose-rgb: 255 217 232;
  --butter-rgb: 255 242 196;
  --sky-rgb: 210 232 255;

  --mint: rgb(var(--mint-rgb));
  --lavender: rgb(var(--lavender-rgb));
  --peach: rgb(var(--peach-rgb));
  --rose: rgb(var(--rose-rgb));
  --butter: rgb(var(--butter-rgb));
  --sky: rgb(var(--sky-rgb));

  --paper: #fdfcff;
  --surface: rgba(255, 255, 255, 0.74);
  --surface-solid: #ffffff;
  --surface-soft: rgba(255, 255, 255, 0.5);
  --card: rgba(255, 255, 255, 0.74);

  --ink: #2f2b3a;
  --ink-2: #494357;
  --ink-3: #5d5770;

  --line: rgba(255, 255, 255, 0.9);
  --line-soft: rgba(101, 52, 201, 0.14);
  --line-strong: rgba(101, 52, 201, 0.24);

  --accent: #6534c9;
  --accent-hover: #5228a8;
  --focus: #5228a8;

  --ok: #14663f;
  --mid: #8a3f31;
  --low: #8a4a1c;

  --radius: 20px;
  --radius-small: 14px;
  --shadow: 0 12px 34px rgba(101, 52, 201, 0.1);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  /* 淡い色のにじみを画面に固定して敷き、その上に半透明の白を重ねます。
     これが「透明感」の土台です。 */
  background:
    radial-gradient(60rem 40rem at 12% -8%, var(--mint) 0, transparent 60%),
    radial-gradient(52rem 38rem at 92% 4%, var(--lavender) 0, transparent 62%),
    radial-gradient(48rem 36rem at 78% 42%, var(--peach) 0, transparent 58%),
    radial-gradient(44rem 34rem at 6% 68%, var(--sky) 0, transparent 60%),
    radial-gradient(46rem 34rem at 88% 92%, var(--rose) 0, transparent 60%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink);
  /* 本文は Zen Kaku Gothic New（読みやすい現代的なゴシック）。
     欧文と数字は Outfit で、都会的な印象にしています。
     韓国語・中国語・ネパール語はそれぞれ Noto Sans を当てています。 */
  font-family:
    "Outfit", "Zen Kaku Gothic New", "Noto Sans KR", "Noto Sans SC",
    "Noto Sans Devanagari", system-ui, -apple-system, "Hiragino Sans",
    "Yu Gothic", sans-serif;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.85;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

button,
input {
  font: inherit;
}

button,
a {
  touch-action: manipulation;
}

a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

a:not(.btn) {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
}

/* 帯（全幅）。背景のにじみを透かしつつ、白いすりガラスを重ねます。 */
.band {
  padding-block: clamp(48px, 10vw, 80px);
  background: transparent;
}

.band.tint {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-block: 1px solid rgba(255, 255, 255, 0.75);
}

.band > .inner {
  width: min(100%, 680px);
  margin-inline: auto;
  padding-inline: var(--wrap-pad);
}

/* 冒頭は背景のにじみをそのまま見せます（塗りつぶさない）。 */
.hero h1 {
  color: var(--ink);
}

.hero .lead {
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 400;
  line-height: 2;
}

.hero .label {
  border: 1px solid rgba(255, 255, 255, 0.9);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.75) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 6px 16px rgba(101, 52, 201, 0.1);
  color: var(--accent);
  backdrop-filter: blur(10px) saturate(1.4);
  -webkit-backdrop-filter: blur(10px) saturate(1.4);
}

/* 見出しの左に太いオレンジの縦棒（前身サイトと同じ形） */
h2 {
  position: relative;
  padding-left: 18px;
}

h2::before {
  content: "";
  position: absolute;
  top: 0.18em;
  bottom: 0.18em;
  left: 0;
  display: block;
  width: 5px;
  margin: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, #6534c9 0%, #c02a6a 100%);
}

/* 見出しの上に置く小さなラベル。ピル形のバッジで見せます */
.label {
  display: inline-flex;
  align-items: center;
  margin: 0 0 18px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--lavender);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

/* 見出しは Zen Maru Gothic（丸みのある書体）。
   h1 には紫→マゼンタのグラデーションをかけています。
   両端とも白地で 5.5:1 以上あるので、グラデーションが効かない環境で
   単色になっても読めます。 */
h1,
h2,
h3,
.waytitle,
.blocktitle,
.noteboxtitle,
.faq summary,
.label {
  font-family:
    "Outfit", "Zen Maru Gothic", "Noto Sans KR", "Noto Sans SC",
    "Noto Sans Devanagari", system-ui, sans-serif;
}

h1 {
  max-width: 15em;
  margin: 0 0 22px;
  font-size: clamp(1.7rem, 6.8vw, 2.5rem);
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.01em;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 46%, #c02a6a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 翻訳データの中の改行をそのまま活かします。
   改行を入れていない言語は、これまでどおり自動で折り返します。 */
#t-title,
#t-subtitle {
  white-space: pre-line;
}

/* 見出しの上の余白は帯（.band の padding-block）が持つので、ここでは付けない */
h2 {
  margin: 0 0 22px;
  color: var(--ink);
  font-size: clamp(1.2rem, 4.8vw, 1.4rem);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

h3 {
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
}

p {
  margin: 0 0 14px;
}

small {
  display: block;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.75;
}

.lead {
  max-width: 42em;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.95;
}

.langbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.langbar ul {
  display: flex;
  flex-wrap: wrap;            /* 7言語すべてを画面内に表示する（横スクロールにしない） */
  justify-content: center;
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 0;
  gap: 4px;
  list-style: none;
}

.langbar li {
  flex: 0 0 auto;
}

.langbar button {
  min-width: 48px;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.langbar button:hover {
  background: var(--lavender);
  color: var(--accent);
}

.langbar button[aria-current="true"] {
  border-color: transparent;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(101, 52, 201, 0.26);
}

.tophint {
  margin: 0;
  padding: 11px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.7);
  background: rgba(255, 255, 255, 0.5);
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.6;
  text-align: center;
}

/* オレンジの面をしっかり見せたいので、上下の余白を大きくとる */
.hero {
  padding-block: clamp(52px, 12vw, 96px) clamp(52px, 12vw, 88px);
}

/* カウントダウンは帯そのものが青の面になるため、ここでは箱を持たない */
.focal {
  margin: 0;
}

.focal label {
  display: block;
  margin-bottom: 12px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
}

.focal input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}

.focal input:focus {
  border-color: var(--accent);
  outline: 3px solid rgba(36, 79, 94, 0.22);
  outline-offset: 2px;
}

.cdnum {
  margin: 24px 0 0;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: "Outfit", system-ui, sans-serif;
  font-size: clamp(2.6rem, 13vw, 4.2rem);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.03em;
  word-break: normal;
}

.cdnum .u {
  display: inline-block;
  margin: 4px 6px 0;
  color: var(--ink-2);
  -webkit-text-fill-color: var(--ink-2);
  font-family: "Zen Maru Gothic", "Outfit", system-ui, sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
}

.bar {
  position: relative;
  height: 6px;
  margin: 22px 0 14px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.7);
}

.bar i {
  position: absolute;
  inset: 0 auto 0 0;
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6534c9 0%, #c02a6a 100%);
  transition: width 0.4s ease;
}

.cdnote {
  margin: 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.75;
}

table.eff {
  width: 100%;
  margin: 0 0 12px;
  border-spacing: 0 7px;
  border-collapse: separate;
  table-layout: fixed;
  font-size: 15px;
}

table.eff th {
  padding: 0 10px 7px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-align: left;
  text-transform: uppercase;
}

table.eff th:last-child {
  text-align: right;
}

table.eff td {
  padding: 15px 12px;
  border-block: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

table.eff td:first-child {
  border-left: 1px solid var(--line);
  border-radius: var(--radius-small) 0 0 var(--radius-small);
}

table.eff td:last-child {
  border-right: 1px solid var(--line);
  border-radius: 0 var(--radius-small) var(--radius-small) 0;
  color: var(--ink);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  text-align: right;
}

table.eff tr.hit td {
  border-color: rgba(101, 52, 201, 0.3);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.7) 0%, rgb(var(--lavender-rgb) / 0.92) 100%);
  color: var(--ink);
}

/* 詳細度を table.eff tr.hit td と同じ (0,2,3) に上げ、記述順で勝たせる。
   これがないと 95%/85%/58% の色分けが打ち消されます。 */
table.eff tr td.v1 {
  color: var(--ok);
}

table.eff tr td.v2 {
  color: var(--mid);
}

table.eff tr td.v3 {
  color: var(--low);
}

/* 経路は前身サイトと同じくカードで見せる（白・角丸8px・細い枠・浅い影） */
.routes {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.route {
  min-width: 0;
  padding: clamp(22px, 6vw, 30px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

.route .no {
  display: block;
  margin-bottom: 12px;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.14em;
  font-variant-numeric: tabular-nums;
}

.route .hd {
  display: flex;
  min-width: 0;
  margin-bottom: 11px;
  gap: 8px 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.route .hd > * {
  min-width: 0;
}

.route .price {
  margin-left: auto;
  color: var(--ink-2);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.route p {
  margin: 0 0 19px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
}

.route .tag {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  margin: 0 0 14px;
  padding: 7px 14px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.85) 0%, rgb(var(--lavender-rgb) / 0.85) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

.btn {
  display: flex;
  width: 100%;
  min-height: 54px;
  padding: 14px 20px;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  border: 1px solid transparent;
  border-radius: 999px;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(101, 52, 201, 0.28);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  text-decoration: none;
  overflow-wrap: anywhere;
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.btn:hover {
  box-shadow: 0 12px 28px rgba(101, 52, 201, 0.36);
  transform: translateY(-1px);
}

.btn:hover,
.btn:focus {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.btn::after {
  content: "→";
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1;
}

.btn.sub {
  border-color: rgba(101, 52, 201, 0.4);
  background: rgba(255, 255, 255, 0.7);
  color: var(--accent);
  box-shadow: none;
}

.btn.sub:hover,
.btn.sub:focus {
  border-color: transparent;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(101, 52, 201, 0.28);
}

.btn + .btn {
  margin-top: 10px;
}

.know {
  border-top: 1px solid var(--line);
}

.know .item {
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}

.know .item p {
  margin: 8px 0 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 帯の中の囲み。相談窓口は白地の箱、72時間超のお知らせは線で強調する。 */
.callout {
  padding: clamp(24px, 6vw, 32px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

.callout.alert {
  border-color: var(--accent);
  border-left-width: 4px;
  background: var(--lavender);
}

.callout p {
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

.callout .btn.sub {
  border-color: var(--accent);
  background: var(--surface);
  color: var(--accent);
}

.callout .btn.sub:hover,
.callout .btn.sub:focus {
  background: var(--accent);
  color: #ffffff;
}

/* オンライン診療カードの中の「受け取り方2つ」と注意書き */
.ways {
  display: grid;
  margin: 0 0 18px;
  gap: 12px;
}

/* 淡い色の面は、べた塗りではなく「色つきのガラス」にしています。
   上から白い光が当たったように見せるため、
   斜めのグラデーション＋内側の白いハイライト＋下に落ちる影を重ねています。 */
.way {
  --tint: var(--mint-rgb);
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--tint) / 0.88) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.ways .way:nth-child(2) {
  --tint: var(--sky-rgb);
}

.ways .way:nth-child(3) {
  --tint: var(--butter-rgb);
}

.waytitle {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

/* カードの中で、囲みを単体で置くときの余白 */
.route > .way {
  margin: 0 0 18px;
}

/* 帯の中に直接置く囲み */
.inner > .way {
  margin-top: 22px;
}

/* 【〜】のような小見出し */
.blocktitle {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

.way p:last-child,
.notebox p:last-child {
  margin: 0;
}

.notebox {
  margin: 0 0 18px;
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--rose-rgb) / 0.9) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.noteboxtitle {
  margin: 0 0 8px;
  color: var(--accent);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

/* ===== ここから、前身サイトにあった4つの内容を作り直したもの ===== */

/* 購入の流れ: 経路ごとの手順を番号つきで分解して見せる */
.steps {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.stepgroup {
  padding: clamp(22px, 6vw, 30px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

.stepgroup h3 {
  margin-bottom: 16px;
}

.stepgroup ol {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: step;
}

.stepgroup li {
  position: relative;
  padding: 0 0 18px 40px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
  counter-increment: step;
}

/* 手順どうしを縦線でつなぐ（最後の1つには引かない） */
.stepgroup li::before {
  content: counter(step);
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  width: 26px;
  height: 26px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stepgroup li::after {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 4px;
  left: 13px;
  width: 1px;
  background: var(--line);
}

.stepgroup li:last-child {
  padding-bottom: 0;
}

.stepgroup li:last-child::after {
  display: none;
}

/* 服用前チェック: 「してはいけない」と「相談して」の2群 */
.checkgroup + .checkgroup {
  margin-top: 26px;
}

.checkgroup h3 {
  margin-bottom: 6px;
}

.checkgroup > p {
  margin: 0 0 14px;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1.75;
}

.checklist {
  margin: 0;
  padding: 0;
  list-style: none;
}

.checklist li {
  position: relative;
  padding: 13px 0 13px 32px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.75;
}

.checklist li::before {
  position: absolute;
  top: 13px;
  left: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.75;
}

.checklist.no li::before {
  content: "\00d7";
  color: var(--accent);
}

.checklist.ask li::before {
  content: "!";
  color: var(--ink-3);
}

/* 授乳中は「飲めない」ではなく「気をつけてほしい」ことなので、
   × ではなく落ち着いた印にしています。 */
.checklist.note li::before {
  content: "!";
  top: 15px;
  display: flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color: var(--accent);
  font-size: 12px;
  line-height: 1;
}

/* よくある質問 */
.faq {
  margin-top: 26px;
  border-top: 1px solid var(--line);
}

.faq details {
  border-bottom: 1px solid var(--line);
}

.faq summary {
  display: flex;
  min-height: 56px;
  padding: 16px 32px 16px 0;
  gap: 12px;
  align-items: center;
  color: var(--ink);
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: "+";
  position: absolute;
  right: 0;
  color: var(--accent);
  font-size: 20px;
  font-weight: 700;
}

.faq details[open] summary::after {
  content: "\2212";
}

.faq details {
  position: relative;
}

.faq .answer {
  margin: 0;
  padding: 0 0 20px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 製品情報の表 */
table.spec {
  width: 100%;
  margin-top: 26px;
  border-collapse: collapse;
  font-size: 15px;
}

table.spec th,
table.spec td {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  line-height: 1.7;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

table.spec th {
  width: 38%;
  padding-right: 14px;
  color: var(--ink-3);
  font-size: 14px;
  font-weight: 700;
}

table.spec td {
  color: var(--ink-2);
}

footer {
  padding-top: 4px;
}

footer h3 {
  margin-bottom: 14px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

footer p {
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.85;
}

.exitbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 9px 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.75);
  background: rgba(255, 255, 255, 0.72);
  text-align: right;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.exitbtn {
  min-height: 48px;
  padding: 10px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
}

.exitbtn:hover {
  border-color: var(--accent);
  background: var(--lavender);
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 420px) {
  :root {
    --wrap-pad: 16px;
  }

  .langbar {
    padding-inline: 8px;
  }

  .route .price {
    width: 100%;
    margin-left: 0;
  }

  table.eff {
    font-size: 14px;
  }

  table.eff th,
  table.eff td {
    padding-inline: 8px;
  }
}

@media (prefers-color-scheme: dark) {
  /* ダークでも、淡い色のにじみは残します。面を暗くして文字を明るくします。 */
  :root {
    color-scheme: dark;
    --mint-rgb: 29 59 49;
    --lavender-rgb: 47 39 70;
    --peach-rgb: 61 43 38;
    --rose-rgb: 58 36 48;
    --butter-rgb: 58 51 32;
    --sky-rgb: 31 50 66;

    --paper: #141119;
    --surface: rgba(40, 35, 50, 0.66);
    --surface-solid: #241f2e;
    --surface-soft: rgba(40, 35, 50, 0.45);
    --card: rgba(42, 37, 53, 0.7);

    --ink: #f2eff7;
    --ink-2: #cec8da;
    --ink-3: #ada6bc;

    --line: rgba(255, 255, 255, 0.12);
    --line-soft: rgba(255, 255, 255, 0.14);
    --line-strong: rgba(255, 255, 255, 0.24);

    --accent: #c4b1ee;
    --accent-hover: #d8cbf5;
    --focus: #c4b1ee;

    --ok: #7fd0a6;
    --mid: #f0a396;
    --low: #eeae79;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  .band.tint {
    background: rgba(255, 255, 255, 0.05);
    border-block-color: rgba(255, 255, 255, 0.09);
  }

  .tophint {
    background: rgba(255, 255, 255, 0.05);
    border-bottom-color: rgba(255, 255, 255, 0.09);
  }

  .hero .label {
    background: rgba(255, 255, 255, 0.1);
    color: var(--accent);
  }

  .bar {
    background: rgba(255, 255, 255, 0.14);
  }

  /* 暗い地では、見出しと数字のグラデーションを明るい側に振り替えます。
     そのままだと濃い紫が背景に沈んで読めなくなるためです。 */
  h1 {
    background: linear-gradient(100deg, #c4a8ff 0%, #e6a6ff 46%, #ff9ec4 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .cdnum {
    background: linear-gradient(100deg, #c4a8ff 0%, #ff9ec4 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  h2::before {
    background: linear-gradient(180deg, #c4a8ff 0%, #ff9ec4 100%);
  }

  .bar i {
    background: linear-gradient(90deg, #c4a8ff 0%, #ff9ec4 100%);
  }

  .btn {
    background: linear-gradient(100deg, #c4a8ff 0%, #e6a6ff 100%);
    box-shadow: none;
  }

  .btn.sub {
    background: rgba(255, 255, 255, 0.06);
  }

  /* ライト用に白で書いたガラスの塗りを、暗い地の値に置き換えます。
     ここを忘れるとカードが白いままになり、明るい文字が読めなくなります。 */
  .route,
  .stepgroup,
  .callout {
    border-color: rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.06);
  }

  .way,
  .notebox {
    border-color: rgba(255, 255, 255, 0.1);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgb(var(--tint, var(--lavender-rgb)) / 0.9) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 8px 20px rgba(0, 0, 0, 0.25);
  }

  .notebox {
    --tint: var(--rose-rgb);
  }

  .hero .label,
  .route .tag,
  .stepgroup li::before,
  .checklist.note li::before {
    border-color: rgba(255, 255, 255, 0.12);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.1) 0%, rgb(var(--lavender-rgb) / 0.95) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    color: var(--accent);
  }

  table.eff tr.hit td {
    border-color: rgba(196, 168, 255, 0.4);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.06) 0%, rgb(var(--lavender-rgb) / 0.95) 100%);
  }

  .langbar,
  .exitbar {
    background: rgba(20, 17, 25, 0.72);
    border-color: rgba(255, 255, 255, 0.09);
  }

  .langbar button[aria-current="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: #241a3a;
  }


  table.eff tr.hit td {
    border-color: #7a4a2c;
    background: var(--lavender);
  }

  .label,
  .route .tag,
  .stepgroup li::before {
    background: var(--lavender);
    color: var(--accent);
  }

  .callout.alert {
    border-color: var(--accent);
    background: var(--lavender);
  }

  .checklist.no li::before {
    color: var(--accent);
  }

  .faq summary::after {
    color: var(--accent);
  }

  /* ここで table.eff tr.hit td の color を指定すると、詳細度 (0,2,3) が同じで
     記述順が後になるため、95%/85%/58% の色分け (.v1/.v2/.v3) を打ち消してしまう。
     背景は変数で切り替わるので、色の指定は置かない。 */
  table.eff tr.hit td {
    border-color: #6f95a3;
  }

  .route .tag {
    border-color: var(--line-soft);
    background: var(--surface);
    color: var(--accent);
  }

  .btn {
    border-color: var(--accent);
    background: var(--accent);
    color: #241a3a;
  }

  .btn:hover,
  .btn:focus {
    border-color: var(--accent-hover);
    background: var(--accent-hover);
    color: #241a3a;
  }

  .btn.sub {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn.sub:hover,
  .btn.sub:focus {
    background: var(--accent);
    color: #241a3a;
  }

  .callout p {
    color: var(--ink-2);
  }

  .callout .btn.sub {
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.12);
    color: var(--accent);
  }

  .callout .btn.sub:hover,
  .callout .btn.sub:focus {
    background: var(--accent);
    color: #1a0f08;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

</head>
<body>

<nav class="langbar" aria-label="Language / 言語">
  <ul id="langs"></ul>
</nav>

<p class="tophint" id="tophint"></p>

<!-- ページは「帯（band）」を縦に積んで構成します。
     .band が画面いっぱいの背景色を持ち、中身は .inner で読みやすい幅に絞ります。
     .band.tint が淡い青の帯です。白と交互に並べてリズムを作っています。 -->

<header class="band hero">
  <div class="inner">
    <p class="label" id="t-eyebrow"></p>
    <h1 id="t-title"></h1>
    <p class="lead" id="t-subtitle"></p>
  </div>
</header>

<!-- ===== カウントダウン ===== -->
<section class="band tint" aria-labelledby="t-cdlabel">
  <div class="inner focal">
    <label for="when" id="t-cdlabel"></label>
    <input type="datetime-local" id="when">
    <p class="cdnum" id="cdnum"></p>
    <div class="bar" aria-hidden="true"><i id="cdbar"></i></div>
    <p class="cdnote" id="cdnote"></p>
  </div>
</section>

<!-- 72時間を過ぎたときだけ JavaScript が表示します（hidden を外します）。
     id は帯そのものに付けます。中の箱に付けると、非表示時に空の帯が残ります。 -->
<section class="band" id="overbox" hidden>
  <div class="inner">
    <div class="callout alert">
      <h3 id="t-overtitle"></h3>
      <p id="t-overtext" style="margin-top:8px"></p>
      <a class="btn" id="t-overbtn" rel="noopener noreferrer" target="_blank"
         href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000186912_00002.html"></a>
    </div>
  </div>
</section>

<!-- ===== 効果 ===== -->
<section class="band">
  <div class="inner">
    <h2 id="t-efftitle"></h2>
    <table class="eff">
      <thead><tr><th id="t-effh1"></th><th id="t-effh2"></th></tr></thead>
      <tbody>
        <!-- この3つの <tr> にクラスを足さないでください。
             JavaScript が className を丸ごと書き換えて該当行を示すため、消えます。 -->
        <tr id="row1"><td id="t-eff1"></td><td class="v1">95%</td></tr>
        <tr id="row2"><td id="t-eff2"></td><td class="v2">85%</td></tr>
        <tr id="row3"><td id="t-eff3"></td><td class="v3">58%</td></tr>
      </tbody>
    </table>
    <small id="t-effsrc"></small>
  </div>
</section>

<!-- ===== 3つの経路 =====
     表示順: 1 産婦人科 → 2 薬局 → 3 オンライン診療
     翻訳キーは r1=薬局 / r2=オンライン診療 / r3=産婦人科 のままです。
     順番を変えたいときは、下の3つの <div class="route"> ブロックごと入れ替えてください。 -->
<section class="band tint">
  <div class="inner">
    <h2 id="t-routestitle"></h2>
    <p class="lead" id="t-routeshint"></p>

    <div class="routes">
      <!-- 3つとも同じ見た目にしています。01を目立たせると、産婦人科が
           「特別な事情がある人だけが行くところ」に見えてしまうためです。 -->
      <div class="route">
        <span class="no">01</span>
        <div class="hd"><h3 id="t-r3n"></h3><span class="price" id="t-r3p"></span></div>
        <p id="t-r3d"></p>
        <p id="t-r3d2"></p>
        <div class="way">
          <p class="waytitle" id="t-r3meritt"></p>
          <p id="t-r3meritd1"></p>
          <p id="t-r3meritd2"></p>
          <p id="t-r3meritd3"></p>
        </div>
        <p class="blocktitle" id="t-r3recot"></p>
        <p id="t-r3recod"></p>
        <!-- 中身は JavaScript が [見出し, 本文] の配列から作ります -->
        <div class="ways" id="r3reco"></div>
        <a class="btn" id="t-r3b" rel="noopener noreferrer" target="_blank"
           href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000186912_00002.html"></a>
      </div>

      <div class="route">
        <span class="no">02</span>
        <div class="hd"><h3 id="t-r1n"></h3><span class="price" id="t-r1p"></span></div>
        <p id="t-r1d"></p>
        <p class="blocktitle" id="t-r1pointst"></p>
        <div class="ways" id="r1points"></div>
        <div class="notebox">
          <p class="noteboxtitle" id="t-r1prept"></p>
          <p id="t-r1prepd1"></p>
          <p id="t-r1prepd2"></p>
        </div>
        <a class="btn sub" id="t-r1b" rel="noopener noreferrer" target="_blank"
           href="https://www.mhlw.go.jp/stf/kinnkyuuhininnyaku_00005.html"></a>
      </div>

      <div class="route">
        <span class="no">03</span>
        <div class="hd"><h3 id="t-r2n"></h3><span class="price" id="t-r2p"></span></div>
        <p id="t-r2d"></p>
        <p id="t-r2ways"></p>
        <div class="ways">
          <div class="way">
            <p class="waytitle" id="t-r2w1t"></p>
            <p id="t-r2w1d"></p>
          </div>
          <div class="way">
            <p class="waytitle" id="t-r2w2t"></p>
            <p id="t-r2w2d"></p>
          </div>
        </div>
        <div class="notebox">
          <p class="noteboxtitle" id="t-r2cautiont"></p>
          <p id="t-r2cautiond"></p>
        </div>
        <a class="btn sub" id="t-r2b" rel="noopener noreferrer" target="_blank"
           href="https://www.mhlw.go.jp/stf/kinnkyuuhininnyaku_00004.html"></a>
      </div>
    </div>
  </div>
</section>

<!-- ===== 購入の流れ =====
     3経路それぞれの手順。中身は JavaScript が生成します（翻訳キー steps）。 -->
<section class="band">
  <div class="inner">
    <h2 id="t-stepstitle"></h2>
    <p class="lead" id="t-stepshint"></p>
    <div class="steps" id="stepslist"></div>
  </div>
</section>

<!-- ===== 服用前チェック =====
     出典: ノルレボ 添付文書／第一三共ヘルスケア 製品情報の「してはいけないこと」
     「相談すること」。文面は流用せず、事実にもとづいて書き直しています。 -->
<section class="band tint">
  <div class="inner">
    <h2 id="t-checktitle"></h2>
    <p class="lead" id="t-checkhint"></p>

    <div class="checkgroup">
      <h3 id="t-checknotitle"></h3>
      <p id="t-checknonote"></p>
      <ul class="checklist no" id="checkno"></ul>
      <ul class="checklist note" id="checknote"></ul>
    </div>

    <div class="checkgroup">
      <h3 id="t-checkasktitle"></h3>
      <p id="t-checkasknote"></p>
      <ul class="checklist ask" id="checkask"></ul>
    </div>
  </div>
</section>

<!-- ===== 飲んだあとのこと ===== -->
<section class="band">
  <div class="inner">
    <h2 id="t-aftertitle"></h2>
    <p id="t-afterbody1"></p>
    <p id="t-afterbody2"></p>
    <div class="way">
      <p class="waytitle" id="t-secrett"></p>
      <p id="t-secretd"></p>
    </div>

var cur = "ja";

function buildLangBar(){
  var ul=document.getElementById("langs");
  ul.innerHTML="";
  LANGS.forEach(function(L){
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.type="button";
    b.textContent=L.name;
    b.setAttribute("lang", L.htmlLang);
    b.setAttribute("aria-current", L.code===cur ? "true" : "false");
    b.addEventListener("click", function(){ setLang(L.code, true); });
    li.appendChild(b); ul.appendChild(li);
  });
}

  if(save){
    try{ localStorage.setItem("lang", cur); }catch(e){}
    if(history.replaceState) history.replaceState(null,"","#"+cur);
    else location.hash = cur;
  }
  buildLangBar();
  render();
}

/* 言語の決め方: URLの #xx → 保存された選択 → ブラウザの言語 → 日本語 */
function pickLang(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(T[h]) return h;
  try{ var s=localStorage.getItem("lang"); if(s && T[s]) return s; }catch(e){}
  var navs=(navigator.languages||[navigator.language||""]);
  for(var i=0;i<navs.length;i++){
    var t=(navs[i]||"").toLowerCase();
    if(t.indexOf("ja")===0) return "ja";
    if(t.indexOf("ko")===0) return "ko";
    if(t.indexOf("zh")===0) return "zh";
    if(t.indexOf("vi")===0) return "vi";
    if(t.indexOf("ne")===0) return "ne";
    if(t.indexOf("ms")===0||t.indexOf("id")===0) return "ms";
    if(t.indexOf("en")===0) return "en";
  }
  return "ja";
}

/* ===== カウントダウン ===== */
var LIMIT_H = 72;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tick(){
  var d = T[cur] || T.ja;
  function g(k){ return (d[k]!==undefined) ? d[k] : T.ja[k]; }
  var v = document.getElementById("when").value;
  var num = document.getElementById("cdnum");
  var note = document.getElementById("cdnote");
  var bar = document.getElementById("cdbar");
  var over = document.getElementById("overbox");
  ["row1","row2","row3"].forEach(function(id){ document.getElementById(id).className=""; });

  if(!v){
    num.innerHTML = "—";
    num.style.fontSize = "38px";
    note.textContent = g("cdempty");
    bar.style.width = "0";
    over.hidden = true;
    return;
  }
  var start = new Date(v).getTime();
  if(isNaN(start)){ num.innerHTML="—"; note.textContent=g("cdempty"); return; }

  var elapsedH = (Date.now()-start)/3600000;
  var leftMs = start + LIMIT_H*3600000 - Date.now();

  var pct = "";
  if(elapsedH < 24){ document.getElementById("row1").className="hit"; pct="95%"; }
  else if(elapsedH < 48){ document.getElementById("row2").className="hit"; pct="85%"; }
  else if(elapsedH <= 72){ document.getElementById("row3").className="hit"; pct="58%"; }

  if(leftMs <= 0){
    num.textContent = g("cdover");
    num.style.fontSize = "30px";
    note.textContent = "";
    bar.style.width = "0";
    over.hidden = false;
    return;
  }
  over.hidden = true;
  var h = Math.floor(leftMs/3600000);
  var m = Math.floor((leftMs%3600000)/60000);
  var pre = g("cdprefix");
  num.style.fontSize = "52px";
  num.innerHTML = (pre ? esc(pre)+" " : "")
    + h + '<span class="u">' + esc(g("cdh")) + '</span>'
    + m + '<span class="u">' + esc(g("cdm")) + '</span>';
  bar.style.width = Math.max(0, Math.min(100, leftMs/(LIMIT_H*3600000)*100)) + "%";
  note.textContent = pct ? g("cdnow").replace("{p}", pct) : g("cdnote");
}

/* ===== 退避ボタン：履歴を残さず別サイトへ移動 ===== */
document.getElementById("exitbtn").addEventListener("click", function(){
  try{ localStorage.removeItem("lang"); }catch(e){}
  location.replace("https://weather.yahoo.co.jp/weather/");
});

document.getElementById("when").addEventListener("input", tick);
document.getElementById("when").addEventListener("change", tick);
window.addEventListener("hashchange", function(){ setLang(pickLang(), false); });
setInterval(tick, 30000);

setLang(pickLang(), false);
</script>
