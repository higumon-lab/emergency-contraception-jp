<style>
/* ── 配色 ──────────────────────────────────────────────
   マカロンのような淡い色を「面」に使い、文字は濃いすみれ墨で置きます。
   淡い色は文字色には使いません（コントラストが取れないため）。

   透明感は、色のついた背景の上に、半透明の白＋ぼかし（backdrop-filter）
   を重ねて出しています。
   ────────────────────────────────────────────────── */
:root {
  color-scheme: light;
  --wrap-pad: 22px;

  /* マカロンの6色。透明度を調整できるよう rgb 成分でも持たせています。
     rgb(var(--mint-rgb) / 0.8) のように書くと、下の色が透けます。 */
  --mint-rgb: 200 247 227;
  --lavender-rgb: 227 218 255;
  --peach-rgb: 255 220 202;
  --rose-rgb: 255 217 232;
  --butter-rgb: 255 242 196;
  --sky-rgb: 210 232 255;

  --mint: rgb(var(--mint-rgb));
  --lavender: rgb(var(--lavender-rgb));
  --peach: rgb(var(--peach-rgb));
  --rose: rgb(var(--rose-rgb));
  --butter: rgb(var(--butter-rgb));
  --sky: rgb(var(--sky-rgb));

  --paper: #fdfcff;
  --surface: rgba(255, 255, 255, 0.74);
  --surface-solid: #ffffff;
  --surface-soft: rgba(255, 255, 255, 0.5);
  --card: rgba(255, 255, 255, 0.74);

  --ink: #2f2b3a;
  --ink-2: #494357;
  --ink-3: #5d5770;

  --line: rgba(255, 255, 255, 0.9);
  --line-soft: rgba(101, 52, 201, 0.14);
  --line-strong: rgba(101, 52, 201, 0.24);

  --accent: #6534c9;
  --accent-hover: #5228a8;
  --focus: #5228a8;

  --ok: #14663f;
  --mid: #8a3f31;
  --low: #8a4a1c;

  --radius: 20px;
  --radius-small: 14px;
  --shadow: 0 12px 34px rgba(101, 52, 201, 0.1);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  /* 淡い色のにじみを画面に固定して敷き、その上に半透明の白を重ねます。
     これが「透明感」の土台です。 */
  background:
    radial-gradient(60rem 40rem at 12% -8%, var(--mint) 0, transparent 60%),
    radial-gradient(52rem 38rem at 92% 4%, var(--lavender) 0, transparent 62%),
    radial-gradient(48rem 36rem at 78% 42%, var(--peach) 0, transparent 58%),
    radial-gradient(44rem 34rem at 6% 68%, var(--sky) 0, transparent 60%),
    radial-gradient(46rem 34rem at 88% 92%, var(--rose) 0, transparent 60%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink);
  /* 本文は Zen Kaku Gothic New（読みやすい現代的なゴシック）。
     欧文と数字は Outfit で、都会的な印象にしています。
     韓国語・中国語・ネパール語はそれぞれ Noto Sans を当てています。 */
  font-family:
    "Outfit", "Zen Kaku Gothic New", "Noto Sans KR", "Noto Sans SC",
    "Noto Sans Devanagari", system-ui, -apple-system, "Hiragino Sans",
    "Yu Gothic", sans-serif;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.85;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

button,
input {
  font: inherit;
}

button,
a {
  touch-action: manipulation;
}

a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

a:not(.btn) {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
}

/* 帯（全幅）。背景のにじみを透かしつつ、白いすりガラスを重ねます。 */
.band {
  padding-block: clamp(48px, 10vw, 80px);
  background: transparent;
}

.band.tint {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-block: 1px solid rgba(255, 255, 255, 0.75);
}

.band > .inner {
  width: min(100%, 680px);
  margin-inline: auto;
  padding-inline: var(--wrap-pad);
}

/* 冒頭は背景のにじみをそのまま見せます（塗りつぶさない）。 */
.hero h1 {
  color: var(--ink);
}

.hero .lead {
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 400;
  line-height: 2;
}

.hero .label {
  border: 1px solid rgba(255, 255, 255, 0.9);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.75) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 6px 16px rgba(101, 52, 201, 0.1);
  color: var(--accent);
  backdrop-filter: blur(10px) saturate(1.4);
  -webkit-backdrop-filter: blur(10px) saturate(1.4);
}

/* 見出しの左に太いオレンジの縦棒（前身サイトと同じ形） */
h2 {
  position: relative;
  padding-left: 18px;
}

h2::before {
  content: "";
  position: absolute;
  top: 0.18em;
  bottom: 0.18em;
  left: 0;
  display: block;
  width: 5px;
  margin: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, #6534c9 0%, #c02a6a 100%);
}

/* 見出しの上に置く小さなラベル。ピル形のバッジで見せます */
.label {
  display: inline-flex;
  align-items: center;
  margin: 0 0 18px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--lavender);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

/* 見出しは Zen Maru Gothic（丸みのある書体）。
   h1 には紫→マゼンタのグラデーションをかけています。
   両端とも白地で 5.5:1 以上あるので、グラデーションが効かない環境で
   単色になっても読めます。 */
h1,
h2,
h3,
.waytitle,
.blocktitle,
.noteboxtitle,
.faq summary,
.label {
  font-family:
    "Outfit", "Zen Maru Gothic", "Noto Sans KR", "Noto Sans SC",
    "Noto Sans Devanagari", system-ui, sans-serif;
}

h1 {
  max-width: 15em;
  margin: 0 0 22px;
  font-size: clamp(1.7rem, 6.8vw, 2.5rem);
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.01em;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 46%, #c02a6a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 翻訳データの中の改行をそのまま活かします。
   改行を入れていない言語は、これまでどおり自動で折り返します。 */
#t-title,
#t-subtitle {
  white-space: pre-line;
}

/* 見出しの上の余白は帯（.band の padding-block）が持つので、ここでは付けない */
h2 {
  margin: 0 0 22px;
  color: var(--ink);
  font-size: clamp(1.2rem, 4.8vw, 1.4rem);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

h3 {
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
}

p {
  margin: 0 0 14px;
}

small {
  display: block;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.75;
}

.lead {
  max-width: 42em;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.95;
}

.langbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.langbar ul {
  display: flex;
  flex-wrap: wrap;            /* 7言語すべてを画面内に表示する（横スクロールにしない） */
  justify-content: center;
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 0;
  gap: 4px;
  list-style: none;
}

.langbar li {
  flex: 0 0 auto;
}

.langbar button {
  min-width: 48px;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.langbar button:hover {
  background: var(--lavender);
  color: var(--accent);
}

.langbar button[aria-current="true"] {
  border-color: transparent;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(101, 52, 201, 0.26);
}

.tophint {
  margin: 0;
  padding: 11px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.7);
  background: rgba(255, 255, 255, 0.5);
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.6;
  text-align: center;
}

/* オレンジの面をしっかり見せたいので、上下の余白を大きくとる */
.hero {
  padding-block: clamp(52px, 12vw, 96px) clamp(52px, 12vw, 88px);
}

/* カウントダウンは帯そのものが青の面になるため、ここでは箱を持たない */
.focal {
  margin: 0;
}

.focal label {
  display: block;
  margin-bottom: 12px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
}

.focal input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}

.focal input:focus {
  border-color: var(--accent);
  outline: 3px solid rgba(36, 79, 94, 0.22);
  outline-offset: 2px;
}

/* どんなお薬か ─ しくみの3枚 */
.howcards {
  display: grid;
  margin-top: 18px;
  gap: 14px;
}

.howcard {
  --tint: var(--mint-rgb);
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--tint) / 0.88) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.howcards .howcard:nth-child(2) {
  --tint: var(--sky-rgb);
}

.howcards .howcard:nth-child(3) {
  --tint: var(--butter-rgb);
}

.howicon {
  display: block;
  width: 56px;
  height: 56px;
  margin-bottom: 10px;
  color: var(--accent);
}

.hcard-t {
  margin: 0 0 6px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

.hcard-d {
  margin: 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
}

/* 時間の目安の棒 */
.tl {
  margin-top: 18px;
}

.tl-bar {
  position: relative;
  height: 14px;
  overflow: hidden;
  border-radius: 999px;
  background: rgb(var(--lavender-rgb) / 0.85);
}

.tl-fill {
  position: absolute;
  inset: 0 40% 0 0;
  display: block;
  border-radius: inherit;
  background: linear-gradient(90deg, #6534c9 0%, #b02a86 100%);
}

.tl-ticks {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}

.tl-ticks span {
  width: 2px;
  height: 8px;
  border-radius: 2px;
  background: var(--line-strong);
}

.tl-labels {
  display: grid;
  margin-top: 8px;
  gap: 6px;
}

.tl-labels p {
  margin: 0;
  padding-left: 16px;
  position: relative;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.75;
}

.tl-labels p::before {
  content: "";
  position: absolute;
  top: 0.55em;
  left: 0;
  width: 9px;
  height: 9px;
  border-radius: 999px;
}

.tl-labels .tl-a::before {
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
}

.tl-labels .tl-b::before {
  background: rgb(var(--lavender-rgb));
  border: 1px solid var(--line-strong);
}

/* こんなときに検討します */
.cases {
  margin: 14px 0 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
}

.cases li {
  position: relative;
  padding: 14px 0 14px 26px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
}

.cases li::before {
  content: "";
  position: absolute;
  top: 1.05em;
  left: 2px;
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
}

/* カウントダウンの上に置く小さなラベル。
   残り時間が出ているときだけ表示します（未入力・72時間超のときは隠す）。 */
.cdcap {
  margin: 24px 0 0;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
  letter-spacing: 0.04em;
}

.cdcap + .cdnum {
  margin-top: 2px;
}

.cdnum {
  margin: 24px 0 0;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: "Outfit", system-ui, sans-serif;
  font-size: clamp(2.6rem, 13vw, 4.2rem);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.03em;
  word-break: normal;
}

.cdnum .u {
  display: inline-block;
  margin: 4px 6px 0;
  color: var(--ink-2);
  -webkit-text-fill-color: var(--ink-2);
  font-family: "Zen Maru Gothic", "Outfit", system-ui, sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
}

.bar {
  position: relative;
  height: 6px;
  margin: 22px 0 14px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.7);
}

.bar i {
  position: absolute;
  inset: 0 auto 0 0;
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6534c9 0%, #c02a6a 100%);
  transition: width 0.4s ease;
}

.cdnote {
  margin: 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.75;
}

table.eff {
  width: 100%;
  margin: 0 0 12px;
  border-spacing: 0 7px;
  border-collapse: separate;
  table-layout: fixed;
  font-size: 15px;
}

table.eff th {
  padding: 0 10px 7px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-align: left;
  text-transform: uppercase;
}

table.eff th:last-child {
  text-align: right;
}

table.eff td {
  padding: 15px 12px;
  border-block: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

table.eff td:first-child {
  border-left: 1px solid var(--line);
  border-radius: var(--radius-small) 0 0 var(--radius-small);
}

table.eff td:last-child {
  border-right: 1px solid var(--line);
  border-radius: 0 var(--radius-small) var(--radius-small) 0;
  color: var(--ink);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  text-align: right;
}

table.eff tr.hit td {
  border-color: rgba(101, 52, 201, 0.3);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.7) 0%, rgb(var(--lavender-rgb) / 0.92) 100%);
  color: var(--ink);
}

/* 詳細度を table.eff tr.hit td と同じ (0,2,3) に上げ、記述順で勝たせる。
   これがないと 95%/85%/58% の色分けが打ち消されます。 */
table.eff tr td.v1 {
  color: var(--ok);
}

table.eff tr td.v2 {
  color: var(--mid);
}

table.eff tr td.v3 {
  color: var(--low);
}

/* 経路は前身サイトと同じくカードで見せる（白・角丸8px・細い枠・浅い影） */
.routes {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.route {
  position: relative;
  overflow: hidden;
  min-width: 0;
  padding: clamp(22px, 6vw, 30px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

/* 01 / 02 / 03 は経路の目印なので、はっきり見えるようにしています */
.route .no {
  display: block;
  margin-bottom: 10px;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: "Outfit", system-ui, sans-serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.route .hd {
  display: flex;
  min-width: 0;
  margin-bottom: 11px;
  gap: 8px 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.route .hd > * {
  min-width: 0;
}

.route .price {
  margin-left: auto;
  color: var(--ink-2);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.route p {
  margin: 0 0 19px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
}

.route .tag {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  margin: 0 0 14px;
  padding: 7px 14px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.85) 0%, rgb(var(--lavender-rgb) / 0.85) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

.btn {
  display: flex;
  width: 100%;
  min-height: 54px;
  padding: 14px 20px;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  border: 1px solid transparent;
  border-radius: 999px;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(101, 52, 201, 0.28);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  text-decoration: none;
  overflow-wrap: anywhere;
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.btn:hover {
  box-shadow: 0 12px 28px rgba(101, 52, 201, 0.36);
  transform: translateY(-1px);
}

.btn:hover,
.btn:focus {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.btn::after {
  content: "→";
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1;
}

.btn.sub {
  border-color: rgba(101, 52, 201, 0.4);
  background: rgba(255, 255, 255, 0.7);
  color: var(--accent);
  box-shadow: none;
}

.btn.sub:hover,
.btn.sub:focus {
  border-color: transparent;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(101, 52, 201, 0.28);
}

.btn + .btn {
  margin-top: 10px;
}

.know {
  border-top: 1px solid var(--line);
}

.know .item {
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}

.know .item p {
  margin: 8px 0 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 帯の中の囲み。相談窓口は白地の箱、72時間超のお知らせは線で強調する。 */
.callout {
  padding: clamp(24px, 6vw, 32px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

.callout.alert {
  border-color: var(--accent);
  border-left-width: 4px;
  background: var(--lavender);
}

.callout p {
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

.callout .btn.sub {
  border-color: var(--accent);
  background: var(--surface);
  color: var(--accent);
}

.callout .btn.sub:hover,
.callout .btn.sub:focus {
  background: var(--accent);
  color: #ffffff;
}

/* オンライン診療カードの中の「受け取り方2つ」と注意書き */
.ways {
  display: grid;
  margin: 0 0 18px;
  gap: 12px;
}

/* 淡い色の面は、べた塗りではなく「色つきのガラス」にしています。
   上から白い光が当たったように見せるため、
   斜めのグラデーション＋内側の白いハイライト＋下に落ちる影を重ねています。 */
.way {
  --tint: var(--mint-rgb);
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--tint) / 0.88) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.ways .way:nth-child(2) {
  --tint: var(--sky-rgb);
}

.ways .way:nth-child(3) {
  --tint: var(--butter-rgb);
}

.waytitle {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

/* カードの中で、囲みを単体で置くときの余白 */
.route > .way {
  margin: 0 0 18px;
}

/* 帯の中に直接置く囲み */
.inner > .way {
  margin-top: 22px;
}

/* 【〜】のような小見出し */
.blocktitle {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

.way p:last-child,
.notebox p:last-child {
  margin: 0;
}

.notebox {
  margin: 0 0 18px;
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--rose-rgb) / 0.9) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.noteboxtitle {
  margin: 0 0 8px;
  color: var(--accent);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

/* ===== ここから、前身サイトにあった4つの内容を作り直したもの ===== */

/* 経路カードの背景写真。
   ぼかしたうえで薄く敷き、その上に必ず「かすみ（--scrim）」を重ねます。
   かすみを外すと文字が写真の濃い部分に乗って読めなくなるので、
   透明度を上げたいときは opacity ではなく、かすみ側をうすくしてください。
   写真が読み込めなくても、ただ背景が出ないだけで文章は崩れません。 */
.route::before,
.route::after {
  content: "";
  position: absolute;
  z-index: 0;
  pointer-events: none;
}

.route::before {
  /* ぼかしの端がにじんで輪になるので、少し外側まで広げています */
  inset: -16px;
  background-image: var(--photo);
  background-position: var(--photo-pos, center 32%);
  background-size: cover;
  opacity: 0.5;
  filter: blur(2px) saturate(0.9);
}

.route::after {
  inset: 0;
  background: var(--scrim);
}

/* 中身を写真より前に出します。これがないと文字が写真の下に隠れます */
.route > * {
  position: relative;
  z-index: 1;
}

/* 並びは 01 産婦人科 → 02 薬局 → 03 オンライン診療 で固定です */
.routes .route:nth-child(1) {
  --photo: url("images/step-clinic.webp");
  --photo-pos: 30% 18%;
}

.routes .route:nth-child(2) {
  --photo: url("images/step-pharmacy.webp");
  --photo-pos: 60% 20%;
}

.routes .route:nth-child(3) {
  --photo: url("images/step-online.webp");
  --photo-pos: 45% 22%;
}

/* かすみは右上を薄く、そこから外へ向かって濃くします。
   写真が右上の角にだけ見え、文章が並ぶ左下は白いままになります。
   右上の 0.62 が一番うすい所です。そこでも本文は 9.4:1、
   紫のリンク色（--accent）は 4.98:1 を保ちます。
   一番きびしいのは本文ではなく紫の方なので、数字を下げるときは
   必ず --accent の色で測り直してください（基準は 4.5:1）。 */
.routes {
  --scrim: radial-gradient(125% 95% at 100% 0%,
      rgba(255, 255, 255, 0.62) 0%,
      rgba(255, 255, 255, 0.82) 42%,
      rgba(255, 255, 255, 0.94) 72%);
}

/* 経路カードの中の「やること」。番号つきで、縦線でつなぎます */
.stepsin {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: step;
}

.stepsin li {
  position: relative;
  padding: 0 0 18px 40px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
  counter-increment: step;
}

.stepsin li::before {
  content: counter(step);
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  width: 26px;
  height: 26px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* 手順どうしを縦線でつなぐ（最後の1つには引かない） */
.stepsin li::after {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 4px;
  left: 13px;
  width: 1px;
  background: var(--line);
}

.stepsin li:last-child {
  padding-bottom: 0;
}

.stepsin li:last-child::after {
  display: none;
}

/* ===== カードの中の見出しを目立たせる =====

   詳細度の落とし穴に注意してください。
   本文には `.route p` (0,1,1) と `.morebody > p` (0,2,0) が効いています。
   `.blocktitle` `.waytitle` `.noteboxtitle` は (0,1,0) しかないため、
   そのままでは色も大きさも本文に負けます。実際、2026年9月7日まで
   これらの見出しは本文とまったく同じ色で表示されていました。
   ここを触るときは、必ず (0,2,0) 以上で書いてください。 */

/* 経路名。上の 01 / 02 / 03 と対になる大きさにします */
.route .hd h3 {
  font-size: 21px;
  letter-spacing: 0.01em;
}

/* 中見出し（やること・こんな方は…・どうやって効くの？ など）。
   h2 の縦棒を小さくしたものを付けて、本文との差をはっきりさせます */
.inner .blocktitle {
  position: relative;
  margin: 28px 0 13px;
  padding-left: 15px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.65;
  letter-spacing: 0.02em;
}

.inner .blocktitle::before {
  content: "";
  position: absolute;
  top: 0.18em;
  bottom: 0.18em;
  left: 0;
  width: 4px;
  border-radius: 999px;
  background: linear-gradient(180deg, #6534c9 0%, #c02a6a 100%);
}

/* 淡い色の箱の中の小見出し。丸い点を付けて、色も紫にします */
.inner .waytitle {
  position: relative;
  margin: 0 0 10px;
  padding-left: 17px;
  color: var(--accent);
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.7;
  letter-spacing: 0.01em;
}

.inner .waytitle::before {
  content: "";
  position: absolute;
  top: 0.6em;
  left: 0;
  width: 9px;
  height: 9px;
  border-radius: 999px;
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
}

/* 注意書きの見出しだけは、丸ではなく「!」にして注意だと分かるようにします */
.inner .noteboxtitle {
  position: relative;
  margin: 0 0 11px;
  padding-left: 26px;
  color: var(--accent);
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.7;
  letter-spacing: 0.01em;
}

.inner .noteboxtitle::before {
  content: "!";
  position: absolute;
  top: 0.16em;
  left: 0;
  display: flex;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: linear-gradient(135deg, #6534c9 0%, #c02a6a 100%);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
}

/* 「もっと詳しく」。長い説明はここに畳んでいます。
   中身は最初から HTML にあるので、閉じていても読み上げや
   ページ内検索から見つけられます。 */
.more {
  margin-top: 24px;
}

/* 押せる場所だと分かるように、丸い枠のボタンの見た目にしています */
.more > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  /* 指で押せる大きさ（48px以上）を確保します */
  min-height: 52px;
  padding: 13px 20px;
  border: 1.5px solid rgba(101, 52, 201, 0.3);
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.92) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 4px 14px rgba(101, 52, 201, 0.12);
  color: var(--accent);
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  list-style: none;
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}

.more > summary::-webkit-details-marker {
  display: none;
}

.more > summary:hover {
  border-color: rgba(101, 52, 201, 0.55);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 6px 18px rgba(101, 52, 201, 0.2);
}

/* 三角は右端に置いて、閉じているときは右向き（▶）、
   開くと下向き（▼）にします。
   transform: rotate() は使いません。擬似要素にかけると
   getComputedStyle で読み戻せず、検証ができないためです。
   辺の指定を入れ替えるやり方なら、数値で確かめられます。 */
.more > summary::before {
  content: "";
  order: 2;
  margin-left: auto;
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-right: 0 solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 7px solid currentColor;
}

.more[open] > summary::before {
  border-top: 7px solid currentColor;
  border-right: 5px solid transparent;
  border-bottom: 0 solid transparent;
  border-left: 5px solid transparent;
}

/* 開いた中身が、上のボタンの続きだと分かるように縦線でつなぎます */
.morebody {
  margin-top: 14px;
  padding: 2px 2px 2px 16px;
  border-left: 2px solid rgba(101, 52, 201, 0.25);
}

.morebody > p {
  margin: 0 0 10px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

.morebody > p:last-child {
  margin-bottom: 0;
}

/* 服用前チェック: 「してはいけない」と「相談して」の2群 */
.checkgroup + .checkgroup {
  margin-top: 26px;
}

.checkgroup h3 {
  margin-bottom: 6px;
}

.checkgroup > p {
  margin: 0 0 14px;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1.75;
}

.checklist {
  margin: 0;
  padding: 0;
  list-style: none;
}

.checklist li {
  position: relative;
  padding: 13px 0 13px 32px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.75;
}

.checklist li::before {
  position: absolute;
  top: 13px;
  left: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.75;
}

.checklist.no li::before {
  content: "\00d7";
  color: var(--accent);
}

.checklist.ask li::before {
  content: "!";
  color: var(--ink-3);
}

/* 授乳中は「飲めない」ではなく「気をつけてほしい」ことなので、
   × ではなく落ち着いた印にしています。 */
.checklist.note li::before {
  content: "!";
  top: 15px;
  display: flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color: var(--accent);
  font-size: 12px;
  line-height: 1;
}

/* よくある質問 */
.faq {
  margin-top: 26px;
  border-top: 1px solid var(--line);
}

.faq details {
  border-bottom: 1px solid var(--line);
}

.faq summary {
  display: flex;
  min-height: 56px;
  padding: 16px 32px 16px 0;
  gap: 12px;
  align-items: center;
  color: var(--ink);
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: "+";
  position: absolute;
  right: 0;
  color: var(--accent);
  font-size: 20px;
  font-weight: 700;
}

.faq details[open] summary::after {
  content: "\2212";
}

.faq details {
  position: relative;
}

.faq .answer {
  margin: 0;
  padding: 0 0 20px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 製品情報の表 */
table.spec {
  width: 100%;
  margin-top: 26px;
  border-collapse: collapse;
  font-size: 15px;
}

table.spec th,
table.spec td {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  line-height: 1.7;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

table.spec th {
  width: 38%;
  padding-right: 14px;
  color: var(--ink-3);
  font-size: 14px;
  font-weight: 700;
}

table.spec td {
  color: var(--ink-2);
}

footer {
  padding-top: 4px;
}

footer h3 {
  margin-bottom: 14px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

footer p {
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.85;
}

.exitbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 9px 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.75);
  background: rgba(255, 255, 255, 0.72);
  text-align: right;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.exitbtn {
  min-height: 48px;
  padding: 10px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
}

.exitbtn:hover {
  border-color: var(--accent);
  background: var(--lavender);
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 420px) {
  :root {
    --wrap-pad: 16px;
  }

  .langbar {
    padding-inline: 8px;
  }

  .route .price {
    width: 100%;
    margin-left: 0;
  }

  table.eff {
    font-size: 14px;
  }

  table.eff th,
  table.eff td {
    padding-inline: 8px;
  }
}

@media (prefers-color-scheme: dark) {
  /* ダークでも、淡い色のにじみは残します。面を暗くして文字を明るくします。 */
  :root {
    color-scheme: dark;
    --mint-rgb: 29 59 49;
    --lavender-rgb: 47 39 70;
    --peach-rgb: 61 43 38;
    --rose-rgb: 58 36 48;
    --butter-rgb: 58 51 32;
    --sky-rgb: 31 50 66;

    --paper: #141119;
    --surface: rgba(40, 35, 50, 0.66);
    --surface-solid: #241f2e;
    --surface-soft: rgba(40, 35, 50, 0.45);
    --card: rgba(42, 37, 53, 0.7);

    --ink: #f2eff7;
    --ink-2: #cec8da;
    --ink-3: #ada6bc;

    --line: rgba(255, 255, 255, 0.12);
    --line-soft: rgba(255, 255, 255, 0.14);
    --line-strong: rgba(255, 255, 255, 0.24);

    --accent: #c4b1ee;
    --accent-hover: #d8cbf5;
    --focus: #c4b1ee;

    --ok: #7fd0a6;
    --mid: #f0a396;
    --low: #eeae79;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  .band.tint {
    background: rgba(255, 255, 255, 0.05);
    border-block-color: rgba(255, 255, 255, 0.09);
  }

  .tophint {
    background: rgba(255, 255, 255, 0.05);

     そのままだと濃い紫が背景に沈んで読めなくなるためです。 */
  h1 {
    background: linear-gradient(100deg, #c4a8ff 0%, #e6a6ff 46%, #ff9ec4 100%);
    -webkit-background-clip: text;
    background-clip: text;

  }

  .bar i {
    background: linear-gradient(90deg, #c4a8ff 0%, #ff9ec4 100%);
  }

  .btn {

  .btn.sub {

  }

  /* ライト用に白で書いたガラスの塗りを、暗い地の値に置き換えます。
     ここを忘れるとカードが白いままになり、明るい文字が読めなくなります。 */
  .route,
  .callout {
    border-color: rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.06);
  }

  .more > summary:hover {
    border-color: rgba(255, 255, 255, 0.3);
  }

  .morebody {
    border-left-color: rgba(196, 168, 255, 0.3);
  }

  /* カードの中の見出しの飾り。暗い地では濃い紫が沈みます */
  .inner .blocktitle::before,
  .inner .waytitle::before,
  .inner .noteboxtitle::before {
    background: linear-gradient(135deg, #c4a8ff 0%, #ff9ec4 100%);

  .inner .noteboxtitle::before {
    color: #1b1622;
  }

  /* 経路カードの写真。暗い地では、かすみも暗い色にしないと
     写真の明るい部分に明るい文字が乗ってしまいます */
  .routes {
    --scrim: radial-gradient(125% 95% at 100% 0%,

  .way,

      linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgb(var(--tint, var(--lavender-rgb)) / 0.9) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 8px 20px rgba(0, 0, 0, 0.25);
  }

  .notebox {
    --tint: var(--rose-rgb);
  }

  .hero .label,
  .route .tag,
  .more > summary,
  .stepsin li::before,
  .checklist.note li::before {

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);

  table.eff tr.hit td {

  }

  /* 「どんなお薬か」で足した飾り。暗い地では明るい紫〜桃に置き換えます */
  .tl-fill,
  .tl-labels .tl-a::before,
  .cases li::before {
    background: linear-gradient(100deg, #c4a8ff 0%, #ff9ec4 100%);
  }

  .tl-labels .tl-b::before {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.3);

  .langbar,

  table.eff tr.hit td {

  /* ここで table.eff tr.hit td の color を指定すると、詳細度 (0,2,3) が同じで

  table.eff tr.hit td {

     長い補足は <details class="more"> に畳んでいます。

<script>

];

var T = {

ja:{
 todo:"やること",

 acheck3:"妊娠検査薬で陰性だったとしてもその後も生理がこないようであれば、必ず産婦人科を受診してください。",

 faq:[
  ["身分証は必要ですか","どの方法でも、必ず必要と決められているわけではありません。ただ、産婦人科では初診のときに、オンライン診療では画面越しに、本人確認のため提示を求められることがあります。薬局でも年齢などの確認で聞かれることがあります。あれば手元に用意しておくと安心です。手元になくても、それだけを理由にあきらめず、まずは相談してみてください。"],
  ["親に知られますか","どの方法でも、年齢に関係なく親の同意はいりませんし、薬局や病院から家に連絡がいくこともありません。緊急避妊薬は健康保険を使わない自費なので、保険の医療費のお知らせに残ることもありません。気をつけたいのは2つです。支払いにクレジットカードを使うと明細に医療機関の名前が残ること、オンライン診療で自宅に配送してもらうと荷物が届くことです。中身が分からない包装で送るところが多いですが、心配なときは事前に確かめてください。"],
  ["16歳未満でも買えますか","年齢による制限はありません。ただ、方法によって対応が違います。薬局では産婦人科をすすめられることがあります。オンライン診療では年齢を理由に断られることがあります。産婦人科は年齢に関係なく受診できますが、施設によっては保護者の同意書や同伴をお願いされることがあるので、行く前に電話で確かめてください。すすめられたり断られたりしても、お薬がもらえないということではありません。産婦人科なら同じお薬をもらえますし、そのほうが早いこともあります。"],
  ["かわりに買ってきてもらえますか","どの方法でも、本人が受けることが必要です。薬局では本人が行って薬剤師の前で飲みます。産婦人科もオンライン診療も、診察を受けるのは本人です。ほかの人が代わりに受け取ることはできません。ただ、一緒に行ってもらう、電話をかけるのを手伝ってもらうことはできます。一人では不安なときは、頼れる人に付き添いをお願いしてみてください。"],
  ["薬局に行かずに、自宅に届けてもらえますか","オンライン診療をしている自費のクリニックのなかには、お薬を自宅へ配送するところがあります。外に出るのがむずかしいときの助けになります。使う前に3つだけ確かめてください。ひとつめは、いつ届くか。72時間の期限に間に合うかどうかが大切です。ふたつめは、日本で承認されたお薬かどうか。120時間用として案内されるウリプリスタル酢酸エステルは、日本では承認されていません。みっつめは、承認されていないお薬は、万一からだに不調が出ても国の救済制度の対象にならないことです。なお国の指針では、薬局で受け取って薬剤師の前で飲む方法が示されています。"],
  ["ドラッグストアの通販で買えますか","買えません。薬局・ドラッグストアで買う場合は、お店に行って薬剤師と対面でのやりとりが必要です。海外から個人輸入したお薬は、偽物のおそれがあり、健康被害が出ても日本の救済制度の対象になりません。"],

 whatbody2:"The shorter the time between sex and taking it, the higher the chance it works. Taking it within 72 hours (3 days) is generally recommended, but even if that has passed, there are medicines that can still work within 120 hours (5 days). Please do not give up.",
 tlseg1:"Within 72 hours (3 days) — available at a pharmacy, a clinic, or through an online consultation",
 tlseg2:"72 to 120 hours (5 days) — there are medicines you can ask a clinic about",
 whatnote:"That said, it does not prevent pregnancy 100%. Checking afterwards matters too.",

 cdcap:"Left of the 72 hours",
 acheckt:"Checking afterwards",
 acheck1:"When the medicine has worked, withdrawal bleeding almost always occurs within three weeks of taking it. Withdrawal bleeding is when the female hormones raised by the emergency contraceptive fall again, the lining of the womb comes away, and you bleed just as you would in a period.",
 acheck2:"However, unexpected bleeding can also occur as a side effect after taking it. To be sure that pregnancy has been prevented, take a pregnancy test three weeks after taking the medicine, or see a clinic.",
 acheck3:"Even if the pregnancy test is negative, if your period still does not come after that, please be sure to see a clinic.",

   "Look for a clinic close to your home, school or workplace that can see you as soon as possible.",
   "Call and say you would like to be seen about emergency contraception, and ask whether they can see you.",
   "Go in. You will be asked in detail about the date of your last period and the date and time of the sex you are worried about, so check these beforehand so you can answer straight away.",

   "Use the health ministry list to find a pharmacy that stocks emergency contraception. Not every pharmacy has it.",

 spectitle:"About the medicine",
 spechint:"Two emergency contraceptives are sold at pharmacies in Japan. The ingredient and the dose are the same.",
 spec:[
  ["Product names","NorLevo / Resoel 72"],
  ["Ingredient (per tablet)","Levonorgestrel 1.5mg (the same in both)"],
  ["Category","Designated pharmacist-guidance medicine"],
  ["Price of NorLevo","7,480 yen (incl. tax, suggested)"],
  ["Price of Resoel 72","6,930 yen (incl. tax, suggested)"],
  ["How to take it","One tablet within 72 hours of sex"],
  ["How it works","It delays ovulation and makes pregnancy less likely"],
  ["Health insurance","Not covered (you pay in full)"]
 ],
 specnote:"Prices are suggested retail prices and may differ by pharmacy. Sources: Ministry of Health, Labour and Welfare; Japan Pharmaceutical Association; package inserts.",
 faqtitle:"Common questions",
 faq:[
  ["Do I need ID?","With none of the three routes is it a rule that you must have one. Still, a clinic may ask for it at a first visit, an online consultation may ask you to hold it up to the camera, and a pharmacy may ask to confirm your age. It is reassuring to have one ready if you can. If you do not have one, do not give up for that reason alone — just ask when you are there."],
  ["Will my parents find out?","With any of the three routes, whatever your age, you do not need a parent's consent, and neither the pharmacy nor the clinic will contact your home. Emergency contraception is paid privately, without health insurance, so it does not appear on any insurance statement sent to your household. Two things are worth knowing. If you pay by credit card, the name of the clinic can appear on the statement. And if you have an online clinic post the medicine to you, a parcel arrives. Most send it in packaging that does not show what is inside, but check beforehand if you are worried."],
  ["Can I buy it if I am under 16?","There is no age limit, but the routes differ. At a pharmacy you may be advised to see a clinic instead. An online service may decline because of your age. A clinic can see you whatever your age, though some may ask a minor for a parent's consent form or for a parent to come along, so call ahead and check. Being advised elsewhere, or being declined, does not mean you cannot get the medicine. A clinic can give you the same medicine, and sometimes that is faster."],
  ["Can someone buy it for me?","With every route, it has to be you. At a pharmacy you go yourself and take it in front of the pharmacist. For a clinic and for an online consultation, the person examined is you. Nobody can collect it on your behalf. But someone can come with you, or help you make the phone call. If going alone feels hard, ask someone you trust to come along."],
  ["Can it be posted to me?","Some private online clinics do post the medicine to your home. It helps when going out is hard. Please check three things first. When will it actually arrive — will it be within the 72 hours? Is it approved in Japan? Ulipristal acetate, offered for use within 120 hours, is not approved in Japan. And a medicine that is not approved is not covered by the national relief system if it harms your health. Note that the national guideline describes collecting it at a pharmacy and taking it there."],
  ["Can I order it from an online drugstore?","No. To buy it at a pharmacy you have to go in and speak with a pharmacist. Medicines imported privately from overseas may be counterfeit, and are not covered by the national relief system if harm occurs."],
  ["Does it prevent pregnancy 100%?","Sadly not. Pregnancy can still happen. Three weeks after taking it, check with a pregnancy test or at a medical facility."],
  ["Are there side effects?","Nausea, headache, lower abdominal pain and unexpected bleeding can occur. If you vomit within two hours of taking it, talk to a pharmacist or doctor."],
  ["I am past 72 hours","You cannot buy it at a pharmacy, but a clinic may be able to discuss options that work between 72 and 120 hours. Please do not give up — go and ask."]
 ],
 aftertitle:"About side effects",
 afterbody1:"Afterwards you may feel sick or have a headache for a while, but this usually settles within a few hours to a day. If you vomit within two hours of taking it, the medicine may not have been absorbed, so please talk to a doctor or pharmacist right away.",
 secrett:"Your privacy is protected",
 secretd:"Pharmacists and doctors are bound by confidentiality. Nothing is passed on to your family, your school or your workplace. If they suggest a support service, they will ask for your agreement first.",
 r3d2:"As a rule, anyone who will take the medicine can be seen and receive a prescription, whatever their age. Some clinics may ask a minor for a parent's consent form or for a parent to come along, so please call ahead and check before you go.",
 r3meritt:"Why a clinic can help",
 r3meritd1:"The greatest reassurance is meeting a doctor face to face and asking about anything that worries you, right there.",
 r3meritd2:"Beyond how to take the medicine and its side effects, you can also ask about testing for sexually transmitted infections, a gynaecological check, and reliable contraception from now on, such as the pill or the Mirena IUS.",
 r3meritd3:"You do not need to wonder whether this is worth going in for, or whether you will be told off. Doctors are there to look after your body and your mind.",
 r3recot:"A clinic is a good choice if",
 r3recod:"If any of these apply to you, going straight to a clinic tends to be more certain and smoother than an online consultation or a pharmacy.",
 r3reco:[
  ["More than 72 hours have passed","Some clinics carry a medicine that can still work up to 120 hours (5 days), rather than the usual one that has to be taken within 72 hours."],
  ["You are under 16 (at junior high, for example)","Online services and pharmacies may decline because of your age and suggest a clinic. If there is a clinic near you, going to ask directly can be faster. It is paid privately, without your health insurance card, and if you would rather your family did not know, you can talk about that too."],
  ["You did not consent, or you experienced sexual violence","If you were forced, or could not say no, it is never your fault. Every prefecture has a one-stop support centre for victims of sexual crime and violence (national freephone #8891). They can tell you about public funding that makes the medicine free, and can go with you to hospital. Please do not carry this alone."]

 r1prept:"Before you go",
 r1prepd1:"You may be asked to show ID such as a My Number card or a health insurance card. It is not required, but it is reassuring to check beforehand.",
 r1prepd2:"The pharmacist will ask things like when you had sex, when your last period was, any allergies, and any medicines you take. A quick note to yourself makes it go smoothly.",
 r2ways:"You can either collect it at a pharmacy you choose, or have it posted to your home.",
 r2w1t:"Collect it at a pharmacy (the national guideline)",
 r2w1d:"After the online consultation the doctor issues a prescription and you collect the medicine at the pharmacy you chose. The pharmacist explains it, and you take it there, in front of them. This is the standard route set out in the health ministry guideline.",
 r2w2t:"Have it posted to your home (private clinics)",
 r2w2d:"Some private clinics send the medicine itself to your home, by post or courier, after the consultation. It really helps when you cannot go out, or when no pharmacy near you is open. It can arrive the same day or the next day.",
 r2cautiont:"Before using a postal service",
 r2cautiond:"Posting is convenient, but there are a few things to watch. Emergency contraception should be taken as soon as possible, within 72 hours of sex (or 120 hours with some medicines). With post there is a risk it arrives too late. Always check when it will actually reach you — the arrival date, not the dispatch date. And never use overseas private import sites: delivery is slow and counterfeits are a real risk. Always choose a service where you are seen by a doctor in Japan.",

 faqtitle:"자주 있는 질문",
 faq:[
  ["신분증이 필요한가요","어느 방법이든 반드시 필요하다고 정해져 있지는 않습니다. 다만 산부인과에서는 첫 진료 때, 온라인 진료에서는 화면 너머로 본인 확인을 위해 제시를 요청받는 경우가 있습니다. 약국에서도 나이 등의 확인으로 물어볼 수 있습니다. 있다면 미리 준비해 두면 안심입니다. 없더라도 그것만을 이유로 포기하지 말고 우선 상담해 보세요."],
  ["부모님께 알려지나요","어느 방법이든 나이와 관계없이 부모의 동의는 필요 없고, 약국이나 병원에서 집으로 연락이 가는 일도 없습니다. 응급피임약은 건강보험을 쓰지 않는 자비 진료라서, 가정으로 가는 의료비 안내에 남지도 않습니다. 다만 두 가지는 알아 두세요. 신용카드로 결제하면 명세서에 의료기관 이름이 남을 수 있습니다. 그리고 온라인 진료로 집에 배송받으면 택배가 도착합니다. 내용물을 알 수 없는 포장으로 보내는 곳이 많지만, 걱정되면 미리 확인해 보세요."],
  ["16세 미만도 살 수 있나요","나이 제한은 없지만 방법에 따라 대응이 다릅니다. 약국에서는 산부인과를 권유받을 수 있습니다. 온라인 진료에서는 나이를 이유로 거절될 수 있습니다. 산부인과는 나이와 관계없이 진료받을 수 있지만, 시설에 따라 미성년자에게 보호자의 동의서나 동반을 요청하기도 하니 가기 전에 전화로 확인하세요. 권유받거나 거절당해도 약을 받을 수 없다는 뜻은 아닙니다. 산부인과에서 같은 약을 받을 수 있고, 그편이 더 빠를 때도 있습니다."],
  ["대신 사다 줄 수 있나요","어느 방법이든 본인이 받아야 합니다. 약국에서는 본인이 가서 약사 앞에서 복용합니다. 산부인과도 온라인 진료도 진찰을 받는 사람은 본인입니다. 다른 사람이 대신 받을 수는 없습니다. 다만 함께 가 달라고 하거나, 전화 거는 것을 도와 달라고 할 수는 있습니다. 혼자가 불안하다면 믿을 수 있는 사람에게 동행을 부탁해 보세요."],
  ["집으로 배송받을 수 있나요","온라인 진료를 하는 자비 진료 클리닉 중에는 약을 집으로 배송하는 곳이 있습니다. 외출이 어려울 때 도움이 됩니다. 이용 전에 세 가지만 확인하세요. 첫째, 언제 도착하는지. 72시간 기한에 맞출 수 있는지가 중요합니다. 둘째, 일본에서 승인된 약인지. 120시간용으로 안내되는 울리프리스탈 아세테이트는 일본에서 승인되지 않았습니다. 셋째, 승인되지 않은 약은 만일 몸에 이상이 생겨도 국가 구제 제도의 대상이 되지 않습니다. 참고로 국가 지침에서는 약국에서 받아 약사 앞에서 복용하는 방법을 제시하고 있습니다."],
  ["드러그스토어 온라인몰에서 살 수 있나요","살 수 없습니다. 약국에서 사는 경우에는 매장에 가서 약사와 대면으로 이야기해야 합니다. 해외에서 개인 수입한 약은 가짜일 우려가 있고, 건강 피해가 생겨도 국가 구제 제도의 대상이 되지 않습니다."],
  ["100% 임신을 막을 수 있나요","아쉽지만 100%는 아닙니다. 복용해도 임신하는 경우가 있습니다. 복용 후 3주 뒤에 임신테스트기나 의료기관에서 확인하세요."],
  ["부작용이 있나요","메스꺼움, 두통, 아랫배 통증, 부정출혈 등이 나타날 수 있습니다. 복용 후 2시간 이내에 토한 경우에는 약사나 의사에게 상담하세요."],
  ["72시간이 지나 버렸어요","약국에서는 살 수 없지만, 산부인과에서는 72시간에서 120시간 사이에 쓸 수 있는 방법을 상담할 수 있는 경우가 있습니다. 부디 포기하지 말고 상담해 보세요."]
 ],
 aftertitle:"부작용에 대하여",
 afterbody1:"약을 복용한 뒤에는 일시적으로 메스꺼움이나 두통이 있을 수 있지만, 몇 시간에서 하루 정도면 가라앉는 경우가 많습니다. 만약 복용 후 2시간 이내에 토했다면 약이 흡수되지 않았을 가능성이 있으니 바로 의사나 약사에게 상담하세요.",
 secrett:"비밀은 지켜집니다",
 secretd:"약사와 의사에게는 비밀유지 의무가 있습니다. 가족이나 학교, 직장에 전해지는 일은 없습니다. 상담 기관을 소개하는 경우에도 본인의 동의를 받은 뒤에 이루어집니다.",
 r3d2:"원칙적으로 복용할 본인이라면 나이와 관계없이 진료를 받고 처방받을 수 있습니다. 다만 시설에 따라 미성년자의 경우 보호자의 동의서나 동반을 요청하는 경우도 있으니, 반드시 미리 전화 등으로 문의해 확인한 뒤에 방문하세요.",
 r3meritt:"산부인과를 찾는 장점",
 r3meritd1:"가장 큰 안심은 의사를 직접 만나 불안한 점을 그 자리에서 상담할 수 있다는 것입니다.",
 r3meritd2:"약 복용법이나 부작용뿐 아니라, 원한다면 성매개감염 검사나 부인과 검진, 앞으로의 확실한 피임 방법(경구피임약이나 미레나 등)에 대해서도 함께 상담할 수 있습니다.",
 r3meritd3:"이런 일로 가도 되나, 혼나지 않을까 하고 망설이지 않아도 괜찮습니다. 의사는 당신의 몸과 마음을 지키기 위해 진료합니다.",
 r3recot:"이런 분께는 산부인과를 권합니다",
 r3recod:"다음에 해당하는 분은 온라인 진료나 약국 구입보다, 산부인과를 직접 찾는 편이 더 확실하고 순조롭게 대응받을 수 있습니다.",
 r3reco:[
  ["성관계로부터 72시간이 지난 분","국내에서 일반적인 응급피임약(72시간 이내에 사용하는 약)이 아니라, 120시간(5일) 이내까지 효과를 기대할 수 있는 약을 취급하는 산부인과도 있습니다."],
  ["16세 미만(중학생 등)인 분","온라인 진료나 약국에서는 나이를 이유로 대응을 거절당하고 산부인과 진료를 권유받는 경우가 있습니다. 집 근처에 진료받을 수 있는 산부인과가 있다면 직접 상담하러 가는 편이 빠른 경우도 있습니다. 건강보험증을 쓰지 않는 자비 진료이지만, 가족에게 알리고 싶지 않은 등의 바람이 있다면 그것도 함께 상담해 보세요."],
  ["동의 없는 성관계나 성폭력 피해를 입은 분","강제로 당했거나 거절할 수 없었던 경우는 결코 당신의 잘못이 아닙니다. 각 도도부현에 있는 성범죄·성폭력 피해자를 위한 원스톱 지원센터(전국 공통 무료 다이얼 #8891)에 전화하면, 응급피임약 비용이 무료(공적 부담)가 되는 제도나 병원 동행 등의 지원을 받을 수 있습니다. 혼자 끌어안지 말고 우선 상담해 주세요."]

 r1prept:"가기 전 준비",
 r1prepd1:"마이넘버카드나 건강보험증 등 신분증 제시를 요청받는 경우가 있습니다. 필수는 아니지만 미리 확인해 두면 안심입니다.",
 r1prepd2:"구입 시 약사에게서 성관계가 있었던 일시, 마지막 생리가 언제였는지, 알레르기 이력, 복용 중인 약 등을 질문받습니다. 메모해 두면 수월합니다.",
 r2ways:"본인이 지정한 약국에서 받거나, 집 등으로 배송받아 수령할 수 있습니다.",

 r2w1d:"온라인 진료 후 의사가 처방전을 발행하고, 지정한 약국으로 약을 받으러 가는 방법입니다. 약국에서 약사의 설명을 듣고 그 자리에서(약사 앞에서) 약을 복용합니다. 이것이 후생노동성 지침에 정해진 원칙적인 방식입니다.",
 r2w2t:"집 우편함 등으로 배송받는 방법(자비 진료 클리닉의 배송 서비스)",
 r2w2d:"자비 진료를 하는 일부 클리닉에서는 진료 후 약 자체를 집으로 우편이나 퀵서비스 등으로 보내 주는 서비스를 하고 있습니다. 도저히 외출할 수 없다, 근처에 문을 연 약국이 없다 같은 경우에 큰 도움이 되는 선택지입니다. 빠르면 당일이나 다음 날 우편함에 도착하기도 합니다.",
 r2cautiont:"배송 서비스를 이용할 때의 주의점",
 r2cautiond:"매우 편리한 배송 서비스이지만 몇 가지 주의해 주셨으면 하는 점이 있습니다. 응급피임약은 성관계 후 72시간 이내(약에 따라서는 120시간 이내)에 되도록 빨리 복용하는 것이 중요합니다. 배송의 경우 도착까지 시간이 걸려 기한에 맞추지 못할 위험이 있습니다. 이용할 때는 반드시 언제 내 손에 도착하는지(발송일이 아니라 도착일)를 확실히 확인하세요. 또한 해외 개인 수입 사이트는 도착이 늦고 가짜일 위험도 있으므로 절대 이용하지 마세요. 반드시 국내 의사의 진료를 받을 수 있는 서비스를 고르세요.",

 faqtitle:"常见问题",
 faq:[
  ["需要身份证件吗","三种方法都没有规定必须携带。不过在妇产科初次就诊时、在线问诊时对着镜头出示，都可能被要求确认身份。药店也可能为了确认年龄而询问。若有，事先准备好会更安心。即使没有，也不要只因为这一点就放弃，先咨询看看。"],
  ["父母会知道吗","三种方法都一样：无论年龄大小都不需要父母同意，药店和医院也不会联系家里。紧急避孕药属于不使用健康保险的自费诊疗，因此不会出现在寄往家中的医疗费通知上。有两点需要留意：用信用卡付款时，账单上可能留下医疗机构的名称；通过在线问诊寄到家里时，会有包裹送达。多数会使用看不出内容的包装，若担心请事先确认。"],
  ["未满16岁也能买吗","没有年龄限制，但各方法的处理方式不同。在药店可能被建议去妇产科；在线问诊可能以年龄为由拒绝；妇产科则无论年龄都可以就诊，不过部分机构会要求未成年人提供监护人同意书或由监护人陪同，请出发前电话确认。被建议或被拒绝，并不代表拿不到药。妇产科可以开同样的药，而且有时更快。"],
  ["可以让别人代买吗","三种方法都必须由本人办理。在药店由本人前往并在药剂师面前服用；妇产科和在线问诊接受诊察的也是本人。其他人不能代为领取。不过，可以请人陪你一起去，或帮你打电话。如果一个人去感到不安，可以请信任的人陪同。"],
  ["可以寄到家里吗","在提供在线问诊的自费诊疗诊所中，有些会把药寄到家里。在难以外出时很有帮助。使用前请确认三点。第一，什么时候送达，能否赶上72小时的期限很关键。第二，是否为日本已批准的药。作为120小时用介绍的醋酸乌利司他在日本尚未批准。第三，未获批准的药物，万一身体出现不适，也不属于国家救济制度的对象。另外，国家指南所示的方式是在药店领取并在药剂师面前服用。"],
  ["能在药妆店的网店买吗","不能。在药店购买需要到店与药剂师当面沟通。从海外个人进口的药物有假货风险，出现健康损害也不属于国家救济制度的对象。"],
  ["能100%防止怀孕吗","很遗憾并非100%。服用后仍可能怀孕。服药三周后，请用验孕棒或到医疗机构确认。"],
  ["有副作用吗","可能出现恶心、头痛、下腹痛、不规则出血等。若服药后2小时内呕吐，请咨询药剂师或医生。"],
  ["已经超过72小时了","药店买不到，但妇产科有时可以商量在72小时至120小时之间可用的方法。请不要放弃，去咨询看看。"]
 ],
 aftertitle:"关于副作用",
 afterbody1:"服药后可能会暂时出现恶心或头痛，但多数在数小时至一天左右缓解。如果服药后2小时内呕吐，药物可能没有被吸收，请立即咨询医生或药剂师。",

 r3meritt:"到妇产科就诊的好处",
 r3meritd1:"最大的安心，是能当面见到医生，把不安的事情当场说出来商量。",
 r3meritd2:"除了服药方法和副作用，如果希望，还可以一并咨询性传播感染的检查、妇科检查，以及今后可靠的避孕方法（如低剂量避孕药或蜜蕊娜宫内节育系统等）。",
 r3meritd3:"不用犹豫这种事去看医生好不好、会不会被责备。医生是为了守护你的身体和心而诊治的。",
 r3recot:"这些情况推荐去妇产科",
 r3recod:"符合以下情况的人，比起在线问诊或在药店购买，直接前往妇产科能得到更确实、更顺畅的处理。",
 r3reco:[
  ["距离性行为已超过72小时的人","有些妇产科提供的不是国内常见的紧急避孕药（需在72小时内使用），而是可望在120小时（5天）以内仍有效果的药。"],
  ["未满16岁（如初中生）的人","在线问诊或药店可能以年龄为由拒绝对应，并建议去妇产科就诊。如果家附近有能就诊的妇产科，直接去咨询有时更快。这是不使用健康保险证的自费诊疗，如果有不想让家人知道等的想法，也可以一并商量。"],
  ["遭受非自愿性行为或性暴力的人","被强迫、或无法拒绝，这绝不是你的错。拨打各都道府县设有的性犯罪·性暴力受害者一站式支援中心（全国统一免费电话 #8891），可以了解让紧急避孕药费用免费（公费负担）的制度，也能获得陪同就医等支持。请不要独自承受，先联系咨询。"]

 spectitle:"Về thuốc",
 spechint:"Ở Nhật có hai loại thuốc tránh thai khẩn cấp bán tại nhà thuốc. Thành phần và hàm lượng giống nhau.",

 specnote:"Giá là giá bán lẻ đề xuất và có thể khác nhau tùy nhà thuốc. Nguồn: Bộ Y tế, Lao động và Phúc lợi; Hội Dược sĩ Nhật Bản; tờ hướng dẫn sử dụng của từng sản phẩm.",
 faqtitle:"Câu hỏi thường gặp",
 faq:[
  ["Có cần giấy tờ tùy thân không?","Cả ba cách đều không có quy định bắt buộc phải có. Tuy nhiên phòng khám có thể yêu cầu khi bạn đến lần đầu, khám trực tuyến có thể yêu cầu bạn đưa lên trước camera, và nhà thuốc có thể hỏi để xác nhận tuổi. Nếu có, hãy chuẩn bị sẵn cho yên tâm. Nếu không có, đừng bỏ cuộc chỉ vì điều đó, hãy cứ hỏi khi đến nơi."],
  ["Bố mẹ có biết không?","Với cả ba cách, bất kể tuổi nào bạn cũng không cần sự đồng ý của bố mẹ, và nhà thuốc hay phòng khám đều không liên hệ về nhà bạn. Thuốc tránh thai khẩn cấp là dịch vụ tự chi trả, không dùng bảo hiểm y tế, nên cũng không xuất hiện trên thông báo chi phí y tế gửi về gia đình. Có hai điều nên biết: nếu thanh toán bằng thẻ tín dụng, tên cơ sở y tế có thể hiện trên sao kê; và nếu nhờ phòng khám trực tuyến gửi thuốc về nhà thì sẽ có bưu kiện tới. Phần lớn gửi bằng bao bì không lộ bên trong, nhưng nếu lo lắng hãy hỏi trước."],
  ["Dưới 16 tuổi có mua được không?","Không có giới hạn tuổi, nhưng mỗi cách xử lý khác nhau. Ở nhà thuốc bạn có thể được khuyên đến phòng khám. Khám trực tuyến có thể từ chối vì lý do tuổi. Phòng khám thì tiếp nhận bất kể tuổi, tuy vậy một số nơi có thể yêu cầu giấy đồng ý của người giám hộ hoặc yêu cầu đi cùng nếu bạn chưa thành niên, nên hãy gọi điện hỏi trước. Được khuyên đi nơi khác hay bị từ chối không có nghĩa là bạn không lấy được thuốc. Phòng khám có thể cho bạn đúng loại thuốc đó, và đôi khi còn nhanh hơn."],
  ["Người khác mua giúp được không?","Cả ba cách đều phải là chính bạn. Ở nhà thuốc, bạn tự đến và uống trước mặt dược sĩ. Với phòng khám và khám trực tuyến, người được khám cũng là bạn. Người khác không thể nhận thay. Tuy nhiên, bạn có thể nhờ ai đó đi cùng, hoặc giúp bạn gọi điện. Nếu đi một mình khiến bạn lo lắng, hãy nhờ người bạn tin tưởng đi cùng."],
  ["Có thể gửi về nhà không?","Một số phòng khám tự chi trả có khám trực tuyến sẽ gửi thuốc về tận nhà. Điều này giúp ích khi bạn khó ra ngoài. Trước khi dùng, hãy kiểm tra ba điều. Thứ nhất, khi nào thuốc tới — có kịp trong 72 giờ không. Thứ hai, đó có phải thuốc được cấp phép tại Nhật không. Ulipristal acetate, được giới thiệu dùng trong 120 giờ, chưa được cấp phép ở Nhật. Thứ ba, thuốc chưa được cấp phép sẽ không thuộc diện được chế độ cứu trợ của nhà nước hỗ trợ nếu có vấn đề sức khỏe. Ngoài ra, hướng dẫn của nhà nước nêu cách nhận thuốc tại nhà thuốc và uống trước mặt dược sĩ."],
  ["Mua qua trang bán hàng của hiệu thuốc được không?","Không được. Nếu mua tại nhà thuốc, bạn phải đến nơi và trao đổi trực tiếp với dược sĩ. Thuốc nhập khẩu cá nhân từ nước ngoài có nguy cơ là hàng giả, và nếu gây hại sức khỏe cũng không thuộc diện được chế độ cứu trợ của nhà nước hỗ trợ."],
  ["Có ngăn được thai 100% không?","Rất tiếc là không. Vẫn có thể mang thai. Ba tuần sau khi uống, hãy kiểm tra bằng que thử thai hoặc tại cơ sở y tế."],
  ["Có tác dụng phụ không?","Có thể buồn nôn, đau đầu, đau bụng dưới, ra máu bất thường. Nếu bạn nôn trong vòng 2 giờ sau khi uống, hãy hỏi dược sĩ hoặc bác sĩ."],
  ["Tôi đã quá 72 giờ rồi","Nhà thuốc không bán được, nhưng phòng khám sản phụ khoa đôi khi có thể trao đổi về cách dùng trong khoảng từ 72 đến 120 giờ. Xin đừng bỏ cuộc, hãy thử hỏi."]
 ],
 aftertitle:"Về tác dụng phụ",
 afterbody1:"Sau khi uống, bạn có thể buồn nôn hoặc đau đầu một thời gian, nhưng thường dịu đi trong vài giờ đến một ngày. Nếu bạn nôn trong vòng 2 giờ sau khi uống, thuốc có thể chưa được hấp thu, nên hãy hỏi bác sĩ hoặc dược sĩ ngay.",
 secrett:"Bí mật của bạn được giữ kín",
 secretd:"Dược sĩ và bác sĩ có nghĩa vụ bảo mật. Thông tin sẽ không được chuyển tới gia đình, trường học hay nơi làm việc của bạn. Nếu họ giới thiệu một tổ chức hỗ trợ, việc đó cũng chỉ tiến hành sau khi có sự đồng ý của bạn.",
 r3d2:"Về nguyên tắc, nếu là chính người sẽ uống thuốc thì có thể khám và được kê đơn, bất kể tuổi tác. Tuy nhiên một số cơ sở có thể yêu cầu giấy đồng ý của người giám hộ hoặc yêu cầu đi cùng nếu bạn chưa thành niên, nên hãy gọi điện hỏi trước rồi mới đến.",
 r3meritt:"Lợi ích khi đến phòng khám sản phụ khoa",
 r3meritd1:"Điều yên tâm nhất là được gặp trực tiếp bác sĩ và hỏi ngay tại chỗ những điều bạn đang lo lắng.",
 r3meritd2:"Ngoài cách uống thuốc và tác dụng phụ, nếu muốn bạn còn có thể trao đổi về xét nghiệm bệnh lây qua đường tình dục, khám phụ khoa, và cách tránh thai chắc chắn về sau (như thuốc tránh thai hằng ngày hoặc vòng Mirena).",
 r3meritd3:"Bạn không cần băn khoăn rằng chuyện thế này có nên đi khám không, hay có bị mắng không. Bác sĩ khám để bảo vệ cơ thể và tinh thần của bạn.",
 r3recot:"Những trường hợp nên đến phòng khám sản phụ khoa",
 r3recod:"Nếu bạn thuộc các trường hợp sau, đến thẳng phòng khám sản phụ khoa thường chắc chắn và suôn sẻ hơn so với khám trực tuyến hay mua ở nhà thuốc.",
 r3reco:[
  ["Đã quá 72 giờ kể từ khi quan hệ","Có những phòng khám sản phụ khoa cung cấp loại thuốc có thể còn hiệu quả trong vòng 120 giờ (5 ngày), thay vì loại thông thường ở Nhật phải dùng trong 72 giờ."],
  ["Người dưới 16 tuổi (ví dụ học sinh cấp hai)","Khám trực tuyến hoặc nhà thuốc có thể từ chối vì lý do tuổi và khuyên bạn đến phòng khám sản phụ khoa. Nếu gần nhà có phòng khám, đến hỏi trực tiếp đôi khi nhanh hơn. Đây là khám tự chi trả, không dùng thẻ bảo hiểm y tế, và nếu bạn không muốn gia đình biết thì cũng có thể trao đổi luôn điều đó."],
  ["Người bị quan hệ không có sự đồng thuận hoặc bị bạo lực tình dục","Nếu bạn bị ép buộc, hoặc không thể từ chối, đó hoàn toàn không phải lỗi của bạn. Mỗi tỉnh thành đều có Trung tâm hỗ trợ một cửa dành cho nạn nhân của tội phạm tình dục và bạo lực tình dục (số miễn phí toàn quốc #8891). Gọi tới đó, bạn sẽ được biết về chế độ chi trả bằng ngân sách công giúp miễn phí tiền thuốc, và được hỗ trợ như đi cùng đến bệnh viện. Xin đừng ôm một mình, hãy liên hệ trước đã."]

 r1prept:"Chuẩn bị trước khi đi",
 r1prepd1:"Bạn có thể được yêu cầu xuất trình giấy tờ tùy thân như thẻ My Number hoặc thẻ bảo hiểm y tế. Không bắt buộc, nhưng xác nhận trước sẽ yên tâm hơn.",
 r1prepd2:"Khi mua, dược sĩ sẽ hỏi những điều như thời điểm quan hệ, kỳ kinh cuối là khi nào, tiền sử dị ứng, thuốc đang dùng. Ghi sẵn ra giấy sẽ nhanh hơn.",
 r2ways:"Bạn có thể nhận tại nhà thuốc do mình chỉ định, hoặc nhận qua đường bưu điện gửi về nhà.",
 r2w1t:"Nhận tại nhà thuốc (cách theo hướng dẫn của nhà nước)",
 r2w1d:"Sau khi khám trực tuyến, bác sĩ kê đơn và bạn đến nhà thuốc đã chỉ định để lấy thuốc. Bạn nghe dược sĩ giải thích và uống ngay tại chỗ, trước mặt dược sĩ. Đây là cách nguyên tắc được quy định trong hướng dẫn của Bộ Y tế.",
 r2w2t:"Gửi về hộp thư tại nhà (dịch vụ gửi thuốc của phòng khám tự chi trả)",
 r2w2d:"Một số phòng khám tự chi trả có dịch vụ gửi chính thuốc về nhà bạn qua bưu điện hoặc chuyển phát nhanh sau khi khám. Đây là lựa chọn rất hữu ích khi bạn không thể ra ngoài, hoặc gần nhà không có nhà thuốc nào đang mở. Nhanh thì có thể tới hộp thư ngay trong ngày hoặc hôm sau.",
 r2cautiont:"Lưu ý khi dùng dịch vụ gửi thuốc",
 r2cautiond:"Dịch vụ gửi thuốc rất tiện, nhưng có vài điều mong bạn lưu ý. Thuốc tránh thai khẩn cấp cần được uống càng sớm càng tốt, trong vòng 72 giờ sau quan hệ (với một số thuốc là 120 giờ). Khi gửi qua bưu điện, có rủi ro thuốc tới muộn và không kịp thời hạn. Khi sử dụng, nhất định phải xác nhận khi nào thuốc thực sự tới tay bạn (là ngày nhận, không phải ngày gửi). Ngoài ra, tuyệt đối không dùng các trang nhập khẩu cá nhân từ nước ngoài, vì thuốc tới chậm và có nguy cơ là hàng giả. Hãy luôn chọn dịch vụ mà bạn được bác sĩ trong nước khám.",

  ["परिचयपत्र चाहिन्छ?","तीनवटै उपायमा अनिवार्य चाहिन्छ भन्ने नियम छैन। तर क्लिनिकमा पहिलो पटक जाँदा, अनलाइन परामर्शमा क्यामेराअगाडि देखाउन, र फार्मेसीमा उमेर पक्का गर्न सोधिन सक्छ। भएमा तयार राखे ढुक्क हुन्छ। नभए पनि त्यत्ति कारणले नछोड्नुहोस्, पहिले सोध्नुहोस्।"],
  ["आमाबुबालाई थाहा हुन्छ?","तीनवटै उपायमा उमेर जेसुकै भए पनि आमाबुबाको सहमति चाहिँदैन, र फार्मेसी वा अस्पतालबाट घरमा सम्पर्क पनि गरिँदैन। आपत्कालीन गर्भनिरोधक औषधि स्वास्थ्य बिमा प्रयोग नगर्ने निजी खर्चको सेवा भएकाले, घरमा आउने उपचार खर्चको सूचनामा पनि देखिँदैन। दुई कुरा भने ध्यान दिनुहोस्: क्रेडिट कार्डले भुक्तानी गर्दा विवरणमा स्वास्थ्य संस्थाको नाम रहन सक्छ, र अनलाइन परामर्शबाट घरमा पठाउँदा पार्सल आइपुग्छ। भित्र के छ थाहा नहुने प्याकेजिङमा पठाउने ठाउँ धेरै छन्, तर चिन्ता लागे पहिल्यै सोध्नुहोस्।"],
  ["१६ वर्षमुनिकाले किन्न सक्छन्?","उमेरको बन्देज छैन, तर उपायअनुसार व्यवहार फरक हुन्छ। फार्मेसीमा क्लिनिक जान सुझाव दिइन सक्छ। अनलाइन परामर्शमा उमेरका कारण अस्वीकार हुन सक्छ। क्लिनिकमा उमेर जेसुकै भए पनि जाँच गराउन सकिन्छ, तर कतिपय संस्थाले नाबालिगका हकमा अभिभावकको सहमति पत्र वा साथमा आउन भन्न सक्छन्, त्यसैले जानुअघि फोन गरेर पक्का गर्नुहोस्। सुझाव दिइनु वा अस्वीकार हुनुले औषधि पाइँदैन भन्ने अर्थ लाग्दैन। क्लिनिकबाट उही औषधि पाइन्छ, र कहिलेकाहीँ त्यो नै छिटो हुन्छ।"],
  ["अरूले किनिदिन सक्छन्?","तीनवटै उपायमा आफैंले लिनुपर्छ। फार्मेसीमा आफैं गएर फार्मासिस्टको अगाडि खानुहुन्छ। क्लिनिक र अनलाइन परामर्शमा पनि जाँच गराउने व्यक्ति आफैं हुनुहुन्छ। अरूले सट्टामा लिन मिल्दैन। तर कसैलाई सँगै जान वा फोन गर्न सहयोग गर्न भन्न सकिन्छ। एक्लै जान गाह्रो लागे, विश्वास लाग्ने मान्छेलाई साथ जान अनुरोध गर्नुहोस्।"],
  ["घरमा पठाइदिन मिल्छ?","अनलाइन परामर्श दिने केही निजी क्लिनिकले औषधि घरमै पठाउँछन्। बाहिर निस्कन गाह्रो हुँदा यो सहयोगी हुन्छ। प्रयोग गर्नुअघि तीन कुरा पक्का गर्नुहोस्। पहिलो, कहिले आइपुग्छ — ७२ घण्टाको समयभित्र आउँछ कि आउँदैन। दोस्रो, जापानमा स्वीकृत औषधि हो कि होइन। १२० घण्टाका लागि भनी बताइने युलिप्रिस्टल एसिटेट जापानमा स्वीकृत छैन। तेस्रो, स्वीकृत नभएको औषधिबाट स्वास्थ्यमा असर परे राष्ट्रिय राहत प्रणालीले समेट्दैन। साथै, राष्ट्रिय निर्देशिकाले फार्मेसीबाट लिएर फार्मासिस्टको अगाडि खाने तरिका देखाएको छ।"],
  ["अनलाइन पसलबाट किन्न मिल्छ?","मिल्दैन। फार्मेसीबाट किन्ने भए पसलमै गएर फार्मासिस्टसँग आमनेसामने कुरा गर्नुपर्छ। विदेशबाट व्यक्तिगत रूपमा मगाइएको औषधि नक्कली हुन सक्छ र स्वास्थ्यमा असर परे राष्ट्रिय राहत प्रणालीले समेट्दैन।"],
  ["१००% गर्भ रोक्न सकिन्छ?","दुःखको कुरा, १००% होइन। खाएपछि पनि गर्भ रहन सक्छ। खाएको तीन हप्तापछि गर्भ परीक्षण किट वा स्वास्थ्य संस्थामा पक्का गर्नुहोस्।"],
  ["साइड इफेक्ट हुन्छ?","वाकवाकी, टाउको दुख्ने, तल्लो पेट दुख्ने, अनियमित रक्तस्राव आदि हुन सक्छ। खाएको २ घण्टाभित्र बान्ता भएमा फार्मासिस्ट वा डाक्टरसँग सल्लाह गर्नुहोस्।"],
  ["७२ घण्टा नाघिसक्यो","फार्मेसीबाट किन्न मिल्दैन, तर क्लिनिकमा ७२ देखि १२० घण्टाबीच प्रयोग गर्न मिल्ने उपायबारे कुरा गर्न सकिने हुन्छ। कृपया हरेस नखाई सोध्न जानुहोस्।"]
 ],
 aftertitle:"साइड इफेक्टबारे",
 afterbody1:"औषधि खाएपछि केही समय वाकवाकी वा टाउको दुख्न सक्छ, तर प्रायः केही घण्टादेखि एक दिनभित्र कम हुन्छ। खाएको २ घण्टाभित्र बान्ता भएमा औषधि सोसिएको नहुन सक्छ, त्यसैले तुरुन्तै डाक्टर वा फार्मासिस्टसँग सल्लाह गर्नुहोस्।",
 secrett:"गोपनीयता सुरक्षित रहन्छ",
 secretd:"फार्मासिस्ट र डाक्टरको गोपनीयता राख्ने कर्तव्य हुन्छ। परिवार, विद्यालय वा कार्यस्थलमा जानकारी जाँदैन। परामर्श संस्था सिफारिस गर्दा पनि तपाईंको सहमति लिएर मात्र गरिन्छ।",
 r3d2:"सिद्धान्ततः औषधि खाने व्यक्ति आफैं भए उमेर जेसुकै भए पनि जाँच गराएर औषधि लेखाउन सकिन्छ। तर कतिपय संस्थाले नाबालिग भए अभिभावकको सहमति पत्र वा साथमा आउन भन्न सक्छन्, त्यसैले जानुअघि फोन आदिबाट अनिवार्य रूपमा सोधेर पक्का गर्नुहोस्।",
 r3meritt:"क्लिनिक जाँदाको फाइदा",
 r3meritd1:"सबैभन्दा ठूलो ढुक्क कुरा भनेको डाक्टरसँग प्रत्यक्ष भेटेर चिन्ताका कुरा त्यहीँ सोध्न पाइनु हो।",
 r3meritd2:"औषधि खाने तरिका र साइड इफेक्टबाहेक, चाहेमा यौन सम्पर्कबाट सर्ने रोगको परीक्षण, स्त्री रोग जाँच, र अबका लागि भरपर्दो गर्भनिरोधका उपाय (जस्तै नियमित खाने गर्भनिरोधक चक्की वा मिरेना) बारे पनि सँगै कुरा गर्न सकिन्छ।",
 r3meritd3:"यस्तो कुराका लागि जान हुन्छ कि हुँदैन, गाली त पाइँदैन भनेर अलमलिनु पर्दैन। डाक्टरले तपाईंको शरीर र मन जोगाउन जाँच गर्ने हो।",
 r3recot:"यस्ता व्यक्तिलाई क्लिनिक सिफारिस गरिन्छ",
 r3recod:"तलका कुरा मिल्ने व्यक्तिलाई अनलाइन परामर्श वा फार्मेसीबाट किन्नुभन्दा सिधै क्लिनिक जाँदा बढी पक्का र सहज हुन्छ।",
 r3reco:[
  ["यौन सम्पर्कदेखि ७२ घण्टा नाघिसकेका","जापानमा सामान्य रूपमा पाइने औषधि (७२ घण्टाभित्र प्रयोग गर्ने) होइन, १२० घण्टा (५ दिन) भित्रसम्म असर हुन सक्ने औषधि राख्ने क्लिनिक पनि छन्।"],
  ["१६ वर्षमुनिका (जस्तै माध्यमिक तहका विद्यार्थी)","अनलाइन परामर्श वा फार्मेसीले उमेरका कारण सेवा दिन नमानी क्लिनिक जान सुझाव दिन सक्छन्। घर नजिकै क्लिनिक भए सिधै गएर सोध्दा छिटो हुन सक्छ। स्वास्थ्य बिमा कार्ड नचल्ने निजी खर्चको जाँच हो, तर परिवारलाई थाहा नहोस् भन्ने चाहना भए त्यो पनि सँगै भन्न सकिन्छ।"],
  ["सहमतिबिनाको यौन सम्पर्क वा यौन हिंसा भोगेका","जबरजस्ती भएको वा अस्वीकार गर्न नसकेको अवस्था कहिल्यै तपाईंको गल्ती होइन। हरेक प्रान्तमा रहेको यौन अपराध तथा यौन हिंसा पीडितका लागि वन-स्टप सहयोग केन्द्र (देशभर निःशुल्क नम्बर #8891) मा फोन गर्दा, आपत्कालीन गर्भनिरोधक औषधिको खर्च निःशुल्क (सरकारी खर्च) हुने व्यवस्था र अस्पतालसम्म साथ जाने जस्ता सहयोग पाइन्छ। एक्लै नबोकी पहिले सम्पर्क गर्नुहोस्।"]
 ],
 r1prept:"जानुअघिको तयारी",
 r1prepd1:"माइ नम्बर कार्ड वा स्वास्थ्य बिमा कार्ड जस्ता परिचयपत्र देखाउन भनिन सक्छ। अनिवार्य होइन, तर पहिल्यै पक्का गर्दा ढुक्क हुन्छ।",
 r1prepd2:"किन्दा फार्मासिस्टले यौन सम्पर्क भएको मिति र समय, अन्तिम महिनावारी कहिले भएको, एलर्जीको इतिहास, खाइरहेको औषधि आदि सोध्छन्। टिपोट गरेर लगे सहज हुन्छ।",
 r2ways:"आफैंले तोकेको फार्मेसीबाट लिन सकिन्छ, वा घरमा पठाइएको औषधि प्राप्त गर्न सकिन्छ।",
 r2w1t:"फार्मेसीमा गएर लिने तरिका (राष्ट्रिय निर्देशिकाअनुसार)",
 r2w1d:"अनलाइन परामर्शपछि डाक्टरले प्रिस्क्रिप्सन दिन्छन् र तोकिएको फार्मेसीमा गएर औषधि लिनुहुन्छ। फार्मेसीमा फार्मासिस्टको व्याख्या सुनेर त्यहीँ (फार्मासिस्टकै अगाडि) औषधि खानुहुन्छ। स्वास्थ्य मन्त्रालयको निर्देशिकाले तोकेको सिद्धान्तगत तरिका यही हो।",
 r2w2t:"घरको पत्रपेटीमा पठाइदिने तरिका (निजी क्लिनिकको पठाउने सेवा)",
 r2w2d:"निजी खर्चमा सेवा दिने केही क्लिनिकले परामर्शपछि औषधि नै घरमा हुलाक वा कुरियरबाट पठाइदिने सेवा दिन्छन्। कुनै हालतमा बाहिर निस्कन नसक्ने, वा नजिकै खुलेको फार्मेसी नभएको अवस्थामा यो निकै सहयोगी विकल्प हो। छिटो भए सोही दिन वा भोलिपल्ट पत्रपेटीमा आइपुग्न सक्छ।",
 r2cautiont:"पठाउने सेवा प्रयोग गर्दाका सावधानी",
 r2cautiond:"पठाउने सेवा निकै सजिलो भए पनि केही कुरामा ध्यान दिनुहोस्। आपत्कालीन गर्भनिरोधक औषधि यौन सम्पर्कपछि ७२ घण्टाभित्र (कुनै औषधिको हकमा १२० घण्टाभित्र) सकेसम्म चाँडो खानु महत्त्वपूर्ण हुन्छ। पठाइने अवस्थामा आइपुग्न समय लागेर समयसीमा नभ्याउने जोखिम हुन्छ। प्रयोग गर्दा औषधि कहिले आफ्नो हातमा आइपुग्छ (पठाएको मिति होइन, आइपुग्ने मिति) अनिवार्य रूपमा पक्का गर्नुहोस्। साथै विदेशबाट व्यक्तिगत रूपमा मगाउने साइट ढिलो आइपुग्ने र नक्कली हुन सक्ने भएकाले कदापि प्रयोग नगर्नुहोस्। सधैं देशभित्रैका डाक्टरको जाँच पाइने सेवा छान्नुहोस्।",

 specnote:"Harga adalah harga runcit yang dicadangkan dan mungkin berbeza mengikut farmasi. Sumber: Kementerian Kesihatan, Buruh dan Kebajikan; Persatuan Farmasi Jepun; risalah produk.",
 faqtitle:"Soalan lazim",
 faq:[
  ["Perlukah kad pengenalan?","Ketiga-tiga cara tidak mewajibkannya. Namun klinik mungkin memintanya pada kunjungan pertama, rundingan dalam talian mungkin meminta anda menunjukkannya di depan kamera, dan farmasi mungkin bertanya untuk mengesahkan umur. Jika ada, sediakan supaya lebih tenang. Jika tiada, jangan berputus asa hanya kerana itu — tanya sahaja apabila anda sampai."],
  ["Adakah ibu bapa akan tahu?","Bagi ketiga-tiga cara, tidak kira umur, kebenaran ibu bapa tidak diperlukan, dan farmasi mahupun klinik tidak akan menghubungi rumah anda. Kontraseptif kecemasan ialah rawatan bayaran sendiri tanpa insurans kesihatan, jadi ia juga tidak muncul dalam notis kos perubatan yang dihantar ke rumah. Dua perkara perlu diketahui: jika anda membayar dengan kad kredit, nama fasiliti perubatan boleh muncul dalam penyata; dan jika klinik dalam talian menghantar ubat ke rumah, bungkusan akan sampai. Kebanyakannya menghantar dalam pembungkusan yang tidak menampakkan isinya, tetapi tanyalah dahulu jika anda bimbang."],
  ["Bolehkah membeli jika bawah 16 tahun?","Tiada had umur, tetapi layanan berbeza mengikut cara. Di farmasi anda mungkin dinasihatkan ke klinik. Rundingan dalam talian mungkin menolak atas sebab umur. Klinik pula boleh menerima anda tidak kira umur, cuma sesetengahnya mungkin meminta surat kebenaran penjaga atau meminta penjaga menemani jika anda belum dewasa, jadi telefon dan pastikan dahulu. Dinasihatkan ke tempat lain atau ditolak tidak bermakna anda tidak boleh mendapatkan ubat. Klinik boleh memberi ubat yang sama, dan kadangkala itu lebih cepat."],
  ["Bolehkah orang lain membelikannya?","Bagi setiap cara, ia mesti anda sendiri. Di farmasi anda pergi sendiri dan menelannya di hadapan ahli farmasi. Bagi klinik dan rundingan dalam talian pun, orang yang diperiksa ialah anda. Orang lain tidak boleh mengambilnya bagi pihak anda. Namun, seseorang boleh menemani anda, atau membantu anda membuat panggilan telefon. Jika pergi seorang diri terasa berat, mintalah orang yang anda percayai menemani."],
  ["Bolehkah dihantar ke rumah?","Ada klinik swasta dengan rundingan dalam talian yang menghantar ubat ke rumah. Ia membantu apabila sukar untuk keluar. Sebelum menggunakannya, semak tiga perkara. Pertama, bila ia akan sampai — sempatkah dalam tempoh 72 jam. Kedua, adakah ia ubat yang diluluskan di Jepun. Ulipristal acetate, yang ditawarkan untuk penggunaan dalam 120 jam, tidak diluluskan di Jepun. Ketiga, ubat yang tidak diluluskan tidak dilindungi sistem bantuan negara jika berlaku masalah kesihatan. Perlu diingat, garis panduan negara menyatakan cara mengambilnya di farmasi dan menelannya di hadapan ahli farmasi."],
  ["Bolehkah membelinya dalam talian dari kedai ubat?","Tidak boleh. Untuk membeli di farmasi, anda perlu ke kedai dan berbual secara bersemuka dengan ahli farmasi. Ubat yang diimport sendiri dari luar negara berisiko palsu, dan tidak dilindungi sistem bantuan negara jika berlaku kemudaratan kesihatan."],
  ["Adakah ia menghalang kehamilan 100%?","Malangnya tidak. Kehamilan masih boleh berlaku. Tiga minggu selepas menelannya, sila semak dengan ujian kehamilan atau di fasiliti perubatan."],
  ["Adakah ada kesan sampingan?","Loya, sakit kepala, sakit perut bawah dan pendarahan luar jangka boleh berlaku. Jika anda muntah dalam tempoh 2 jam selepas menelannya, berbincanglah dengan ahli farmasi atau doktor."],
  ["Sudah melebihi 72 jam","Anda tidak boleh membelinya di farmasi, tetapi klinik sakit puan kadangkala boleh membincangkan cara yang boleh digunakan antara 72 hingga 120 jam. Tolong jangan berputus asa, cuba tanya."]
 ],
 aftertitle:"Tentang kesan sampingan",
 afterbody1:"Selepas menelannya anda mungkin rasa loya atau sakit kepala buat sementara, tetapi biasanya ia reda dalam beberapa jam hingga sehari. Jika anda muntah dalam tempoh 2 jam selepas menelannya, ubat mungkin belum diserap, jadi berbincanglah dengan doktor atau ahli farmasi dengan segera.",
 secrett:"Kerahsiaan anda terjaga",
 secretd:"Ahli farmasi dan doktor terikat dengan kewajipan menjaga rahsia. Maklumat tidak akan disampaikan kepada keluarga, sekolah atau tempat kerja anda. Jika mereka mencadangkan agensi sokongan pun, ia dilakukan selepas mendapat persetujuan anda.",
 r3d2:"Pada dasarnya, orang yang akan menelan ubat itu boleh berjumpa doktor dan menerima preskripsi tanpa mengira umur. Namun sesetengah fasiliti mungkin meminta surat kebenaran penjaga atau meminta penjaga menemani jika anda belum dewasa, jadi sila telefon dan pastikan dahulu sebelum pergi.",
 r3meritt:"Kelebihan berjumpa doktor sakit puan",
 r3meritd1:"Ketenangan yang paling besar ialah dapat berjumpa doktor secara bersemuka dan bertanya di situ juga tentang apa sahaja yang merisaukan anda.",
 r3meritd2:"Selain cara menelan ubat dan kesan sampingan, jika mahu anda juga boleh berbincang tentang ujian jangkitan kelamin, pemeriksaan sakit puan, dan kaedah pencegahan kehamilan yang lebih pasti selepas ini (seperti pil perancang atau Mirena IUS).",
 r3meritd3:"Anda tidak perlu ragu sama ada patut pergi untuk hal seperti ini, atau bimbang akan dimarahi. Doktor memeriksa demi menjaga tubuh dan hati anda.",
 r3recot:"Klinik sakit puan disyorkan bagi anda yang",
 r3recod:"Jika mana-mana perkara berikut berkenaan dengan anda, terus berjumpa doktor sakit puan biasanya lebih pasti dan lebih lancar berbanding rundingan dalam talian atau membeli di farmasi.",
 r3reco:[
  ["Sudah melebihi 72 jam selepas hubungan seks","Ada klinik sakit puan yang menyediakan ubat yang masih boleh berkesan sehingga 120 jam (5 hari), bukan ubat biasa di Jepun yang perlu digunakan dalam 72 jam."],
  ["Berumur bawah 16 tahun (contohnya pelajar sekolah menengah rendah)","Rundingan dalam talian atau farmasi mungkin menolak atas sebab umur dan mencadangkan anda ke klinik sakit puan. Jika ada klinik berdekatan rumah, terus pergi bertanya kadangkala lebih cepat. Ia rawatan bayaran sendiri tanpa kad insurans kesihatan, dan jika anda tidak mahu keluarga tahu, perkara itu pun boleh dibincangkan."],
  ["Mengalami hubungan seks tanpa persetujuan atau keganasan seksual","Jika anda dipaksa, atau tidak mampu menolak, itu sama sekali bukan salah anda. Setiap wilayah mempunyai Pusat Sokongan Setempat untuk mangsa jenayah seksual dan keganasan seksual (talian bebas tol seluruh negara #8891). Dengan menelefon ke sana, anda boleh mengetahui tentang sistem yang menjadikan kos ubat percuma (ditanggung dana awam), serta bantuan seperti ditemani ke hospital. Tolong jangan pikul seorang diri, hubungi mereka dahulu."]
 ],
 r1prept:"Persediaan sebelum pergi",
 r1prepd1:"Anda mungkin diminta menunjukkan pengenalan diri seperti kad My Number atau kad insurans kesihatan. Ia tidak diwajibkan, tetapi memastikannya lebih awal membuat anda lebih tenang.",
 r1prepd2:"Semasa membeli, ahli farmasi akan bertanya perkara seperti tarikh dan masa hubungan seks, bila haid terakhir, sejarah alahan, dan ubat yang sedang diambil. Mencatatnya lebih awal memudahkan urusan.",
 r2ways:"Anda boleh mengambilnya di farmasi yang anda tentukan sendiri, atau menerimanya melalui penghantaran ke rumah.",
 r2w1t:"Mengambilnya di farmasi (cara mengikut garis panduan negara)",
 r2w1d:"Selepas rundingan dalam talian, doktor mengeluarkan preskripsi dan anda mengambil ubat di farmasi yang ditetapkan. Di farmasi anda mendengar penerangan ahli farmasi dan menelan ubat di situ juga, di hadapan mereka. Inilah cara asas yang ditetapkan dalam garis panduan Kementerian Kesihatan.",
 r2w2t:"Dihantar ke peti surat rumah (perkhidmatan penghantaran klinik bayaran sendiri)",

var cur = "ja";
function txt(id, s){ var e=document.getElementById(id); if(e) e.textContent=s; }

function buildLangBar(){
  var ul=document.getElementById("langs");
  ul.innerHTML="";
  LANGS.forEach(function(L){
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.type="button";
    b.textContent=L.name;
    b.setAttribute("lang", L.htmlLang);
    b.setAttribute("aria-current", L.code===cur ? "true" : "false");
    b.addEventListener("click", function(){ setLang(L.code, true); });
    li.appendChild(b); ul.appendChild(li);
  });
}

function setLang(code, save){
  cur = T[code] ? code : "ja";
  if(save){
    try{ localStorage.setItem("lang", cur); }catch(e){}
    if(history.replaceState) history.replaceState(null,"","#"+cur);
    else location.hash = cur;
  }
  buildLangBar();
  render();
}

/* 言語の決め方: URLの #xx → 保存された選択 → ブラウザの言語 → 日本語 */
function pickLang(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(T[h]) return h;
  try{ var s=localStorage.getItem("lang"); if(s && T[s]) return s; }catch(e){}
  var navs=(navigator.languages||[navigator.language||""]);
  for(var i=0;i<navs.length;i++){
    var t=(navs[i]||"").toLowerCase();
    if(t.indexOf("ja")===0) return "ja";
    if(t.indexOf("ko")===0) return "ko";
    if(t.indexOf("zh")===0) return "zh";
    if(t.indexOf("vi")===0) return "vi";
    if(t.indexOf("ne")===0) return "ne";
    if(t.indexOf("ms")===0||t.indexOf("id")===0) return "ms";
    if(t.indexOf("en")===0) return "en";
  }
  return "ja";
}

/* ===== カウントダウン ===== */
var LIMIT_H = 72;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tick(){
  var d = T[cur] || T.ja;
  function g(k){ return (d[k]!==undefined) ? d[k] : T.ja[k]; }
  var v = document.getElementById("when").value;
  var num = document.getElementById("cdnum");
  var note = document.getElementById("cdnote");
  var bar = document.getElementById("cdbar");
  var over = document.getElementById("overbox");
  var cap = document.getElementById("t-cdcap");
  ["row1","row2","row3"].forEach(function(id){ document.getElementById(id).className=""; });

  if(!v){
    cap.hidden = true;
    num.innerHTML = "—";
    num.style.fontSize = "38px";
    note.textContent = g("cdempty");
    bar.style.width = "0";
    over.hidden = true;
    return;
  }
  var start = new Date(v).getTime();
  if(isNaN(start)){ cap.hidden = true; num.innerHTML="—"; note.textContent=g("cdempty"); return; }

  var elapsedH = (Date.now()-start)/3600000;
  var leftMs = start + LIMIT_H*3600000 - Date.now();

  var pct = "";
  if(elapsedH < 24){ document.getElementById("row1").className="hit"; pct="95%"; }
  else if(elapsedH < 48){ document.getElementById("row2").className="hit"; pct="85%"; }
  else if(elapsedH <= 72){ document.getElementById("row3").className="hit"; pct="58%"; }

  if(leftMs <= 0){
    cap.hidden = true;
    num.textContent = g("cdover");
    num.style.fontSize = "30px";
    note.textContent = "";
    bar.style.width = "0";
    over.hidden = false;
    return;
  }
  over.hidden = true;
  cap.hidden = false;
  var h = Math.floor(leftMs/3600000);
  var m = Math.floor((leftMs%3600000)/60000);
  var pre = g("cdprefix");
  num.style.fontSize = "52px";
  num.innerHTML = (pre ? esc(pre)+" " : "")
    + h + '<span class="u">' + esc(g("cdh")) + '</span>'
    + m + '<span class="u">' + esc(g("cdm")) + '</span>';
  bar.style.width = Math.max(0, Math.min(100, leftMs/(LIMIT_H*3600000)*100)) + "%";
  note.textContent = pct ? g("cdnow").replace("{p}", pct) : g("cdnote");
}
