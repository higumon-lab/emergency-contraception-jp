<style>
/* ── 配色 ──────────────────────────────────────────────
   マカロンのような淡い色を「面」に使い、文字は濃いすみれ墨で置きます。
   淡い色は文字色には使いません（コントラストが取れないため）。

   透明感は、色のついた背景の上に、半透明の白＋ぼかし（backdrop-filter）
   を重ねて出しています。
   ────────────────────────────────────────────────── */
:root {
  color-scheme: light;
  --wrap-pad: 22px;

  /* マカロンの6色。透明度を調整できるよう rgb 成分でも持たせています。
     rgb(var(--mint-rgb) / 0.8) のように書くと、下の色が透けます。 */
  --mint-rgb: 200 247 227;
  --lavender-rgb: 227 218 255;
  --peach-rgb: 255 220 202;
  --rose-rgb: 255 217 232;
  --butter-rgb: 255 242 196;
  --sky-rgb: 210 232 255;

  --mint: rgb(var(--mint-rgb));
  --lavender: rgb(var(--lavender-rgb));
  --peach: rgb(var(--peach-rgb));
  --rose: rgb(var(--rose-rgb));
  --butter: rgb(var(--butter-rgb));
  --sky: rgb(var(--sky-rgb));

  --paper: #fdfcff;
  --surface: rgba(255, 255, 255, 0.74);
  --surface-solid: #ffffff;
  --surface-soft: rgba(255, 255, 255, 0.5);
  --card: rgba(255, 255, 255, 0.74);

  --ink: #2f2b3a;
  --ink-2: #494357;
  --ink-3: #5d5770;

  --line: rgba(255, 255, 255, 0.9);
  --line-soft: rgba(101, 52, 201, 0.14);
  --line-strong: rgba(101, 52, 201, 0.24);

  --accent: #6534c9;
  --accent-hover: #5228a8;
  --focus: #5228a8;

  --ok: #14663f;
  --mid: #8a3f31;
  --low: #8a4a1c;

  --radius: 20px;
  --radius-small: 14px;
  --shadow: 0 12px 34px rgba(101, 52, 201, 0.1);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  /* 淡い色のにじみを画面に固定して敷き、その上に半透明の白を重ねます。
     これが「透明感」の土台です。 */
  background:
    radial-gradient(60rem 40rem at 12% -8%, var(--mint) 0, transparent 60%),
    radial-gradient(52rem 38rem at 92% 4%, var(--lavender) 0, transparent 62%),
    radial-gradient(48rem 36rem at 78% 42%, var(--peach) 0, transparent 58%),
    radial-gradient(44rem 34rem at 6% 68%, var(--sky) 0, transparent 60%),
    radial-gradient(46rem 34rem at 88% 92%, var(--rose) 0, transparent 60%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink);
  /* 本文は Zen Kaku Gothic New（読みやすい現代的なゴシック）。
     欧文と数字は Outfit で、都会的な印象にしています。
     韓国語・中国語・ネパール語はそれぞれ Noto Sans を当てています。 */
  font-family:
    "Outfit", "Zen Kaku Gothic New", "Noto Sans KR", "Noto Sans SC",
    "Noto Sans Devanagari", system-ui, -apple-system, "Hiragino Sans",
    "Yu Gothic", sans-serif;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.85;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

button,
input {
  font: inherit;
}

button,
a {
  touch-action: manipulation;
}

a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

a:not(.btn) {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
}

/* 帯（全幅）。背景のにじみを透かしつつ、白いすりガラスを重ねます。 */
.band {
  padding-block: clamp(48px, 10vw, 80px);
  background: transparent;
}

.band.tint {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-block: 1px solid rgba(255, 255, 255, 0.75);
}

.band > .inner {
  width: min(100%, 680px);
  margin-inline: auto;
  padding-inline: var(--wrap-pad);
}

/* 冒頭は背景のにじみをそのまま見せます（塗りつぶさない）。 */
.hero h1 {
  color: var(--ink);
}

.hero .lead {
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 400;
  line-height: 2;
}

.hero .label {
  border: 1px solid rgba(255, 255, 255, 0.9);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.75) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 6px 16px rgba(101, 52, 201, 0.1);
  color: var(--accent);
  backdrop-filter: blur(10px) saturate(1.4);
  -webkit-backdrop-filter: blur(10px) saturate(1.4);
}

/* 見出しの左に太いオレンジの縦棒（前身サイトと同じ形） */
h2 {
  position: relative;
  padding-left: 18px;
}

h2::before {
  content: "";
  position: absolute;
  top: 0.18em;
  bottom: 0.18em;
  left: 0;
  display: block;
  width: 5px;
  margin: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, #6534c9 0%, #c02a6a 100%);
}

/* 見出しの上に置く小さなラベル。ピル形のバッジで見せます */
.label {
  display: inline-flex;
  align-items: center;
  margin: 0 0 18px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--lavender);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

/* 見出しは Zen Maru Gothic（丸みのある書体）。
   h1 には紫→マゼンタのグラデーションをかけています。
   両端とも白地で 5.5:1 以上あるので、グラデーションが効かない環境で
   単色になっても読めます。 */
h1,
h2,
h3,
.waytitle,
.blocktitle,
.noteboxtitle,
.faq summary,
.label {
  font-family:
    "Outfit", "Zen Maru Gothic", "Noto Sans KR", "Noto Sans SC",
    "Noto Sans Devanagari", system-ui, sans-serif;
}

h1 {
  max-width: 15em;
  margin: 0 0 22px;
  font-size: clamp(1.7rem, 6.8vw, 2.5rem);
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.01em;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 46%, #c02a6a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 翻訳データの中の改行をそのまま活かします。
   改行を入れていない言語は、これまでどおり自動で折り返します。 */
#t-title,
#t-subtitle {
  white-space: pre-line;
}

/* 見出しの上の余白は帯（.band の padding-block）が持つので、ここでは付けない */
h2 {
  margin: 0 0 22px;
  color: var(--ink);
  font-size: clamp(1.2rem, 4.8vw, 1.4rem);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

h3 {
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
}

p {
  margin: 0 0 14px;
}

small {
  display: block;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.75;
}

.lead {
  max-width: 42em;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.95;
}

.langbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.langbar ul {
  display: flex;
  flex-wrap: wrap;            /* 7言語すべてを画面内に表示する（横スクロールにしない） */
  justify-content: center;
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 0;
  gap: 4px;
  list-style: none;
}

.langbar li {
  flex: 0 0 auto;
}

.langbar button {
  min-width: 48px;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.langbar button:hover {
  background: var(--lavender);
  color: var(--accent);
}

.langbar button[aria-current="true"] {
  border-color: transparent;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(101, 52, 201, 0.26);
}

.tophint {
  margin: 0;
  padding: 11px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.7);
  background: rgba(255, 255, 255, 0.5);
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.6;
  text-align: center;
}

/* オレンジの面をしっかり見せたいので、上下の余白を大きくとる */
.hero {
  padding-block: clamp(52px, 12vw, 96px) clamp(52px, 12vw, 88px);
}

/* カウントダウンは帯そのものが青の面になるため、ここでは箱を持たない */
.focal {
  margin: 0;
}

.focal label {
  display: block;
  margin-bottom: 12px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
}

.focal input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}

.focal input:focus {
  border-color: var(--accent);
  outline: 3px solid rgba(36, 79, 94, 0.22);
  outline-offset: 2px;
}

/* カウントダウンの上に置く小さなラベル。
   残り時間が出ているときだけ表示します（未入力・72時間超のときは隠す）。 */
.cdcap {
  margin: 24px 0 0;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
  letter-spacing: 0.04em;
}

.cdcap + .cdnum {
  margin-top: 2px;
}

.cdnum {
  margin: 24px 0 0;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: "Outfit", system-ui, sans-serif;
  font-size: clamp(2.6rem, 13vw, 4.2rem);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.03em;
  word-break: normal;
}

.cdnum .u {
  display: inline-block;
  margin: 4px 6px 0;
  color: var(--ink-2);
  -webkit-text-fill-color: var(--ink-2);
  font-family: "Zen Maru Gothic", "Outfit", system-ui, sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
}

.bar {
  position: relative;
  height: 6px;
  margin: 22px 0 14px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.7);
}

.bar i {
  position: absolute;
  inset: 0 auto 0 0;
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6534c9 0%, #c02a6a 100%);
  transition: width 0.4s ease;
}

.cdnote {
  margin: 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.75;
}

table.eff {
  width: 100%;
  margin: 0 0 12px;
  border-spacing: 0 7px;
  border-collapse: separate;
  table-layout: fixed;
  font-size: 15px;
}

table.eff th {
  padding: 0 10px 7px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-align: left;
  text-transform: uppercase;
}

table.eff th:last-child {
  text-align: right;
}

table.eff td {
  padding: 15px 12px;
  border-block: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

table.eff td:first-child {
  border-left: 1px solid var(--line);
  border-radius: var(--radius-small) 0 0 var(--radius-small);
}

table.eff td:last-child {
  border-right: 1px solid var(--line);
  border-radius: 0 var(--radius-small) var(--radius-small) 0;
  color: var(--ink);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  text-align: right;
}

table.eff tr.hit td {
  border-color: rgba(101, 52, 201, 0.3);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.7) 0%, rgb(var(--lavender-rgb) / 0.92) 100%);
  color: var(--ink);
}

/* 詳細度を table.eff tr.hit td と同じ (0,2,3) に上げ、記述順で勝たせる。
   これがないと 95%/85%/58% の色分けが打ち消されます。 */
table.eff tr td.v1 {
  color: var(--ok);
}

table.eff tr td.v2 {
  color: var(--mid);
}

table.eff tr td.v3 {
  color: var(--low);
}

/* 経路は前身サイトと同じくカードで見せる（白・角丸8px・細い枠・浅い影） */
.routes {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.route {
  min-width: 0;
  padding: clamp(22px, 6vw, 30px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

/* 01 / 02 / 03 は経路の目印なので、はっきり見えるようにしています */
.route .no {
  display: block;
  margin-bottom: 10px;
  color: var(--accent);
  background: linear-gradient(100deg, #6534c9 0%, #b02a86 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: "Outfit", system-ui, sans-serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.route .hd {
  display: flex;
  min-width: 0;
  margin-bottom: 11px;
  gap: 8px 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.route .hd > * {
  min-width: 0;
}

.route .price {
  margin-left: auto;
  color: var(--ink-2);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.route p {
  margin: 0 0 19px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
}

.route .tag {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  margin: 0 0 14px;
  padding: 7px 14px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.85) 0%, rgb(var(--lavender-rgb) / 0.85) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

.btn {
  display: flex;
  width: 100%;
  min-height: 54px;
  padding: 14px 20px;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  border: 1px solid transparent;
  border-radius: 999px;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(101, 52, 201, 0.28);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  text-decoration: none;
  overflow-wrap: anywhere;
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.btn:hover {
  box-shadow: 0 12px 28px rgba(101, 52, 201, 0.36);
  transform: translateY(-1px);
}

.btn:hover,
.btn:focus {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.btn::after {
  content: "→";
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1;
}

.btn.sub {
  border-color: rgba(101, 52, 201, 0.4);
  background: rgba(255, 255, 255, 0.7);
  color: var(--accent);
  box-shadow: none;
}

.btn.sub:hover,
.btn.sub:focus {
  border-color: transparent;
  background: linear-gradient(100deg, #6534c9 0%, #8a2fb0 100%);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(101, 52, 201, 0.28);
}

.btn + .btn {
  margin-top: 10px;
}

.know {
  border-top: 1px solid var(--line);
}

.know .item {
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}

.know .item p {
  margin: 8px 0 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 帯の中の囲み。相談窓口は白地の箱、72時間超のお知らせは線で強調する。 */
.callout {
  padding: clamp(24px, 6vw, 32px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

.callout.alert {
  border-color: var(--accent);
  border-left-width: 4px;
  background: var(--lavender);
}

.callout p {
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

.callout .btn.sub {
  border-color: var(--accent);
  background: var(--surface);
  color: var(--accent);
}

.callout .btn.sub:hover,
.callout .btn.sub:focus {
  background: var(--accent);
  color: #ffffff;
}

/* オンライン診療カードの中の「受け取り方2つ」と注意書き */
.ways {
  display: grid;
  margin: 0 0 18px;
  gap: 12px;
}

/* 淡い色の面は、べた塗りではなく「色つきのガラス」にしています。
   上から白い光が当たったように見せるため、
   斜めのグラデーション＋内側の白いハイライト＋下に落ちる影を重ねています。 */
.way {
  --tint: var(--mint-rgb);
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--tint) / 0.88) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.ways .way:nth-child(2) {
  --tint: var(--sky-rgb);
}

.ways .way:nth-child(3) {
  --tint: var(--butter-rgb);
}

.waytitle {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

/* カードの中で、囲みを単体で置くときの余白 */
.route > .way {
  margin: 0 0 18px;
}

/* 帯の中に直接置く囲み */
.inner > .way {
  margin-top: 22px;
}

/* 【〜】のような小見出し */
.blocktitle {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

.way p:last-child,
.notebox p:last-child {
  margin: 0;
}

.notebox {
  margin: 0 0 18px;
  padding: 20px 22px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-small);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.72) 0%, rgb(var(--rose-rgb) / 0.9) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 8px 20px rgba(101, 52, 201, 0.08);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
}

.noteboxtitle {
  margin: 0 0 8px;
  color: var(--accent);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

/* ===== ここから、前身サイトにあった4つの内容を作り直したもの ===== */

/* 購入の流れ: 経路ごとの手順を番号つきで分解して見せる */
.steps {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.stepgroup {
  padding: clamp(22px, 6vw, 30px);
  border: 1px solid rgba(255, 255, 255, 0.95);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.8);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}

.stepgroup h3 {
  margin-bottom: 16px;
}

.stepgroup ol {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: step;
}

.stepgroup li {
  position: relative;
  padding: 0 0 18px 40px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
  counter-increment: step;
}

/* 手順どうしを縦線でつなぐ（最後の1つには引かない） */
.stepgroup li::before {
  content: counter(step);
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  width: 26px;
  height: 26px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stepgroup li::after {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 4px;
  left: 13px;
  width: 1px;
  background: var(--line);
}

.stepgroup li:last-child {
  padding-bottom: 0;
}

.stepgroup li:last-child::after {
  display: none;
}

/* 服用前チェック: 「してはいけない」と「相談して」の2群 */
.checkgroup + .checkgroup {
  margin-top: 26px;
}

.checkgroup h3 {
  margin-bottom: 6px;
}

.checkgroup > p {
  margin: 0 0 14px;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1.75;
}

.checklist {
  margin: 0;
  padding: 0;
  list-style: none;
}

.checklist li {
  position: relative;
  padding: 13px 0 13px 32px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.75;
}

.checklist li::before {
  position: absolute;
  top: 13px;
  left: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.75;
}

.checklist.no li::before {
  content: "\00d7";
  color: var(--accent);
}

.checklist.ask li::before {
  content: "!";
  color: var(--ink-3);
}

/* 授乳中は「飲めない」ではなく「気をつけてほしい」ことなので、
   × ではなく落ち着いた印にしています。 */
.checklist.note li::before {
  content: "!";
  top: 15px;
  display: flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgb(var(--lavender-rgb) / 0.9) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color: var(--accent);
  font-size: 12px;
  line-height: 1;
}

/* よくある質問 */
.faq {
  margin-top: 26px;
  border-top: 1px solid var(--line);
}

.faq details {
  border-bottom: 1px solid var(--line);
}

.faq summary {
  display: flex;
  min-height: 56px;
  padding: 16px 32px 16px 0;
  gap: 12px;
  align-items: center;
  color: var(--ink);
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: "+";
  position: absolute;
  right: 0;
  color: var(--accent);
  font-size: 20px;
  font-weight: 700;
}

.faq details[open] summary::after {
  content: "\2212";
}

.faq details {
  position: relative;
}

.faq .answer {
  margin: 0;
  padding: 0 0 20px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 製品情報の表 */
table.spec {
  width: 100%;
  margin-top: 26px;
  border-collapse: collapse;
  font-size: 15px;
}

table.spec th,
table.spec td {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  line-height: 1.7;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

table.spec th {
  width: 38%;
  padding-right: 14px;
  color: var(--ink-3);
  font-size: 14px;
  font-weight: 700;
}

table.spec td {
  color: var(--ink-2);
}

footer {
  padding-top: 4px;
}

footer h3 {
  margin-bottom: 14px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

footer p {
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.85;
}

.exitbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 9px 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.75);
  background: rgba(255, 255, 255, 0.72);
  text-align: right;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.exitbtn {
  min-height: 48px;
  padding: 10px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
}

.exitbtn:hover {
  border-color: var(--accent);
  background: var(--lavender);
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 420px) {
  :root {
    --wrap-pad: 16px;
  }

  .langbar {
    padding-inline: 8px;
  }

  .route .price {
    width: 100%;
    margin-left: 0;
  }

  table.eff {
    font-size: 14px;
  }

  table.eff th,
  table.eff td {
    padding-inline: 8px;
  }
}

@media (prefers-color-scheme: dark) {
  /* ダークでも、淡い色のにじみは残します。面を暗くして文字を明るくします。 */
  :root {
    color-scheme: dark;
    --mint-rgb: 29 59 49;
    --lavender-rgb: 47 39 70;
    --peach-rgb: 61 43 38;
    --rose-rgb: 58 36 48;
    --butter-rgb: 58 51 32;
    --sky-rgb: 31 50 66;

    --paper: #141119;
    --surface: rgba(40, 35, 50, 0.66);
    --surface-solid: #241f2e;
    --surface-soft: rgba(40, 35, 50, 0.45);
    --card: rgba(42, 37, 53, 0.7);

    --ink: #f2eff7;
    --ink-2: #cec8da;
    --ink-3: #ada6bc;

    --line: rgba(255, 255, 255, 0.12);
    --line-soft: rgba(255, 255, 255, 0.14);
    --line-strong: rgba(255, 255, 255, 0.24);

    --accent: #c4b1ee;
    --accent-hover: #d8cbf5;
    --focus: #c4b1ee;

    --ok: #7fd0a6;
    --mid: #f0a396;
    --low: #eeae79;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  .band.tint {
    background: rgba(255, 255, 255, 0.05);
    border-block-color: rgba(255, 255, 255, 0.09);
  }

  .tophint {
    background: rgba(255, 255, 255, 0.05);
    border-bottom-color: rgba(255, 255, 255, 0.09);
  }

  .hero .label {
    background: rgba(255, 255, 255, 0.1);
    color: var(--accent);
  }

  .bar {
    background: rgba(255, 255, 255, 0.14);
  }

  /* 暗い地では、見出しと数字のグラデーションを明るい側に振り替えます。
     そのままだと濃い紫が背景に沈んで読めなくなるためです。 */
  h1 {
    background: linear-gradient(100deg, #c4a8ff 0%, #e6a6ff 46%, #ff9ec4 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .cdnum {
    background: linear-gradient(100deg, #c4a8ff 0%, #ff9ec4 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .route .no {
    background: linear-gradient(100deg, #c4a8ff 0%, #ff9ec4 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  h2::before {
    background: linear-gradient(180deg, #c4a8ff 0%, #ff9ec4 100%);
  }

  .bar i {
    background: linear-gradient(90deg, #c4a8ff 0%, #ff9ec4 100%);
  }

  .btn {
    background: linear-gradient(100deg, #c4a8ff 0%, #e6a6ff 100%);
    box-shadow: none;
  }

  .btn.sub {
    background: rgba(255, 255, 255, 0.06);
  }

  /* ライト用に白で書いたガラスの塗りを、暗い地の値に置き換えます。
     ここを忘れるとカードが白いままになり、明るい文字が読めなくなります。 */
  .route,
  .stepgroup,
  .callout {
    border-color: rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.06);
  }

  .way,
  .notebox {
    border-color: rgba(255, 255, 255, 0.1);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgb(var(--tint, var(--lavender-rgb)) / 0.9) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 8px 20px rgba(0, 0, 0, 0.25);
  }

  .notebox {
    --tint: var(--rose-rgb);
  }

  .hero .label,
  .route .tag,
  .stepgroup li::before,
  .checklist.note li::before {
    border-color: rgba(255, 255, 255, 0.12);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.1) 0%, rgb(var(--lavender-rgb) / 0.95) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    color: var(--accent);
  }

  table.eff tr.hit td {
    border-color: rgba(196, 168, 255, 0.4);
    background:
      linear-gradient(150deg, rgba(255, 255, 255, 0.06) 0%, rgb(var(--lavender-rgb) / 0.95) 100%);
  }

  .langbar,
  .exitbar {
    background: rgba(20, 17, 25, 0.72);
    border-color: rgba(255, 255, 255, 0.09);
  }

  .langbar button[aria-current="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: #241a3a;
  }


  table.eff tr.hit td {
    border-color: #7a4a2c;
    background: var(--lavender);
  }

  .label,
  .route .tag,
  .stepgroup li::before {
    background: var(--lavender);
    color: var(--accent);
  }

  .callout.alert {
    border-color: var(--accent);
    background: var(--lavender);
  }

  .checklist.no li::before {
    color: var(--accent);
  }

  .faq summary::after {
    color: var(--accent);
  }

  /* ここで table.eff tr.hit td の color を指定すると、詳細度 (0,2,3) が同じで
     記述順が後になるため、95%/85%/58% の色分け (.v1/.v2/.v3) を打ち消してしまう。
     背景は変数で切り替わるので、色の指定は置かない。 */
  table.eff tr.hit td {
    border-color: #6f95a3;
  }

  .route .tag {
    border-color: var(--line-soft);
    background: var(--surface);
    color: var(--accent);
  }

  .btn {
    border-color: var(--accent);
    background: var(--accent);
    color: #241a3a;
  }

  .btn:hover,
  .btn:focus {
    border-color: var(--accent-hover);
    background: var(--accent-hover);
    color: #241a3a;
  }

  .btn.sub {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn.sub:hover,
  .btn.sub:focus {
    background: var(--accent);
    color: #241a3a;
  }

  .callout p {
    color: var(--ink-2);
  }

  .callout .btn.sub {
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.12);
    color: var(--accent);
  }

  .callout .btn.sub:hover,
  .callout .btn.sub:focus {
    background: var(--accent);
    color: #1a0f08;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<nav class="langbar" aria-label="Language / 言語">
  <ul id="langs"></ul>
</nav>

<p class="tophint" id="tophint"></p>

<!-- ページは「帯（band）」を縦に積んで構成します。
     .band が画面いっぱいの背景色を持ち、中身は .inner で読みやすい幅に絞ります。
     .band.tint が淡い青の帯です。白と交互に並べてリズムを作っています。 -->

<header class="band hero">
  <div class="inner">
    <p class="label" id="t-eyebrow"></p>
    <h1 id="t-title"></h1>
    <p class="lead" id="t-subtitle"></p>
  </div>
</header>

<!-- ===== カウントダウン ===== -->
<section class="band tint" aria-labelledby="t-cdlabel">
  <div class="inner focal">
    <label for="when" id="t-cdlabel"></label>
    <input type="datetime-local" id="when">
    <p class="cdcap" id="t-cdcap" hidden></p>
    <p class="cdnum" id="cdnum"></p>
    <div class="bar" aria-hidden="true"><i id="cdbar"></i></div>
    <p class="cdnote" id="cdnote"></p>
  </div>
</section>

<!-- 72時間を過ぎたときだけ JavaScript が表示します（hidden を外します）。
     id は帯そのものに付けます。中の箱に付けると、非表示時に空の帯が残ります。 -->
<section class="band" id="overbox" hidden>
  <div class="inner">
    <div class="callout alert">
      <h3 id="t-overtitle"></h3>
      <p id="t-overtext" style="margin-top:8px"></p>
      <a class="btn" id="t-overbtn" rel="noopener noreferrer" target="_blank"
         href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000186912_00002.html"></a>
    </div>
  </div>
</section>

<!-- ===== 効果 ===== -->
<section class="band">
  <div class="inner">
    <h2 id="t-efftitle"></h2>
    <table class="eff">
      <thead><tr><th id="t-effh1"></th><th id="t-effh2"></th></tr></thead>
      <tbody>
        <!-- この3つの <tr> にクラスを足さないでください。
             JavaScript が className を丸ごと書き換えて該当行を示すため、消えます。 -->
        <tr id="row1"><td id="t-eff1"></td><td class="v1">95%</td></tr>
        <tr id="row2"><td id="t-eff2"></td><td class="v2">85%</td></tr>
        <tr id="row3"><td id="t-eff3"></td><td class="v3">58%</td></tr>
      </tbody>
    </table>
    <small id="t-effsrc"></small>
  </div>
</section>

<!-- ===== 3つの経路 =====
     表示順: 1 産婦人科 → 2 薬局 → 3 オンライン診療
     翻訳キーは r1=薬局 / r2=オンライン診療 / r3=産婦人科 のままです。
     順番を変えたいときは、下の3つの <div class="route"> ブロックごと入れ替えてください。 -->
<section class="band tint">
  <div class="inner">
    <h2 id="t-routestitle"></h2>
    <p class="lead" id="t-routeshint"></p>

    <div class="routes">
      <!-- 3つとも同じ見た目にしています。01を目立たせると、産婦人科が
           「特別な事情がある人だけが行くところ」に見えてしまうためです。 -->
      <div class="route">
        <span class="no">01</span>
        <div class="hd"><h3 id="t-r3n"></h3><span class="price" id="t-r3p"></span></div>
        <p id="t-r3d"></p>
        <p id="t-r3d2"></p>
        <div class="way">
          <p class="waytitle" id="t-r3meritt"></p>
          <p id="t-r3meritd1"></p>
          <p id="t-r3meritd2"></p>
          <p id="t-r3meritd3"></p>
        </div>
        <p class="blocktitle" id="t-r3recot"></p>
        <p id="t-r3recod"></p>
        <!-- 中身は JavaScript が [見出し, 本文] の配列から作ります -->
        <div class="ways" id="r3reco"></div>
        <a class="btn" id="t-r3b" rel="noopener noreferrer" target="_blank"
           href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000186912_00002.html"></a>
      </div>

      <div class="route">
        <span class="no">02</span>
        <div class="hd"><h3 id="t-r1n"></h3><span class="price" id="t-r1p"></span></div>
        <p id="t-r1d"></p>
        <p class="blocktitle" id="t-r1pointst"></p>
        <div class="ways" id="r1points"></div>
        <div class="notebox">
          <p class="noteboxtitle" id="t-r1prept"></p>
          <p id="t-r1prepd1"></p>
          <p id="t-r1prepd2"></p>
        </div>
        <a class="btn sub" id="t-r1b" rel="noopener noreferrer" target="_blank"
           href="https://www.mhlw.go.jp/stf/kinnkyuuhininnyaku_00005.html"></a>
      </div>

      <div class="route">
        <span class="no">03</span>
        <div class="hd"><h3 id="t-r2n"></h3><span class="price" id="t-r2p"></span></div>
        <p id="t-r2d"></p>
        <p id="t-r2ways"></p>
        <div class="ways">
          <div class="way">
            <p class="waytitle" id="t-r2w1t"></p>
            <p id="t-r2w1d"></p>
          </div>
          <div class="way">
            <p class="waytitle" id="t-r2w2t"></p>
            <p id="t-r2w2d"></p>
          </div>
        </div>
        <div class="notebox">
          <p class="noteboxtitle" id="t-r2cautiont"></p>
          <p id="t-r2cautiond"></p>
        </div>
        <a class="btn sub" id="t-r2b" rel="noopener noreferrer" target="_blank"
           href="https://www.mhlw.go.jp/stf/kinnkyuuhininnyaku_00004.html"></a>
      </div>
    </div>
  </div>
</section>

<!-- ===== 購入の流れ =====
     3経路それぞれの手順。中身は JavaScript が生成します（翻訳キー steps）。 -->
<section class="band">
  <div class="inner">
    <h2 id="t-stepstitle"></h2>
    <p class="lead" id="t-stepshint"></p>
    <div class="steps" id="stepslist"></div>
  </div>

  ["100%妊娠を防げますか","残念ながら、100%ではありません。飲んでも妊娠することがあります。飲んでから3週間後に、妊娠検査薬か医療機関で確かめてください。"],
  ["副作用はありますか","吐き気、頭痛、下腹部の痛み、不正出血などが起こることがあります。飲んで2時間以内に吐いてしまったときは、薬剤師か医師に相談してください。"],
  ["72時間を過ぎてしまいました","薬局では買えませんが、産婦人科では72時間から120時間の間に使える方法を相談できることがあります。どうかあきらめずに、相談してみてください。"]

en:{
 cdcap:"Time left to take it",
 acheckt:"Checking afterwards",
 acheck1:"When the medicine has worked, withdrawal bleeding almost always occurs within three weeks of taking it. Withdrawal bleeding is when the female hormones raised by the emergency contraceptive fall again, the lining of the womb comes away, and you bleed just as you would in a period.",
 acheck2:"However, unexpected bleeding can also occur as a side effect after taking it. To be sure that pregnancy has been prevented, take a pregnancy test three weeks after taking the medicine, or see a clinic.",
 acheck3:"Even if the pregnancy test is negative, if your period still does not come after that, please be sure to see a clinic.",
 stepstitle:"Step by step",
 stepshint:"Here is what actually happens with each option.",
 steps:[
  ["Visit a clinic",[
   "Look for a clinic close to your home, school or workplace that can see you as soon as possible.",
   "Call and say you would like to be seen about emergency contraception, and ask whether they can see you.",
   "Go in. You will be asked in detail about the date of your last period and the date and time of the sex you are worried about, so check these beforehand so you can answer straight away.",
   "After the examination the medicine is prescribed. You will often take it there, though this varies by clinic.",
   "Pay. Health insurance does not cover this. If you experienced sexual violence the cost may be covered by public funds, so please feel free to mention it."
  ]],
  ["Buy at a pharmacy",[
   "Use the health ministry list to find a pharmacy that stocks emergency contraception. Not every pharmacy has it.",
   "Call before you go, to check it is in stock and that a pharmacist is available. The person who will take the medicine makes the call (someone may help you dial).",
   "The person who will take the medicine goes in. Nobody can collect it on your behalf.",
   "You talk with the pharmacist somewhere private. You only need to answer what you are asked.",
   "You take one tablet in front of the pharmacist. You cannot take it home.",
   "Pay. You pay the full cost yourself. Some pharmacies do not accept cards, so cash is safest."
  ]],
  ["Have an online consultation",[
   "Find a clinic that offers this and book. A first visit is fine.",
   "See the doctor on your phone or computer.",
   "Decide how to receive the medicine. If you collect it at a pharmacy, choose one you can get to. If it is posted, always check when it will arrive.",
   "If you collect it at a pharmacy you take it in front of the pharmacist. If it is posted, take it as soon as it arrives.",
   "Pay for the consultation and the medicine."
  ]]
 ],

 spectitle:"About the medicine",
 spechint:"Two emergency contraceptives are sold at pharmacies in Japan. The ingredient and the dose are the same.",
 spec:[
  ["Product names","NorLevo / Resoel 72"],
  ["Ingredient (per tablet)","Levonorgestrel 1.5mg (the same in both)"],
  ["Category","Designated pharmacist-guidance medicine"],
  ["Price (incl. tax, suggested)","NorLevo 7,480 yen / Resoel 72 6,930 yen"],
  ["How to take it","One tablet within 72 hours of sex, in front of a pharmacist"],
  ["How it works","It delays ovulation and makes pregnancy less likely"],
  ["Health insurance","Not covered (you pay in full)"]
 ],
 specnote:"Prices are suggested retail prices and may differ by pharmacy. Sources: Ministry of Health, Labour and Welfare; Japan Pharmaceutical Association; package inserts.",
 faqtitle:"Common questions",
 faq:[
  ["Do I need ID?","It is not a rule that you must have one. Still, you may be asked to show it, for example to confirm your age. It is reassuring to bring one if you have it. If you do not, just ask when you are there."],
  ["Will my parents find out?","Whatever your age, you do not need a parent's consent. The pharmacy will not contact your home."],
  ["Can I buy it if I am under 16?","There is no age limit. At a pharmacy you may be advised to see a clinic instead. That is not a refusal — you can get the same medicine at a hospital. Sometimes going straight to a clinic is faster."],
  ["Can someone buy it for me?","Unfortunately not. The person who will take the medicine has to go, and take it in front of the pharmacist."],
  ["Can it be posted to me?","Some private online clinics do post the medicine to your home. It helps when going out is hard. Please check three things first. When will it actually arrive — will it be within the 72 hours? Is it approved in Japan? Ulipristal acetate, offered for use within 120 hours, is not approved in Japan. And a medicine that is not approved is not covered by the national relief system if it harms your health. Note that the national guideline describes collecting it at a pharmacy and taking it there."],
  ["Can I order it from an online drugstore?","No. To buy it at a pharmacy you have to go in and speak with a pharmacist. Medicines imported privately from overseas may be counterfeit, and are not covered by the national relief system if harm occurs."],
  ["Does it prevent pregnancy 100%?","Sadly not. Pregnancy can still happen. Three weeks after taking it, check with a pregnancy test or at a medical facility."],
  ["Are there side effects?","Nausea, headache, lower abdominal pain and unexpected bleeding can occur. If you vomit within two hours of taking it, talk to a pharmacist or doctor."],
  ["I am past 72 hours","You cannot buy it at a pharmacy, but a clinic may be able to discuss options that work between 72 and 120 hours. Please do not give up — go and ask."]
 ],
 aftertitle:"About side effects",
 afterbody1:"Afterwards you may feel sick or have a headache for a while, but this usually settles within a few hours to a day. If you vomit within two hours of taking it, the medicine may not have been absorbed, so please talk to a doctor or pharmacist right away.",
 secrett:"Your privacy is protected",
 secretd:"Pharmacists and doctors are bound by confidentiality. Nothing is passed on to your family, your school or your workplace. If they suggest a support service, they will ask for your agreement first.",
 r3d2:"As a rule, anyone who will take the medicine can be seen and receive a prescription, whatever their age. Some clinics may ask a minor for a parent's consent form or for a parent to come along, so please call ahead and check before you go.",
 r3meritt:"Why a clinic can help",
 r3meritd1:"The greatest reassurance is meeting a doctor face to face and asking about anything that worries you, right there.",
 r3meritd2:"Beyond how to take the medicine and its side effects, you can also ask about testing for sexually transmitted infections, a gynaecological check, and reliable contraception from now on, such as the pill or the Mirena IUS.",
 r3meritd3:"You do not need to wonder whether this is worth going in for, or whether you will be told off. Doctors are there to look after your body and your mind.",
 r3recot:"A clinic is a good choice if",
 r3recod:"If any of these apply to you, going straight to a clinic tends to be more certain and smoother than an online consultation or a pharmacy.",
 r3reco:[
  ["More than 72 hours have passed","Some clinics carry a medicine that can still work up to 120 hours (5 days), rather than the usual one that has to be taken within 72 hours."],
  ["You are under 16 (at junior high, for example)","Online services and pharmacies may decline because of your age and suggest a clinic. If there is a clinic near you, going to ask directly can be faster. It is paid privately, without your health insurance card, and if you would rather your family did not know, you can talk about that too."],
  ["You did not consent, or you experienced sexual violence","If you were forced, or could not say no, it is never your fault. Every prefecture has a one-stop support centre for victims of sexual crime and violence (national freephone #8891). They can tell you about public funding that makes the medicine free, and can go with you to hospital. Please do not carry this alone."]
 ],
 r1pointst:"Three things to know",
 r1points:[
  ["1. Find a pharmacy that stocks it, in advance","Not every pharmacy carries it. Look for a pharmacy on the health ministry list, and before you go, call to check that it is in stock and that a pharmacist is there to help you now."],
  ["2. Go yourself (nobody else can)","The person who will take the medicine has to go. A partner, a parent or anyone else cannot buy it for you."],
  ["3. Take it in front of the pharmacist","You cannot take the medicine home. So that it is taken safely and as soon as possible, you take it in a private area of the pharmacy, in front of the pharmacist."]
 ],
 r1prept:"Before you go",
 r1prepd1:"You may be asked to show ID such as a My Number card or a health insurance card. It is not required, but it is reassuring to check beforehand.",
 r1prepd2:"The pharmacist will ask things like when you had sex, when your last period was, any allergies, and any medicines you take. A quick note to yourself makes it go smoothly.",
 r2ways:"You can either collect it at a pharmacy you choose, or have it posted to your home.",
 r2w1t:"Collect it at a pharmacy (the national guideline)",
 r2w1d:"After the online consultation the doctor issues a prescription and you collect the medicine at the pharmacy you chose. The pharmacist explains it, and you take it there, in front of them. This is the standard route set out in the health ministry guideline.",
 r2w2t:"Have it posted to your home (private clinics)",
 r2w2d:"Some private clinics send the medicine itself to your home, by post or courier, after the consultation. It really helps when you cannot go out, or when no pharmacy near you is open. It can arrive the same day or the next day.",
 r2cautiont:"Before using a postal service",
 r2cautiond:"Posting is convenient, but there are a few things to watch. Emergency contraception should be taken as soon as possible, within 72 hours of sex (or 120 hours with some medicines). With post there is a risk it arrives too late. Always check when it will actually reach you — the arrival date, not the dispatch date. And never use overseas private import sites: delivery is slow and counterfeits are a real risk. Always choose a service where you are seen by a doctor in Japan.",
 pageTitle:"How to get emergency contraception in Japan | 7 languages",

 specnote:"가격은 희망 소매가이며 약국에 따라 다를 수 있습니다. 출처: 후생노동성, 일본약제사회, 각 제품 첨부문서.",
 faqtitle:"자주 있는 질문",
 faq:[
  ["신분증이 필요한가요","반드시 필요하다고 정해져 있지는 않습니다. 다만 나이 등을 확인하기 위해 보여 달라는 경우는 있습니다. 있다면 가져가면 안심입니다. 없더라도 우선 그 자리에서 상담해 보세요."],
  ["부모님께 알려지나요","나이와 관계없이 부모의 동의는 필요 없습니다. 약국에서 집으로 연락이 가는 일도 없습니다."],
  ["16세 미만도 살 수 있나요","나이 제한은 없습니다. 다만 약국에서는 산부인과를 권유받는 경우가 있습니다. 거절당한 것이 아니라 병원에서도 같은 약을 받을 수 있습니다. 처음부터 산부인과에 가는 편이 빠른 경우도 있습니다."],
  ["대신 사다 줄 수 있나요","아쉽지만 불가능합니다. 약을 복용할 본인이 가서 약사 앞에서 복용하도록 정해져 있습니다."],
  ["집으로 배송받을 수 있나요","온라인 진료를 하는 자비 진료 클리닉 중에는 약을 집으로 배송하는 곳이 있습니다. 외출이 어려울 때 도움이 됩니다. 이용 전에 세 가지만 확인하세요. 첫째, 언제 도착하는지. 72시간 기한에 맞출 수 있는지가 중요합니다. 둘째, 일본에서 승인된 약인지. 120시간용으로 안내되는 울리프리스탈 아세테이트는 일본에서 승인되지 않았습니다. 셋째, 승인되지 않은 약은 만일 몸에 이상이 생겨도 국가 구제 제도의 대상이 되지 않습니다. 참고로 국가 지침에서는 약국에서 받아 약사 앞에서 복용하는 방법을 제시하고 있습니다."],
  ["드러그스토어 온라인몰에서 살 수 있나요","살 수 없습니다. 약국에서 사는 경우에는 매장에 가서 약사와 대면으로 이야기해야 합니다. 해외에서 개인 수입한 약은 가짜일 우려가 있고, 건강 피해가 생겨도 국가 구제 제도의 대상이 되지 않습니다."],
  ["100% 임신을 막을 수 있나요","아쉽지만 100%는 아닙니다. 복용해도 임신하는 경우가 있습니다. 복용 후 3주 뒤에 임신테스트기나 의료기관에서 확인하세요."],
  ["부작용이 있나요","메스꺼움, 두통, 아랫배 통증, 부정출혈 등이 나타날 수 있습니다. 복용 후 2시간 이내에 토한 경우에는 약사나 의사에게 상담하세요."],
  ["72시간이 지나 버렸어요","약국에서는 살 수 없지만, 산부인과에서는 72시간에서 120시간 사이에 쓸 수 있는 방법을 상담할 수 있는 경우가 있습니다. 부디 포기하지 말고 상담해 보세요."]

 aftertitle:"부작용에 대하여",
 afterbody1:"약을 복용한 뒤에는 일시적으로 메스꺼움이나 두통이 있을 수 있지만, 몇 시간에서 하루 정도면 가라앉는 경우가 많습니다. 만약 복용 후 2시간 이내에 토했다면 약이 흡수되지 않았을 가능성이 있으니 바로 의사나 약사에게 상담하세요.",

 secretd:"약사와 의사에게는 비밀유지 의무가 있습니다. 가족이나 학교, 직장에 전해지는 일은 없습니다. 상담 기관을 소개하는 경우에도 본인의 동의를 받은 뒤에 이루어집니다.",

 r3meritd1:"가장 큰 안심은 의사를 직접 만나 불안한 점을 그 자리에서 상담할 수 있다는 것입니다.",
 r3meritd2:"약 복용법이나 부작용뿐 아니라, 원한다면 성매개감염 검사나 부인과 검진, 앞으로의 확실한 피임 방법(경구피임약이나 미레나 등)에 대해서도 함께 상담할 수 있습니다.",
 r3meritd3:"이런 일로 가도 되나, 혼나지 않을까 하고 망설이지 않아도 괜찮습니다. 의사는 당신의 몸과 마음을 지키기 위해 진료합니다.",
 r3recot:"이런 분께는 산부인과를 권합니다",
 r3recod:"다음에 해당하는 분은 온라인 진료나 약국 구입보다, 산부인과를 직접 찾는 편이 더 확실하고 순조롭게 대응받을 수 있습니다.",
 r3reco:[
  ["성관계로부터 72시간이 지난 분","국내에서 일반적인 응급피임약(72시간 이내에 사용하는 약)이 아니라, 120시간(5일) 이내까지 효과를 기대할 수 있는 약을 취급하는 산부인과도 있습니다."],
  ["16세 미만(중학생 등)인 분","온라인 진료나 약국에서는 나이를 이유로 대응을 거절당하고 산부인과 진료를 권유받는 경우가 있습니다. 집 근처에 진료받을 수 있는 산부인과가 있다면 직접 상담하러 가는 편이 빠른 경우도 있습니다. 건강보험증을 쓰지 않는 자비 진료이지만, 가족에게 알리고 싶지 않은 등의 바람이 있다면 그것도 함께 상담해 보세요."],
  ["동의 없는 성관계나 성폭력 피해를 입은 분","강제로 당했거나 거절할 수 없었던 경우는 결코 당신의 잘못이 아닙니다. 각 도도부현에 있는 성범죄·성폭력 피해자를 위한 원스톱 지원센터(전국 공통 무료 다이얼 #8891)에 전화하면, 응급피임약 비용이 무료(공적 부담)가 되는 제도나 병원 동행 등의 지원을 받을 수 있습니다. 혼자 끌어안지 말고 우선 상담해 주세요."]

 r1pointst:"약국에서 사기 위한 세 가지 포인트",
 r1points:[
  ["1. 취급하는 약국을 미리 찾아 둘 것","모든 약국에 있는 것은 아닙니다. 후생노동성 홈페이지에 실린 판매 가능한 약국을 찾고, 가기 전에 반드시 전화로 재고가 있는지, 지금 가면 대응할 수 있는 약사가 있는지 확인하세요."],
  ["2. 본인이 갈 것(대리 불가)","반드시 약을 복용할 본인이 약국에 가세요. 파트너나 부모 등 대리인이 살 수는 없습니다."],

 r1prept:"가기 전 준비",

 r2w2d:"자비 진료를 하는 일부 클리닉에서는 진료 후 약 자체를 집으로 우편이나 퀵서비스 등으로 보내 주는 서비스를 하고 있습니다. 도저히 외출할 수 없다, 근처에 문을 연 약국이 없다 같은 경우에 큰 도움이 되는 선택지입니다. 빠르면 당일이나 다음 날 우편함에 도착하기도 합니다.",
 r2cautiont:"배송 서비스를 이용할 때의 주의점",

 faqtitle:"常见问题",
 faq:[
  ["需要身份证件吗","并没有规定必须携带。不过为了确认年龄等，有时会被要求出示。有的话带上会更安心。若手头没有，先在现场咨询即可。"],
  ["父母会知道吗","无论年龄大小，都不需要父母同意。药店也不会联系家里。"],
  ["未满16岁也能买吗","没有年龄限制。不过在药店有时会被建议去妇产科。这并不是拒绝，在医院也能拿到同样的药。有时一开始就去妇产科反而更快。"],
  ["可以让别人代买吗","很遗憾不可以。规定必须由要服药的本人前往，并在药剂师面前服用。"],
  ["可以寄到家里吗","在提供在线问诊的自费诊疗诊所中，有些会把药寄到家里。在难以外出时很有帮助。使用前请确认三点。第一，什么时候送达，能否赶上72小时的期限很关键。第二，是否为日本已批准的药。作为120小时用介绍的醋酸乌利司他在日本尚未批准。第三，未获批准的药物，万一身体出现不适，也不属于国家救济制度的对象。另外，国家指南所示的方式是在药店领取并在药剂师面前服用。"],
  ["能在药妆店的网店买吗","不能。在药店购买需要到店与药剂师当面沟通。从海外个人进口的药物有假货风险，出现健康损害也不属于国家救济制度的对象。"],
  ["能100%防止怀孕吗","很遗憾并非100%。服用后仍可能怀孕。服药三周后，请用验孕棒或到医疗机构确认。"],
  ["有副作用吗","可能出现恶心、头痛、下腹痛、不规则出血等。若服药后2小时内呕吐，请咨询药剂师或医生。"],

 specnote:"Giá là giá bán lẻ đề xuất và có thể khác nhau tùy nhà thuốc. Nguồn: Bộ Y tế, Lao động và Phúc lợi; Hội Dược sĩ Nhật Bản; tờ hướng dẫn sử dụng của từng sản phẩm.",
 faqtitle:"Câu hỏi thường gặp",
 faq:[
  ["Có cần giấy tờ tùy thân không?","Không có quy định bắt buộc phải có. Tuy nhiên bạn có thể được yêu cầu cho xem để xác nhận tuổi. Nếu có thì mang theo sẽ yên tâm hơn. Nếu không có, cứ hỏi ngay tại chỗ."],
  ["Bố mẹ có biết không?","Bất kể tuổi nào, bạn không cần sự đồng ý của bố mẹ. Nhà thuốc cũng không liên hệ về nhà bạn."],
  ["Dưới 16 tuổi có mua được không?","Không có giới hạn tuổi. Tuy nhiên tại nhà thuốc bạn có thể được khuyên đến phòng khám sản phụ khoa. Đó không phải là từ chối — ở bệnh viện bạn cũng nhận được đúng loại thuốc đó. Đôi khi đến thẳng phòng khám lại nhanh hơn."],
  ["Người khác mua giúp được không?","Rất tiếc là không. Quy định là chính người sẽ uống thuốc phải đến và uống trước mặt dược sĩ."],
  ["Có thể gửi về nhà không?","Một số phòng khám tự chi trả có khám trực tuyến sẽ gửi thuốc về tận nhà. Điều này giúp ích khi bạn khó ra ngoài. Trước khi dùng, hãy kiểm tra ba điều. Thứ nhất, khi nào thuốc tới — có kịp trong 72 giờ không. Thứ hai, đó có phải thuốc được cấp phép tại Nhật không. Ulipristal acetate, được giới thiệu dùng trong 120 giờ, chưa được cấp phép ở Nhật. Thứ ba, thuốc chưa được cấp phép sẽ không thuộc diện được chế độ cứu trợ của nhà nước hỗ trợ nếu có vấn đề sức khỏe. Ngoài ra, hướng dẫn của nhà nước nêu cách nhận thuốc tại nhà thuốc và uống trước mặt dược sĩ."],
  ["Mua qua trang bán hàng của hiệu thuốc được không?","Không được. Nếu mua tại nhà thuốc, bạn phải đến nơi và trao đổi trực tiếp với dược sĩ. Thuốc nhập khẩu cá nhân từ nước ngoài có nguy cơ là hàng giả, và nếu gây hại sức khỏe cũng không thuộc diện được chế độ cứu trợ của nhà nước hỗ trợ."],
  ["Có ngăn được thai 100% không?","Rất tiếc là không. Vẫn có thể mang thai. Ba tuần sau khi uống, hãy kiểm tra bằng que thử thai hoặc tại cơ sở y tế."],
  ["Có tác dụng phụ không?","Có thể buồn nôn, đau đầu, đau bụng dưới, ra máu bất thường. Nếu bạn nôn trong vòng 2 giờ sau khi uống, hãy hỏi dược sĩ hoặc bác sĩ."],
  ["Tôi đã quá 72 giờ rồi","Nhà thuốc không bán được, nhưng phòng khám sản phụ khoa đôi khi có thể trao đổi về cách dùng trong khoảng từ 72 đến 120 giờ. Xin đừng bỏ cuộc, hãy thử hỏi."]
 ],
 aftertitle:"Về tác dụng phụ",
 afterbody1:"Sau khi uống, bạn có thể buồn nôn hoặc đau đầu một thời gian, nhưng thường dịu đi trong vài giờ đến một ngày. Nếu bạn nôn trong vòng 2 giờ sau khi uống, thuốc có thể chưa được hấp thu, nên hãy hỏi bác sĩ hoặc dược sĩ ngay.",
 secrett:"Bí mật của bạn được giữ kín",
 secretd:"Dược sĩ và bác sĩ có nghĩa vụ bảo mật. Thông tin sẽ không được chuyển tới gia đình, trường học hay nơi làm việc của bạn. Nếu họ giới thiệu một tổ chức hỗ trợ, việc đó cũng chỉ tiến hành sau khi có sự đồng ý của bạn.",
 r3d2:"Về nguyên tắc, nếu là chính người sẽ uống thuốc thì có thể khám và được kê đơn, bất kể tuổi tác. Tuy nhiên một số cơ sở có thể yêu cầu giấy đồng ý của người giám hộ hoặc yêu cầu đi cùng nếu bạn chưa thành niên, nên hãy gọi điện hỏi trước rồi mới đến.",
 r3meritt:"Lợi ích khi đến phòng khám sản phụ khoa",
 r3meritd1:"Điều yên tâm nhất là được gặp trực tiếp bác sĩ và hỏi ngay tại chỗ những điều bạn đang lo lắng.",
 r3meritd2:"Ngoài cách uống thuốc và tác dụng phụ, nếu muốn bạn còn có thể trao đổi về xét nghiệm bệnh lây qua đường tình dục, khám phụ khoa, và cách tránh thai chắc chắn về sau (như thuốc tránh thai hằng ngày hoặc vòng Mirena).",
 r3meritd3:"Bạn không cần băn khoăn rằng chuyện thế này có nên đi khám không, hay có bị mắng không. Bác sĩ khám để bảo vệ cơ thể và tinh thần của bạn.",
 r3recot:"Những trường hợp nên đến phòng khám sản phụ khoa",
 r3recod:"Nếu bạn thuộc các trường hợp sau, đến thẳng phòng khám sản phụ khoa thường chắc chắn và suôn sẻ hơn so với khám trực tuyến hay mua ở nhà thuốc.",
 r3reco:[
  ["Đã quá 72 giờ kể từ khi quan hệ","Có những phòng khám sản phụ khoa cung cấp loại thuốc có thể còn hiệu quả trong vòng 120 giờ (5 ngày), thay vì loại thông thường ở Nhật phải dùng trong 72 giờ."],
  ["Người dưới 16 tuổi (ví dụ học sinh cấp hai)","Khám trực tuyến hoặc nhà thuốc có thể từ chối vì lý do tuổi và khuyên bạn đến phòng khám sản phụ khoa. Nếu gần nhà có phòng khám, đến hỏi trực tiếp đôi khi nhanh hơn. Đây là khám tự chi trả, không dùng thẻ bảo hiểm y tế, và nếu bạn không muốn gia đình biết thì cũng có thể trao đổi luôn điều đó."],
  ["Người bị quan hệ không có sự đồng thuận hoặc bị bạo lực tình dục","Nếu bạn bị ép buộc, hoặc không thể từ chối, đó hoàn toàn không phải lỗi của bạn. Mỗi tỉnh thành đều có Trung tâm hỗ trợ một cửa dành cho nạn nhân của tội phạm tình dục và bạo lực tình dục (số miễn phí toàn quốc #8891). Gọi tới đó, bạn sẽ được biết về chế độ chi trả bằng ngân sách công giúp miễn phí tiền thuốc, và được hỗ trợ như đi cùng đến bệnh viện. Xin đừng ôm một mình, hãy liên hệ trước đã."]
 ],
 r1pointst:"Ba điểm quan trọng khi mua ở nhà thuốc",
 r1points:[
  ["1. Tìm trước nhà thuốc có bán","Không phải nhà thuốc nào cũng có. Hãy tìm nhà thuốc trong danh sách trên trang của Bộ Y tế, và trước khi đi nhất định gọi điện xác nhận còn thuốc không, và bây giờ đến thì có dược sĩ tiếp nhận không."],
  ["2. Chính bạn phải đi (không nhờ người khác)","Nhất định người sẽ uống thuốc phải đến nhà thuốc. Bạn đời, bố mẹ hay người khác không thể mua thay."],
  ["3. Uống trước mặt dược sĩ","Bạn không thể mang thuốc đã mua về nhà. Để việc uống thuốc diễn ra an toàn, chắc chắn và sớm nhất có thể, bạn sẽ uống ở nơi kín đáo trong nhà thuốc, ngay trước mặt dược sĩ."]
 ],
 r1prept:"Chuẩn bị trước khi đi",
 r1prepd1:"Bạn có thể được yêu cầu xuất trình giấy tờ tùy thân như thẻ My Number hoặc thẻ bảo hiểm y tế. Không bắt buộc, nhưng xác nhận trước sẽ yên tâm hơn.",
 r1prepd2:"Khi mua, dược sĩ sẽ hỏi những điều như thời điểm quan hệ, kỳ kinh cuối là khi nào, tiền sử dị ứng, thuốc đang dùng. Ghi sẵn ra giấy sẽ nhanh hơn.",
 r2ways:"Bạn có thể nhận tại nhà thuốc do mình chỉ định, hoặc nhận qua đường bưu điện gửi về nhà.",
 r2w1t:"Nhận tại nhà thuốc (cách theo hướng dẫn của nhà nước)",
 r2w1d:"Sau khi khám trực tuyến, bác sĩ kê đơn và bạn đến nhà thuốc đã chỉ định để lấy thuốc. Bạn nghe dược sĩ giải thích và uống ngay tại chỗ, trước mặt dược sĩ. Đây là cách nguyên tắc được quy định trong hướng dẫn của Bộ Y tế.",
 r2w2t:"Gửi về hộp thư tại nhà (dịch vụ gửi thuốc của phòng khám tự chi trả)",
 r2w2d:"Một số phòng khám tự chi trả có dịch vụ gửi chính thuốc về nhà bạn qua bưu điện hoặc chuyển phát nhanh sau khi khám. Đây là lựa chọn rất hữu ích khi bạn không thể ra ngoài, hoặc gần nhà không có nhà thuốc nào đang mở. Nhanh thì có thể tới hộp thư ngay trong ngày hoặc hôm sau.",
 r2cautiont:"Lưu ý khi dùng dịch vụ gửi thuốc",
 r2cautiond:"Dịch vụ gửi thuốc rất tiện, nhưng có vài điều mong bạn lưu ý. Thuốc tránh thai khẩn cấp cần được uống càng sớm càng tốt, trong vòng 72 giờ sau quan hệ (với một số thuốc là 120 giờ). Khi gửi qua bưu điện, có rủi ro thuốc tới muộn và không kịp thời hạn. Khi sử dụng, nhất định phải xác nhận khi nào thuốc thực sự tới tay bạn (là ngày nhận, không phải ngày gửi). Ngoài ra, tuyệt đối không dùng các trang nhập khẩu cá nhân từ nước ngoài, vì thuốc tới chậm và có nguy cơ là hàng giả. Hãy luôn chọn dịch vụ mà bạn được bác sĩ trong nước khám.",

  ["१६ वर्षमुनिका (जस्तै माध्यमिक तहका विद्यार्थी)","अनलाइन परामर्श वा फार्मेसीले उमेरका कारण सेवा दिन नमानी क्लिनिक जान सुझाव दिन सक्छन्। घर नजिकै क्लिनिक भए सिधै गएर सोध्दा छिटो हुन सक्छ। स्वास्थ्य बिमा कार्ड नचल्ने निजी खर्चको जाँच हो, तर परिवारलाई थाहा नहोस् भन्ने चाहना भए त्यो पनि सँगै भन्न सकिन्छ।"],
  ["सहमतिबिनाको यौन सम्पर्क वा यौन हिंसा भोगेका","जबरजस्ती भएको वा अस्वीकार गर्न नसकेको अवस्था कहिल्यै तपाईंको गल्ती होइन। हरेक प्रान्तमा रहेको यौन अपराध तथा यौन हिंसा पीडितका लागि वन-स्टप सहयोग केन्द्र (देशभर निःशुल्क नम्बर #8891) मा फोन गर्दा, आपत्कालीन गर्भनिरोधक औषधिको खर्च निःशुल्क (सरकारी खर्च) हुने व्यवस्था र अस्पतालसम्म साथ जाने जस्ता सहयोग पाइन्छ। एक्लै नबोकी पहिले सम्पर्क गर्नुहोस्।"]
 ],
 r1pointst:"फार्मेसीबाट किन्नका तीन कुरा",
 r1points:[
  ["१. राख्ने फार्मेसी पहिल्यै खोज्ने","सबै फार्मेसीमा हुँदैन। स्वास्थ्य मन्त्रालयको वेबसाइटमा भएको बिक्री गर्न मिल्ने फार्मेसीको सूचीबाट खोज्नुहोस्, र जानुअघि अनिवार्य फोन गरेर औषधि छ कि छैन, अहिले गए सेवा दिन सक्ने फार्मासिस्ट छन् कि भनी पक्का गर्नुहोस्।"],
  ["२. आफैं जाने (अरूले मिल्दैन)","अनिवार्य रूपमा औषधि खाने व्यक्ति आफैं फार्मेसी जानुहोस्। साथी, आमाबुबा वा अरू कसैले किनिदिन मिल्दैन।"],
  ["३. फार्मासिस्टको अगाडि खाने","किनेको औषधि घर लैजान मिल्दैन। सुरक्षित र पक्का रूपमा सकेसम्म चाँडो खुवाउन, फार्मेसीभित्र गोपनीयता हुने ठाउँमा फार्मासिस्टकै अगाडि औषधि खुवाइन्छ।"]

 r1prept:"जानुअघिको तयारी",
 r1prepd1:"माइ नम्बर कार्ड वा स्वास्थ्य बिमा कार्ड जस्ता परिचयपत्र देखाउन भनिन सक्छ। अनिवार्य होइन, तर पहिल्यै पक्का गर्दा ढुक्क हुन्छ।",
 r1prepd2:"किन्दा फार्मासिस्टले यौन सम्पर्क भएको मिति र समय, अन्तिम महिनावारी कहिले भएको, एलर्जीको इतिहास, खाइरहेको औषधि आदि सोध्छन्। टिपोट गरेर लगे सहज हुन्छ।",
 r2ways:"आफैंले तोकेको फार्मेसीबाट लिन सकिन्छ, वा घरमा पठाइएको औषधि प्राप्त गर्न सकिन्छ।",
 r2w1t:"फार्मेसीमा गएर लिने तरिका (राष्ट्रिय निर्देशिकाअनुसार)",
 r2w1d:"अनलाइन परामर्शपछि डाक्टरले प्रिस्क्रिप्सन दिन्छन् र तोकिएको फार्मेसीमा गएर औषधि लिनुहुन्छ। फार्मेसीमा फार्मासिस्टको व्याख्या सुनेर त्यहीँ (फार्मासिस्टकै अगाडि) औषधि खानुहुन्छ। स्वास्थ्य मन्त्रालयको निर्देशिकाले तोकेको सिद्धान्तगत तरिका यही हो।",
 r2w2t:"घरको पत्रपेटीमा पठाइदिने तरिका (निजी क्लिनिकको पठाउने सेवा)",
 r2w2d:"निजी खर्चमा सेवा दिने केही क्लिनिकले परामर्शपछि औषधि नै घरमा हुलाक वा कुरियरबाट पठाइदिने सेवा दिन्छन्। कुनै हालतमा बाहिर निस्कन नसक्ने, वा नजिकै खुलेको फार्मेसी नभएको अवस्थामा यो निकै सहयोगी विकल्प हो। छिटो भए सोही दिन वा भोलिपल्ट पत्रपेटीमा आइपुग्न सक्छ।",
 r2cautiont:"पठाउने सेवा प्रयोग गर्दाका सावधानी",
 r2cautiond:"पठाउने सेवा निकै सजिलो भए पनि केही कुरामा ध्यान दिनुहोस्। आपत्कालीन गर्भनिरोधक औषधि यौन सम्पर्कपछि ७२ घण्टाभित्र (कुनै औषधिको हकमा १२० घण्टाभित्र) सकेसम्म चाँडो खानु महत्त्वपूर्ण हुन्छ। पठाइने अवस्थामा आइपुग्न समय लागेर समयसीमा नभ्याउने जोखिम हुन्छ। प्रयोग गर्दा औषधि कहिले आफ्नो हातमा आइपुग्छ (पठाएको मिति होइन, आइपुग्ने मिति) अनिवार्य रूपमा पक्का गर्नुहोस्। साथै विदेशबाट व्यक्तिगत रूपमा मगाउने साइट ढिलो आइपुग्ने र नक्कली हुन सक्ने भएकाले कदापि प्रयोग नगर्नुहोस्। सधैं देशभित्रैका डाक्टरको जाँच पाइने सेवा छान्नुहोस्।",

function buildLangBar(){
  var ul=document.getElementById("langs");
  ul.innerHTML="";
  LANGS.forEach(function(L){
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.type="button";
    b.textContent=L.name;
    b.setAttribute("lang", L.htmlLang);
    b.setAttribute("aria-current", L.code===cur ? "true" : "false");
    b.addEventListener("click", function(){ setLang(L.code, true); });
    li.appendChild(b); ul.appendChild(li);
  });
}

function setLang(code, save){
  cur = T[code] ? code : "ja";
  if(save){
    try{ localStorage.setItem("lang", cur); }catch(e){}
    if(history.replaceState) history.replaceState(null,"","#"+cur);
    else location.hash = cur;
  }
  buildLangBar();
  render();
}

/* 言語の決め方: URLの #xx → 保存された選択 → ブラウザの言語 → 日本語 */
function pickLang(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(T[h]) return h;
  try{ var s=localStorage.getItem("lang"); if(s && T[s]) return s; }catch(e){}
  var navs=(navigator.languages||[navigator.language||""]);
  for(var i=0;i<navs.length;i++){
    var t=(navs[i]||"").toLowerCase();
    if(t.indexOf("ja")===0) return "ja";
    if(t.indexOf("ko")===0) return "ko";
    if(t.indexOf("zh")===0) return "zh";
    if(t.indexOf("vi")===0) return "vi";
    if(t.indexOf("ne")===0) return "ne";
    if(t.indexOf("ms")===0||t.indexOf("id")===0) return "ms";
    if(t.indexOf("en")===0) return "en";
  }
  return "ja";
}

/* ===== カウントダウン ===== */
var LIMIT_H = 72;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tick(){
  var d = T[cur] || T.ja;
  function g(k){ return (d[k]!==undefined) ? d[k] : T.ja[k]; }
  var v = document.getElementById("when").value;
  var num = document.getElementById("cdnum");
  var note = document.getElementById("cdnote");
  var bar = document.getElementById("cdbar");
  var over = document.getElementById("overbox");
  var cap = document.getElementById("t-cdcap");
  ["row1","row2","row3"].forEach(function(id){ document.getElementById(id).className=""; });

  if(!v){
    cap.hidden = true;
    num.innerHTML = "—";
    num.style.fontSize = "38px";
    note.textContent = g("cdempty");
    bar.style.width = "0";
    over.hidden = true;
    return;
  }
  var start = new Date(v).getTime();
  if(isNaN(start)){ cap.hidden = true; num.innerHTML="—"; note.textContent=g("cdempty"); return; }

  var elapsedH = (Date.now()-start)/3600000;
  var leftMs = start + LIMIT_H*3600000 - Date.now();

  var pct = "";
  if(elapsedH < 24){ document.getElementById("row1").className="hit"; pct="95%"; }
  else if(elapsedH < 48){ document.getElementById("row2").className="hit"; pct="85%"; }
  else if(elapsedH <= 72){ document.getElementById("row3").className="hit"; pct="58%"; }

  if(leftMs <= 0){
    cap.hidden = true;
    num.textContent = g("cdover");
    num.style.fontSize = "30px";
    note.textContent = "";
    bar.style.width = "0";
    over.hidden = false;
    return;
  }
  over.hidden = true;
  cap.hidden = false;
  var h = Math.floor(leftMs/3600000);
  var m = Math.floor((leftMs%3600000)/60000);
  var pre = g("cdprefix");
  num.style.fontSize = "52px";
  num.innerHTML = (pre ? esc(pre)+" " : "")
    + h + '<span class="u">' + esc(g("cdh")) + '</span>'
    + m + '<span class="u">' + esc(g("cdm")) + '</span>';
  bar.style.width = Math.max(0, Math.min(100, leftMs/(LIMIT_H*3600000)*100)) + "%";
  note.textContent = pct ? g("cdnow").replace("{p}", pct) : g("cdnote");
}

/* ===== 退避ボタン：履歴を残さず別サイトへ移動 ===== */
document.getElementById("exitbtn").addEventListener("click", function(){
  try{ localStorage.removeItem("lang"); }catch(e){}
  location.replace("https://weather.yahoo.co.jp/weather/");
});

document.getElementById("when").addEventListener("input", tick);
document.getElementById("when").addEventListener("change", tick);
window.addEventListener("hashchange", function(){ setLang(pickLang(), false); });
setInterval(tick, 30000);

setLang(pickLang(), false);
</script>
