<style>
/* 配色は前身サイト（Manus版）の値をそのまま使っています。
   oklch(58% .18 42) = #cd4900 が主色、背景のクリームが #fff7ed。

   1点だけ変えています: #cd4900 をクリーム地の「文字色」に使うと 4.35:1 で
   基準割れするため、文字用に少し濃い --brand-text (#bc4200) を用意しました。
   塗り（ボタン等）の白抜きは #cd4900 のままで 4.62:1 を満たします。 */
:root {
  color-scheme: light;
  --wrap-pad: 22px;
  --paper: #fff7ed;
  --surface: #ffffff;
  --surface-soft: #fff3e6;
  --card: #fcfcfa;

  /* オレンジは3段階で使い分けます。
     --brand-vivid  鮮やかな見せ色。大きい文字と、文字を載せない塗りだけに使う
                    （白文字15pxを載せると 3.56:1 で基準割れするため）
     --brand        ボタンなど、白文字を載せる塗り（4.62:1）
     --brand-text   クリーム地に置く文字色（5.05:1） */
  --brand-vivid: #ea580c;
  --brand: #cd4900;
  --brand-text: #bc4200;
  --brand-dark: #a63900;
  --brand-tint: #ffe4cc;
  --ink: #0b0b0d;
  --ink-2: #2d2d33;
  --ink-3: #626369;
  --line: #dfdeda;
  --line-strong: #c9c7c1;
  --accent: #bc4200;
  --accent-hover: #a63900;
  --focus: #a63900;
  --ok: #14663f;
  --mid: #8a3f31;
  --low: #8a4a1c;
  --radius: 8px;
  --radius-small: 8px;
  --shadow: 0 1px 3px rgba(11, 11, 13, 0.06);

  /* 帯や淡い面に使う色。名前は従来のまま残し、中身をオレンジ系に差し替えています */
  --blue: var(--brand);
  --blue-soft: var(--surface-soft);
  --blue-line: var(--line);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family:
    system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Hiragino Sans", "Yu Gothic", "Malgun Gothic",
    "Microsoft YaHei", "Nirmala UI", "Kohinoor Devanagari", sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.75;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

button,
input {
  font: inherit;
}

button,
a {
  touch-action: manipulation;
}

a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

a:not(.btn) {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
}

/* 帯（全幅の背景）と、その中の読みやすい幅の欄。
   白と、うっすらしたベージュ #f3f2ee を交互に置きます（前身サイトと同じ組み方）。 */
.band {
  padding-block: clamp(44px, 9vw, 72px);
  background: var(--surface);
}

.band.tint {
  background: var(--surface-soft);
}

.band > .inner {
  width: min(100%, 680px);
  margin-inline: auto;
  padding-inline: var(--wrap-pad);
}

/* 冒頭は温かいクリームから白へ。上端に鮮やかなオレンジの帯を入れて、
   ページを開いた瞬間に色が目に入るようにしています。 */
.hero {
  position: relative;
  background: linear-gradient(180deg, #ffe8d6 0, var(--surface) 100%);
}

.hero::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 5px;
  background: var(--brand-vivid);
}

/* 見出しの上に鮮やかなオレンジの短い線を置く */
h2::before {
  content: "";
  display: block;
  width: 36px;
  height: 4px;
  margin-bottom: 16px;
  border-radius: 999px;
  background: var(--brand-vivid);
}

/* 見出しの上に置く小さなラベル。ピル形のバッジで見せます */
.label {
  display: inline-flex;
  align-items: center;
  margin: 0 0 18px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--brand-tint);
  color: var(--brand-dark);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

h1 {
  max-width: 15em;
  margin: 0 0 20px;
  font-size: clamp(1.85rem, 7.2vw, 2.75rem);
  font-weight: 600;
  line-height: 1.42;
  letter-spacing: 0.01em;
}

/* 見出しの上の余白は帯（.band の padding-block）が持つので、ここでは付けない */
h2 {
  margin: 0 0 22px;
  color: var(--ink);
  font-size: clamp(1.2rem, 4.8vw, 1.4rem);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

h3 {
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.45;
}

p {
  margin: 0 0 14px;
}

small {
  display: block;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.75;
}

.lead {
  max-width: 42em;
  color: var(--ink-2);
  font-size: 16px;
  line-height: 1.9;
}

.langbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.langbar ul {
  display: flex;
  flex-wrap: wrap;            /* 7言語すべてを画面内に表示する（横スクロールにしない） */
  justify-content: center;
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 0;
  gap: 4px;
  list-style: none;
}

.langbar li {
  flex: 0 0 auto;
}

.langbar button {
  min-width: 48px;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.langbar button:hover {
  background: var(--brand-tint);
  color: var(--brand-dark);
}

.langbar button[aria-current="true"] {
  border-color: var(--brand);
  background: var(--brand);
  color: #ffffff;
}

.tophint {
  margin: 0;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-soft);
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.6;
  text-align: center;
}

/* 冒頭は余白を大きくとる。装飾は置かず、文字の階層だけで見せる。 */
.hero {
  padding-block: clamp(44px, 10vw, 80px) clamp(40px, 9vw, 64px);
}

/* カウントダウンは帯そのものが青の面になるため、ここでは箱を持たない */
.focal {
  margin: 0;
}

.focal label {
  display: block;
  margin-bottom: 12px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.6;
}

.focal input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}

.focal input:focus {
  border-color: var(--accent);
  outline: 3px solid rgba(36, 79, 94, 0.22);
  outline-offset: 2px;
}

.cdnum {
  margin: 24px 0 0;
  color: var(--brand-vivid);
  font-size: clamp(2.5rem, 12vw, 4rem);
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  line-height: 1.08;
  letter-spacing: -0.04em;
  word-break: normal;
}

.cdnum .u {
  display: inline-block;
  margin: 4px 5px 0;
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 0;
}

.bar {
  position: relative;
  height: 6px;
  margin: 22px 0 14px;
  overflow: hidden;
  border-radius: 999px;
  background: #f3ddc8;
}

.bar i {
  position: absolute;
  inset: 0 auto 0 0;
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--brand-vivid);
  transition: width 0.4s ease;
}

.cdnote {
  margin: 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.75;
}

table.eff {
  width: 100%;
  margin: 0 0 12px;
  border-spacing: 0 7px;
  border-collapse: separate;
  table-layout: fixed;
  font-size: 15px;
}

table.eff th {
  padding: 0 10px 7px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-align: left;
  text-transform: uppercase;
}

table.eff th:last-child {
  text-align: right;
}

table.eff td {
  padding: 14px 10px;
  border-block: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

table.eff td:first-child {
  border-left: 1px solid var(--line);
  border-radius: var(--radius-small) 0 0 var(--radius-small);
}

table.eff td:last-child {
  border-right: 1px solid var(--line);
  border-radius: 0 var(--radius-small) var(--radius-small) 0;
  color: var(--ink);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  text-align: right;
}

table.eff tr.hit td {
  border-color: #e9b48f;
  background: var(--brand-tint);
  color: var(--ink);
}

/* 詳細度を table.eff tr.hit td と同じ (0,2,3) に上げ、記述順で勝たせる。
   これがないと 95%/85%/58% の色分けが打ち消されます。 */
table.eff tr td.v1 {
  color: var(--ok);
}

table.eff tr td.v2 {
  color: var(--mid);
}

table.eff tr td.v3 {
  color: var(--low);
}

/* 経路は前身サイトと同じくカードで見せる（白・角丸8px・細い枠・浅い影） */
.routes {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.route {
  min-width: 0;
  padding: clamp(20px, 5.5vw, 28px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}

.route .no {
  display: block;
  margin-bottom: 12px;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.14em;
  font-variant-numeric: tabular-nums;
}

.route .hd {
  display: flex;
  min-width: 0;
  margin-bottom: 11px;
  gap: 8px 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.route .hd > * {
  min-width: 0;
}

.route .price {
  margin-left: auto;
  color: var(--ink-2);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.route p {
  margin: 0 0 19px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
}

.route .tag {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  margin: 0 0 14px;
  padding: 7px 12px;
  border: 0;
  border-radius: 999px;
  background: var(--brand-tint);
  color: var(--brand-dark);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
}

.btn {
  display: flex;
  width: 100%;
  min-height: 52px;
  padding: 13px 17px;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--brand);
  border-radius: var(--radius-small);
  background: var(--brand);
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.btn:hover,
.btn:focus {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
}

.btn::after {
  content: "→";
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1;
}

.btn.sub {
  border-color: var(--accent);
  background: transparent;
  color: var(--accent);
}

.btn.sub:hover,
.btn.sub:focus {
  background: var(--accent);
  color: #ffffff;
}

.btn + .btn {
  margin-top: 10px;
}

.know {
  border-top: 1px solid var(--line);
}

.know .item {
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}

.know .item p {
  margin: 8px 0 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 帯の中の囲み。相談窓口は白地の箱、72時間超のお知らせは線で強調する。 */
.callout {
  padding: clamp(22px, 5.5vw, 30px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}

.callout.alert {
  border-color: var(--brand);
  border-left-width: 4px;
  background: var(--brand-tint);
}

.callout p {
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

.callout .btn.sub {
  border-color: var(--accent);
  background: var(--surface);
  color: var(--accent);
}

.callout .btn.sub:hover,
.callout .btn.sub:focus {
  background: var(--accent);
  color: #ffffff;
}

/* ===== ここから、前身サイトにあった4つの内容を作り直したもの ===== */

/* 購入の流れ: 経路ごとの手順を番号つきで分解して見せる */
.steps {
  display: grid;
  margin-top: 26px;
  gap: 16px;
}

.stepgroup {
  padding: clamp(20px, 5.5vw, 28px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}

.stepgroup h3 {
  margin-bottom: 16px;
}

.stepgroup ol {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: step;
}

.stepgroup li {
  position: relative;
  padding: 0 0 18px 40px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.8;
  counter-increment: step;
}

/* 手順どうしを縦線でつなぐ（最後の1つには引かない） */
.stepgroup li::before {
  content: counter(step);
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  width: 26px;
  height: 26px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-tint);
  color: var(--brand-dark);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stepgroup li::after {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 4px;
  left: 13px;
  width: 1px;
  background: var(--line);
}

.stepgroup li:last-child {
  padding-bottom: 0;
}

.stepgroup li:last-child::after {
  display: none;
}

/* 服用前チェック: 「してはいけない」と「相談して」の2群 */
.checkgroup + .checkgroup {
  margin-top: 26px;
}

.checkgroup h3 {
  margin-bottom: 6px;
}

.checkgroup > p {
  margin: 0 0 14px;
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1.75;
}

.checklist {
  margin: 0;
  padding: 0;
  list-style: none;
}

.checklist li {
  position: relative;
  padding: 13px 0 13px 32px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.75;
}

.checklist li::before {
  position: absolute;
  top: 13px;
  left: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.75;
}

.checklist.no li::before {
  content: "\00d7";
  color: var(--brand-text);
}

.checklist.ask li::before {
  content: "!";
  color: var(--ink-3);
}

/* 授乳中は「飲めない」ではなく「気をつけてほしい」ことなので、
   × ではなく落ち着いた印にしています。 */
.checklist.note li::before {
  content: "!";
  top: 15px;
  display: flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-tint);
  color: var(--brand-dark);
  font-size: 12px;
  line-height: 1;
}

/* よくある質問 */
.faq {
  margin-top: 26px;
  border-top: 1px solid var(--line);
}

.faq details {
  border-bottom: 1px solid var(--line);
}

.faq summary {
  display: flex;
  min-height: 56px;
  padding: 16px 32px 16px 0;
  gap: 12px;
  align-items: center;
  color: var(--ink);
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
  list-style: none;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::after {
  content: "+";
  position: absolute;
  right: 0;
  color: var(--brand-text);
  font-size: 20px;
  font-weight: 700;
}

.faq details[open] summary::after {
  content: "\2212";
}

.faq details {
  position: relative;
}

.faq .answer {
  margin: 0;
  padding: 0 0 20px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.85;
}

/* 製品情報の表 */
table.spec {
  width: 100%;
  margin-top: 26px;
  border-collapse: collapse;
  font-size: 15px;
}

table.spec th,
table.spec td {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  line-height: 1.7;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

table.spec th {
  width: 38%;
  padding-right: 14px;
  color: var(--ink-3);
  font-size: 14px;
  font-weight: 700;
}

table.spec td {
  color: var(--ink-2);
}

footer {
  padding-top: 4px;
}

footer h3 {
  margin-bottom: 14px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

footer p {
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.85;
}

.exitbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 9px 18px;
  border-top: 1px solid var(--line);
  background: rgba(252, 252, 250, 0.94);
  text-align: right;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.exitbtn {
  min-height: 48px;
  padding: 10px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
}

.exitbtn:hover {
  border-color: var(--accent);
  background: var(--blue-soft);
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

[hidden] {

  ["16歳未満でも買えますか","年齢による制限はありません。ただ薬局では、産婦人科をすすめられることがあります。断られたということではなく、病院でも同じお薬をもらえます。はじめから産婦人科に行くほうが早いこともあります。"],
  ["かわりに買ってきてもらえますか","残念ながらできません。お薬を飲む本人が行って、薬剤師さんの前で飲む決まりになっています。"],

  ["ドラッグストアの通販で買えますか","買えません。薬局・ドラッグストアで買う場合は、お店に行って薬剤師さんと対面でのやりとりが必要です。海外から個人輸入したお薬は、偽物のおそれがあり、健康被害が出ても日本の救済制度の対象になりません。"],
  ["100%妊娠を防げますか","残念ながら、100%ではありません。飲んでも妊娠することがあります。飲んでから3週間後に、妊娠検査薬か医療機関で確かめてください。"],
  ["副作用はありますか","吐き気、頭痛、下腹部の痛み、不正出血などが起こることがあります。飲んで2時間以内に吐いてしまったときは、薬剤師さんか医師に相談してください。"],
  ["72時間を過ぎてしまいました","薬局では買えませんが、産婦人科では72時間から120時間の間に使える方法を相談できることがあります。どうかあきらめずに、相談してみてください。"]

/* ============================================================

   ============================================================ */
var cur = "ja";
function txt(id, s){ var e=document.getElementById(id); if(e) e.textContent=s; }

function buildLangBar(){
  var ul=document.getElementById("langs");
  ul.innerHTML="";
  LANGS.forEach(function(L){
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.type="button";
    b.textContent=L.name;
    b.setAttribute("lang", L.htmlLang);
    b.setAttribute("aria-current", L.code===cur ? "true" : "false");
    b.addEventListener("click", function(){ setLang(L.code, true); });
    li.appendChild(b); ul.appendChild(li);
  });
}

function setLang(code, save){
  cur = T[code] ? code : "ja";
  if(save){
    try{ localStorage.setItem("lang", cur); }catch(e){}
    if(history.replaceState) history.replaceState(null,"","#"+cur);
    else location.hash = cur;
  }
  buildLangBar();
  render();
}

/* 言語の決め方: URLの #xx → 保存された選択 → ブラウザの言語 → 日本語 */
function pickLang(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(T[h]) return h;
  try{ var s=localStorage.getItem("lang"); if(s && T[s]) return s; }catch(e){}
  var navs=(navigator.languages||[navigator.language||""]);
  for(var i=0;i<navs.length;i++){
    var t=(navs[i]||"").toLowerCase();
    if(t.indexOf("ja")===0) return "ja";
    if(t.indexOf("ko")===0) return "ko";
    if(t.indexOf("zh")===0) return "zh";
    if(t.indexOf("vi")===0) return "vi";
    if(t.indexOf("ne")===0) return "ne";
    if(t.indexOf("ms")===0||t.indexOf("id")===0) return "ms";
    if(t.indexOf("en")===0) return "en";
  }
  return "ja";
}

/* ===== カウントダウン ===== */
var LIMIT_H = 72;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tick(){
  var d = T[cur] || T.ja;
  function g(k){ return (d[k]!==undefined) ? d[k] : T.ja[k]; }
  var v = document.getElementById("when").value;
  var num = document.getElementById("cdnum");
  var note = document.getElementById("cdnote");
  var bar = document.getElementById("cdbar");
  var over = document.getElementById("overbox");
  ["row1","row2","row3"].forEach(function(id){ document.getElementById(id).className=""; });

  if(!v){
    num.innerHTML = "—";
    num.style.fontSize = "38px";
    note.textContent = g("cdempty");
    bar.style.width = "0";
    over.hidden = true;
    return;
  }
  var start = new Date(v).getTime();
  if(isNaN(start)){ num.innerHTML="—"; note.textContent=g("cdempty"); return; }

  var elapsedH = (Date.now()-start)/3600000;
  var leftMs = start + LIMIT_H*3600000 - Date.now();

  var pct = "";
  if(elapsedH < 24){ document.getElementById("row1").className="hit"; pct="95%"; }
  else if(elapsedH < 48){ document.getElementById("row2").className="hit"; pct="85%"; }
  else if(elapsedH <= 72){ document.getElementById("row3").className="hit"; pct="58%"; }

  if(leftMs <= 0){
    num.textContent = g("cdover");
    num.style.fontSize = "30px";
    note.textContent = "";
    bar.style.width = "0";
    over.hidden = false;
    return;
  }
  over.hidden = true;
  var h = Math.floor(leftMs/3600000);
  var m = Math.floor((leftMs%3600000)/60000);
  var pre = g("cdprefix");
  num.style.fontSize = "52px";
  num.innerHTML = (pre ? esc(pre)+" " : "")
    + h + '<span class="u">' + esc(g("cdh")) + '</span>'
    + m + '<span class="u">' + esc(g("cdm")) + '</span>';
  bar.style.width = Math.max(0, Math.min(100, leftMs/(LIMIT_H*3600000)*100)) + "%";
  note.textContent = pct ? g("cdnow").replace("{p}", pct) : g("cdnote");
}

/* ===== 退避ボタン：履歴を残さず別サイトへ移動 ===== */
document.getElementById("exitbtn").addEventListener("click", function(){
  try{ localStorage.removeItem("lang"); }catch(e){}
  location.replace("https://weather.yahoo.co.jp/weather/");
});

document.getElementById("when").addEventListener("input", tick);
document.getElementById("when").addEventListener("change", tick);
window.addEventListener("hashchange", function(){ setLang(pickLang(), false); });
setInterval(tick, 30000);

setLang(pickLang(), false);
